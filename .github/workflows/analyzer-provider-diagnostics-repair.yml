name: Analyzer provider diagnostics repair

on:
  push:
    branches: [fix/analyzer-provider-diagnostics]
    paths: ['.github/workflows/analyzer-provider-diagnostics-repair.yml']

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analyzer-provider-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply diagnostic-only Analyzer error classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          marker = "// Strict Screenshot Analyzer provider call: exact AICREDITS endpoint/model/key, no model or key fallback.\nasync function queryAnalyzerProvider"
          helper = '''// Machine-readable Screenshot Analyzer provider failure classification.\n// This intentionally exposes only a coarse failure class + pipeline stage, never provider bodies or secrets.\nfunction getAnalyzerProviderFailureCode(error) {\n    const status = Number(error && error.statusCode);\n    if (error && error.isTimeout) return 'AI_PROVIDER_TIMEOUT';\n    if (error && error.code === 'AI_PROVIDER_CONFIG') return 'AI_PROVIDER_CONFIG';\n    if (status === 401 || status === 403) return 'AI_PROVIDER_AUTH';\n    if (status === 402) return 'AI_PROVIDER_BUDGET';\n    if (status === 429) return 'AI_PROVIDER_RATE_LIMIT';\n    if ([500, 502, 503, 504].includes(status)) return 'AI_PROVIDER_UPSTREAM';\n    if (error && error.code === 'AI_PROVIDER_EMPTY_RESPONSE') return 'AI_PROVIDER_EMPTY_RESPONSE';\n    return 'AI_PROVIDER_FAILURE';\n}\n\n'''
          assert marker in s, 'Analyzer provider marker not found'
          s = s.replace('// Strict Screenshot Analyzer provider call: exact AICREDITS endpoint/model/key, no model or key fallback.\n', helper + '// Strict Screenshot Analyzer provider call: exact AICREDITS endpoint/model/key, no model or key fallback.\n', 1)

          old_missing = '''    if (!apiKey) {\n        throw new Error(`Missing required Screenshot Analyzer API key for ${stage} stage.`);\n    }'''
          new_missing = '''    if (!apiKey) {\n        const err = new Error(`Missing required Screenshot Analyzer API key for ${stage} stage.`);\n        err.code = 'AI_PROVIDER_CONFIG';\n        err.analyzerStage = stage;\n        throw err;\n    }'''
          assert old_missing in s, 'Analyzer missing-key block not found'
          s = s.replace(old_missing, new_missing, 1)

          old_api_error = '''        if (data.error) {\n            throw new Error(`Screenshot Analyzer AI API Error: ${data.error.message || JSON.stringify(data.error)}`);\n        }\n        if (!data.choices || data.choices.length === 0) {\n            throw new Error(`Screenshot Analyzer AI API returned no choices for ${model}.`);\n        }'''
          new_api_error = '''        if (data.error) {\n            const err = new Error(`Screenshot Analyzer AI API Error: ${data.error.message || JSON.stringify(data.error)}`);\n            const numericStatus = Number(data.error.status || data.error.code);\n            if (Number.isFinite(numericStatus) && numericStatus > 0) err.statusCode = numericStatus;\n            throw err;\n        }\n        if (!data.choices || data.choices.length === 0) {\n            const err = new Error(`Screenshot Analyzer AI API returned no choices for ${model}.`);\n            err.code = 'AI_PROVIDER_EMPTY_RESPONSE';\n            throw err;\n        }'''
          assert old_api_error in s, 'Analyzer API-error block not found'
          s = s.replace(old_api_error, new_api_error, 1)

          old_empty = '''        if (!outputContent) {\n            throw new Error(`Screenshot Analyzer AI API returned empty content for ${model}.`);\n        }\n        return outputContent;\n    } catch (err) {\n        if (err.name === 'AbortError') {\n            const timeoutErr = new Error('Analysis timed out. Please try again.');\n            timeoutErr.isTimeout = true;\n            throw timeoutErr;\n        }\n        throw err;\n    } finally {'''
          new_empty = '''        if (!outputContent) {\n            const err = new Error(`Screenshot Analyzer AI API returned empty content for ${model}.`);\n            err.code = 'AI_PROVIDER_EMPTY_RESPONSE';\n            throw err;\n        }\n        return outputContent;\n    } catch (err) {\n        if (err.name === 'AbortError') {\n            const timeoutErr = new Error('Analysis timed out. Please try again.');\n            timeoutErr.isTimeout = true;\n            timeoutErr.analyzerStage = stage;\n            throw timeoutErr;\n        }\n        err.analyzerStage = err.analyzerStage || stage;\n        throw err;\n    } finally {'''
          assert old_empty in s, 'Analyzer empty/catch block not found'
          s = s.replace(old_empty, new_empty, 1)

          old_catch_head = '''    } catch (error) {\n        console.error("Pipeline breakdown:", error.message);\n        let currentBal = deduction ? deduction.remainingCredits : 0;'''
          new_catch_head = '''    } catch (error) {\n        console.error("Pipeline breakdown:", error.message);\n        const analyzerFailureStage = (error && error.analyzerStage) ? error.analyzerStage : 'pipeline';\n        const analyzerFailureCode = analyzerFailureStage === 'pipeline'\n            ? 'ANALYZER_PIPELINE_FAILURE'\n            : getAnalyzerProviderFailureCode(error);\n        let currentBal = deduction ? deduction.remainingCredits : 0;'''
          assert old_catch_head in s, 'Analyzer route catch head not found'
          s = s.replace(old_catch_head, new_catch_head, 1)

          old_timeout_response = '''        if (error.isTimeout || (error.message && error.message.includes("timed out"))) {\n            return res.status(504).json({\n                success: false,\n                error: "Analysis timed out. Your credits were restored.",\n                credits: currentBal\n            });\n        }\n        res.status(500).json({\n            success: false,\n            error: "AI analysis failed. Your credits were restored.",\n            credits: currentBal\n        });'''
          new_timeout_response = '''        if (error.isTimeout || (error.message && error.message.includes("timed out"))) {\n            return res.status(504).json({\n                success: false,\n                error: "Analysis timed out. Your credits were restored.",\n                code: analyzerFailureCode,\n                stage: analyzerFailureStage,\n                reqId: reqId,\n                credits: currentBal\n            });\n        }\n        res.status(500).json({\n            success: false,\n            error: "AI analysis failed. Your credits were restored.",\n            code: analyzerFailureCode,\n            stage: analyzerFailureStage,\n            reqId: reqId,\n            credits: currentBal\n        });'''
          assert old_timeout_response in s, 'Analyzer route generic response block not found'
          s = s.replace(old_timeout_response, new_timeout_response, 1)
          p.write_text(s, encoding='utf-8')

          rp = Path('tests/run_all_tests.js')
          rs = rp.read_text(encoding='utf-8')
          old_tail = "    { name: '36. Duplicate Request Concurrency Lock Race Guard', file: 'duplicate_request_lock_race.test.js' }\n];"
          new_tail = "    { name: '36. Duplicate Request Concurrency Lock Race Guard', file: 'duplicate_request_lock_race.test.js' },\n    { name: '37. Analyzer Provider Diagnostic Boundary Guard', file: 'analyzer_provider_diagnostics.test.js' }\n];"
          assert old_tail in rs, 'run_all_tests tail not found'
          rp.write_text(rs.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

          cat > tests/analyzer_provider_diagnostics.test.js <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('server.js', 'utf8');

          // Protected Analyzer provider contract must remain exact.
          assert(source.includes("const apiKey = isVisionStage ? process.env.AICREDITS_API_KEY_VISION : process.env.AICREDITS_API_KEY;"));
          assert(source.includes("const model = isVisionStage ? 'qwen/qwen3.5-flash-02-23' : 'qwen/qwen3-235b-a22b-2507';"));
          assert(source.includes("const baseUrl = 'https://api.aicredits.in/v1';"));
          const providerStart = source.indexOf('async function queryAnalyzerProvider');
          const providerEnd = source.indexOf('// Strict Maeve provider path', providerStart);
          assert(providerStart >= 0 && providerEnd > providerStart);
          const providerBlock = source.slice(providerStart, providerEnd);
          assert(!providerBlock.includes('AICREDITS_API_KEY_GENERAL'), 'Analyzer must not fall back to the general key');
          assert(!providerBlock.includes('OPENROUTER_API_KEY'), 'Analyzer must not fall back to OpenRouter');
          assert(!providerBlock.includes('FALLBACK_MODELS'), 'Analyzer must not use model fallback');

          // Executable coarse error classifier.
          const helperStart = source.indexOf('function getAnalyzerProviderFailureCode');
          assert(helperStart >= 0);
          const helperEnd = source.indexOf('// Strict Screenshot Analyzer provider call', helperStart);
          const ctx = {};
          vm.createContext(ctx);
          vm.runInContext(source.slice(helperStart, helperEnd) + '\nthis.classify = getAnalyzerProviderFailureCode;', ctx);
          assert.strictEqual(ctx.classify({ code: 'AI_PROVIDER_CONFIG' }), 'AI_PROVIDER_CONFIG');
          assert.strictEqual(ctx.classify({ statusCode: 401 }), 'AI_PROVIDER_AUTH');
          assert.strictEqual(ctx.classify({ statusCode: 403 }), 'AI_PROVIDER_AUTH');
          assert.strictEqual(ctx.classify({ statusCode: 402 }), 'AI_PROVIDER_BUDGET');
          assert.strictEqual(ctx.classify({ statusCode: 429 }), 'AI_PROVIDER_RATE_LIMIT');
          assert.strictEqual(ctx.classify({ statusCode: 503 }), 'AI_PROVIDER_UPSTREAM');
          assert.strictEqual(ctx.classify({ isTimeout: true }), 'AI_PROVIDER_TIMEOUT');
          assert.strictEqual(ctx.classify({ code: 'AI_PROVIDER_EMPTY_RESPONSE' }), 'AI_PROVIDER_EMPTY_RESPONSE');

          // Missing config and runtime errors must carry stage without exposing raw provider details to clients.
          assert(providerBlock.includes("err.code = 'AI_PROVIDER_CONFIG';"));
          assert(providerBlock.includes('err.analyzerStage = stage;'));
          assert(providerBlock.includes('timeoutErr.analyzerStage = stage;'));
          assert(providerBlock.includes('err.analyzerStage = err.analyzerStage || stage;'));

          const analyzerRouteStart = source.indexOf("app.post(['/api/analyze', '/api/analyze-chat-screenshot']");
          const analyzerRouteEnd = source.indexOf('// 2. ICEBREAKER GENERATOR', analyzerRouteStart);
          const route = source.slice(analyzerRouteStart, analyzerRouteEnd);
          assert(route.includes("const analyzerFailureStage = (error && error.analyzerStage) ? error.analyzerStage : 'pipeline';"));
          assert(route.includes("? 'ANALYZER_PIPELINE_FAILURE'"));
          assert(route.includes('code: analyzerFailureCode'));
          assert(route.includes('stage: analyzerFailureStage'));
          assert(route.includes('reqId: reqId'));
          assert(route.includes('error: "AI analysis failed. Your credits were restored."'));
          assert(route.includes('error: "Analysis timed out. Your credits were restored."'));
          assert(!route.includes('error: error.message'), 'raw provider error must not be returned to Analyzer clients');
          assert(!route.includes('error: errText'), 'raw provider response body must not be returned to Analyzer clients');

          console.log('Analyzer provider diagnostic boundary guard passed.');
          EOF
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Targeted diagnostic boundary guard
        run: node tests/analyzer_provider_diagnostics.test.js
      - name: Complete regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend-only Netlify build safety
        run: npm run build:netlify
      - name: Verify exact scope and commit diagnostic layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf netlify-dist
          echo '=== STATUS ==='
          git status --short
          allowed='^(server\.js|tests/run_all_tests\.js|tests/analyzer_provider_diagnostics\.test\.js)$'
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then echo "Unexpected changed files:"; echo "$unexpected"; exit 2; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js tests/run_all_tests.js tests/analyzer_provider_diagnostics.test.js
          git commit -m 'diag: classify Analyzer provider failures safely'
          git push origin HEAD:fix/analyzer-provider-diagnostics
