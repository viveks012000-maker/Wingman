name: Apply Fail-Closed Auth Fix

on:
  push:
    branches:
      - fix/fail-closed-email-auth

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fail-closed-email-auth
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply deterministic fail-closed authentication patch
        run: python .github/scripts/apply_auth_fix.py
      - name: Verify targeted regression
        run: node tests/auth_fail_closed_signup.test.js
      - name: Install dependencies
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Verify migrations unchanged and replayable
        run: npm run verify:migrations
      - name: Build production artifact
        run: npm run build:production
      - name: Remove temporary patch workflows/scripts
        run: |
          rm -f .github/workflows/auth-fail-closed-red.yml
          rm -f .github/workflows/apply-auth-fix.yml
          rm -f .github/scripts/apply_auth_fix.py
      - name: Commit verified fix back to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): require verified Supabase session before logged-in UI"
          git push origin HEAD:fix/fail-closed-email-auth
