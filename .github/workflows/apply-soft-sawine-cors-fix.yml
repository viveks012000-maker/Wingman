name: Apply soft-sawine CORS fix

on:
  push:
    branches: [fix/soft-sawine-cors]
    paths: ['.github/workflows/apply-soft-sawine-cors-fix.yml']

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded two-file CORS patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          origin = 'https://soft-sawine-30785c.netlify.app'
          server_path = Path('server.js')
          server = server_path.read_text(encoding='utf-8')
          if origin in server:
              raise SystemExit('Guard failed: new origin already exists; refusing duplicate/speculative patch')
          old = "    'https://joyful-conkies-026a81.netlify.app'\n];"
          new = "    'https://joyful-conkies-026a81.netlify.app',\n    'https://soft-sawine-30785c.netlify.app'\n];"
          if old not in server:
              raise SystemExit('Guard failed: expected production CORS allowlist tail not found')
          server = server.replace(old, new, 1)
          server_path.write_text(server, encoding='utf-8')

          test_path = Path('tests/cors_production_policy.test.js')
          test = test_path.read_text(encoding='utf-8')
          marker = "assert.ok(server.includes(\"'https://joyful-conkies-026a81.netlify.app'\"), 'Joyful Netlify audit origin must be explicitly allowed');\n"
          assertion = "assert.ok(server.includes(\"'https://soft-sawine-30785c.netlify.app'\"), 'Current Git-linked Netlify production origin must be explicitly allowed');\n"
          if assertion in test:
              raise SystemExit('Guard failed: regression assertion already exists')
          if marker not in test:
              raise SystemExit('Guard failed: CORS regression insertion marker not found')
          test = test.replace(marker, marker + assertion, 1)
          test_path.write_text(test, encoding='utf-8')

          assert server.count(origin) == 1
          assert test.count(origin) == 1
          print('Guarded current-origin CORS patch applied.')
          PY

          node --check server.js
          node tests/cors_production_policy.test.js
          git diff --check
          changed=$(git diff --name-only | sort)
          printf 'PATCH_CHANGED=%s\n' "$changed"
          test "$changed" = $'server.js\ntests/cors_production_policy.test.js'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression, dependency and frontend build gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build:netlify
          test "$(find netlify-dist -type f | wc -l | tr -d ' ')" = '23'
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -e netlify-dist/database.js

      - name: Commit only verified product/test change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git rm .github/workflows/apply-soft-sawine-cors-fix.yml
          git add server.js tests/cors_production_policy.test.js
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          printf 'COMMIT_CHANGED=%s\n' "$changed"
          test "$changed" = $'.github/workflows/apply-soft-sawine-cors-fix.yml\nserver.js\ntests/cors_production_policy.test.js'
          git commit -m 'fix: allow current Git-linked Netlify origin'
          git push origin HEAD:fix/soft-sawine-cors
