name: Auth Fail-Closed Red Test

on:
  push:
    branches:
      - fix/fail-closed-email-auth

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run fail-closed auth regression test
        run: node tests/auth_fail_closed_signup.test.js
