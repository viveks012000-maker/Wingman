name: Bootstrap optimized logo asset (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'perf/optimize-logo-delivery-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: perf/optimize-logo-delivery-20260818
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Generate exact validated WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          source = Path('logo.png')
          expected_source = 'ea363415d7aaf1f5405ff9782757a567e0d73e630f6e3dd560c3a06de80e45fa'
          actual_source = hashlib.sha256(source.read_bytes()).hexdigest()
          if actual_source != expected_source:
              raise SystemExit(f'unexpected logo.png SHA256: {actual_source}')

          img = Image.open(source).convert('RGBA')
          if img.size != (1024, 1024):
              raise SystemExit(f'unexpected logo.png dimensions: {img.size}')

          out = Path('logo-384.webp')
          img.resize((384, 384), Image.Resampling.LANCZOS).save(out, 'WEBP', quality=90, method=6)
          expected_output = '14316f420346ec38bc2746820200c9ece64cbd7da32f285ce687940c11995e96'
          actual_output = hashlib.sha256(out.read_bytes()).hexdigest()
          if actual_output != expected_output:
              raise SystemExit(f'generated logo-384.webp SHA256 drifted: {actual_output}')
          if out.stat().st_size != 33724:
              raise SystemExit(f'generated logo-384.webp size drifted: {out.stat().st_size}')
          print(f'generated {out} bytes={out.stat().st_size} sha256={actual_output}')
          PY

      - name: Commit generated asset and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-logo-asset.yml
          git add logo-384.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: add validated optimized logo asset'
          git push origin HEAD:perf/optimize-logo-delivery-20260818
