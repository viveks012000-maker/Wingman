name: Bootstrap pinned main font assets (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'perf/self-host-main-fonts-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v7
        with:
          ref: perf/self-host-main-fonts-20260818
          fetch-depth: 0

      - name: Fetch and pin exact production font assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts/licenses
          python - <<'PY'
          import hashlib, pathlib, subprocess

          css_url = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&display=swap'
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          expected_css_bytes = 31343
          expected_css_sha = '7fd02cf9887b06d677580793049303b87bbff319b5ae54be9ebe2bd63361f578'
          expected_local_css_bytes = 27742
          expected_local_css_sha = '57be9a5a28a7824706517e8d6bc2c1015dc10e137020b72b485ae69254984186'

          assets = [
            ('geist-normal-cyrillic-ext.woff2', 7420, '2317fa4bb293c9c0b110e18315d529235c47a0ddd3338cea3d8c7955e927899e', 'https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwRGFWfOw.woff2'),
            ('geist-normal-cyrillic.woff2', 15084, '6894439694946a589d157ece003086960a6a4013d74a813dab7602efdb3d8c09', 'https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwYGFWfOw.woff2'),
            ('geist-normal-vietnamese.woff2', 8004, '8fa40e5d248247735eb97a0bd593b8852440430600d6ba01364c31fe0abc1fe1', 'https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwTGFWfOw.woff2'),
            ('geist-normal-latin-ext.woff2', 16512, '824f485b5d26e2f2da3c2b236132ece1bc8e4e43373452950bb0e40548b4313f', 'https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwSGFWfOw.woff2'),
            ('geist-normal-latin.woff2', 29400, '19f9c92546aa300c312235e3125af1b81394d8db9a4bc4a425cd5b641d2d54e1', 'https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFU.woff2'),
            ('inter-normal-cyrillic-ext.woff2', 25960, 'ca157063339ac4ad418f214f3abfed119b0798ab4d377386ce5c9e5a7a435ebd', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7SUc.woff2'),
            ('inter-normal-cyrillic.woff2', 18748, '71d5ee93cc1e9f1d520a3a8b66456de18c7879d8df09d57fcd2eaff75fef0075', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa0ZL7SUc.woff2'),
            ('inter-normal-greek-ext.woff2', 11232, '6e9e020a25f9b56d418f2c085b1d3c09725a4da23fe693a5b463064606732190', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2ZL7SUc.woff2'),
            ('inter-normal-greek.woff2', 18996, '1be3448e292fbf05ffe176fe1e43f135013d50b1e7d324ad1a558f623d3bb6f6', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1pL7SUc.woff2'),
            ('inter-normal-vietnamese.woff2', 10252, '5c66f9e07e90c6d4ac4922cc68d60de26c17b1858e677fb5e603fce3952b3ff2', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2pL7SUc.woff2'),
            ('inter-normal-latin-ext.woff2', 85068, '34b9c504cab7a73e37b746343a449132e56cf7b5481af2cb81dc74dcff25c956', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa25L7SUc.woff2'),
            ('inter-normal-latin.woff2', 48256, '3100e775e8616cd2611beecfa23a4263d7037586789b43f035236a2e6fbd4c62', 'https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2'),
            ('plus-jakarta-sans-italic-cyrillic-ext.woff2', 1112, '88fd102a6d6c21e3467a155dc9ea39012faee16a5f53630a2c1575e6737fd15f', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIZaomQNQcsA88c7O9yZ4KMCoOg4KozySKCdSNG9OcqYQ2lDi_aOKyYRw.woff2'),
            ('plus-jakarta-sans-italic-vietnamese.woff2', 4352, 'c8ac130106e4c6e8d0de35b5bc341b14a6c7649a371aa84aff49a74b562158fc', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIZaomQNQcsA88c7O9yZ4KMCoOg4KozySKCdSNG9OcqYQ2lDi_YOKyYRw.woff2'),
            ('plus-jakarta-sans-italic-latin-ext.woff2', 11376, '4660dc4b0f05c7d7ce655815e33a1b05d28b0b9843cc4e9c857b1ac578106696', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIZaomQNQcsA88c7O9yZ4KMCoOg4KozySKCdSNG9OcqYQ2lDi_ZOKyYRw.woff2'),
            ('plus-jakarta-sans-italic-latin.woff2', 12596, '714d8ba058e160238e7ebb5c9b446e3814f859c1473497757cdc75473bc0d88e', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIZaomQNQcsA88c7O9yZ4KMCoOg4KozySKCdSNG9OcqYQ2lDi_XOKw.woff2'),
            ('plus-jakarta-sans-normal-cyrillic-ext.woff2', 1716, 'c46a510ab43925a55ecfe6c2d5fad0ce1902cd48ab276621d41f7afa42e4daee', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko70yyygA.woff2'),
            ('plus-jakarta-sans-normal-vietnamese.woff2', 8352, 'b275d1258601dda240fc6a1d4a6cad56e691d898f5cdf1b0e4fd6ca0022d8e40', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko50yyygA.woff2'),
            ('plus-jakarta-sans-normal-latin-ext.woff2', 21728, '38e3b8fd8045048eb311d90170a4429ed2c8f405852dc3d91b5af8452758703f', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko40yyygA.woff2'),
            ('plus-jakarta-sans-normal-latin.woff2', 27348, '153fc85b70298beeb1d61a5f723331649e7f23bb77302a66e61cb3e2fbdb5e79', 'https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yw.woff2'),
          ]

          pathlib.Path('fonts').mkdir(exist_ok=True)
          raw_css = pathlib.Path('/tmp/google-main-fonts.css')
          subprocess.run(['curl','--retry','4','--retry-all-errors','-fsS','-A',ua,css_url,'-o',str(raw_css)], check=True)
          css_bytes = raw_css.read_bytes()
          css_sha = hashlib.sha256(css_bytes).hexdigest()
          if len(css_bytes) != expected_css_bytes or css_sha != expected_css_sha:
              raise SystemExit(f'Google CSS drift: bytes={len(css_bytes)} sha256={css_sha}')
          css = css_bytes.decode('utf-8')
          if css.count('@font-face') != 83:
              raise SystemExit(f'Expected 83 @font-face blocks, got {css.count("@font-face")}')

          for filename, expected_size, expected_sha, url in assets:
              path = pathlib.Path('fonts') / filename
              subprocess.run(['curl','--retry','4','--retry-all-errors','-fsS',url,'-o',str(path)], check=True)
              data = path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size or actual_sha != expected_sha:
                  raise SystemExit(f'{filename} drift: bytes={len(data)} sha256={actual_sha}')
              if url not in css:
                  raise SystemExit(f'{filename} source URL missing from pinned Google CSS')
              css = css.replace(url, f'/fonts/{filename}')
              print(f'PINNED {filename} bytes={len(data)} sha256={actual_sha}')

          if 'fonts.gstatic.com' in css or 'fonts.googleapis.com' in css:
              raise SystemExit('Transformed font CSS still contains external Google font hosts')
          if css.count('@font-face') != 83:
              raise SystemExit('Transformed CSS changed @font-face block count')
          local_css = css.encode('utf-8')
          local_sha = hashlib.sha256(local_css).hexdigest()
          if len(local_css) != expected_local_css_bytes or local_sha != expected_local_css_sha:
              raise SystemExit(f'Local CSS drift: bytes={len(local_css)} sha256={local_sha}')
          pathlib.Path('fonts/main-fonts.css').write_bytes(local_css)
          print(f'PINNED fonts/main-fonts.css bytes={len(local_css)} sha256={local_sha}')
          print(f'PINNED_FONT_TOTAL_BYTES={sum(size for _,size,_,_ in assets)}')
          PY

          GOOGLE_FONTS_COMMIT='e1118da94a8cb00cf6d06cdac9ef13eb1e5c6ab7'
          curl --retry 4 --retry-all-errors -fsS "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/geist/OFL.txt" -o fonts/licenses/geist-OFL.txt
          curl --retry 4 --retry-all-errors -fsS "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/inter/OFL.txt" -o fonts/licenses/inter-OFL.txt
          curl --retry 4 --retry-all-errors -fsS "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/plusjakartasans/OFL.txt" -o fonts/licenses/plus-jakarta-sans-OFL.txt
          grep -Fqx 'Copyright 2024 The Geist Project Authors (https://github.com/vercel/geist-font.git)' <(head -n 1 fonts/licenses/geist-OFL.txt)
          grep -Fqx 'Copyright 2020 The Inter Project Authors (https://github.com/rsms/inter)' <(head -n 1 fonts/licenses/inter-OFL.txt)
          grep -Fqx 'Copyright 2020 The Plus Jakarta Sans Project Authors (https://github.com/tokotype/PlusJakartaSans)' <(head -n 1 fonts/licenses/plus-jakarta-sans-OFL.txt)
          for license in fonts/licenses/*-OFL.txt; do
            grep -Fq 'SIL OPEN FONT LICENSE Version 1.1' "$license"
            echo "PINNED_LICENSE $license bytes=$(wc -c < "$license" | tr -d ' ') sha256=$(sha256sum "$license" | awk '{print $1}')"
          done

      - name: Commit pinned assets and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-main-font-assets.yml
          git add fonts/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: pin exact self-hosted main font assets'
          git push origin HEAD:perf/self-host-main-fonts-20260818
