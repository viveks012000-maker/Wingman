name: Bootstrap Material Symbols Assets - SELF DELETE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-material-symbols-assets.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FONT_URL: https://fonts.gstatic.com/l/font?kit=kJEPBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oDMzBwG-RpA6RzaxHMPdY40KH8nGzv3fzfVJO1Vy6oTrdw0HasFiArONPu98w6-d_2EURKL7MBvuzs9uzqpeZ_Cq-riDIemB7ExH6FLS5kHC5gE6T7HlaZMlKPXEOdKu-4JzmVTSFwsR2v4EVdn5-jd-uUHo89ZR1&skey=b8dc2088854b122f&v=v367
      FONT_SHA256: 56f6255b1341a07abae9b27ad468ecbf7de7141c6522a078060fb4c5173def70
      FONT_BYTES: '16580'
      LICENSE_URL: https://raw.githubusercontent.com/google/material-design-icons/e083cc60a0828fdd3b404cea0cb8a5b900e9c23e/LICENSE
      LICENSE_SHA256: 58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd
      LICENSE_BYTES: '11357'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download and pin exact assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts/licenses/material-symbols
          curl --fail --silent --show-error --location "$FONT_URL" -o fonts/material-symbols-outlined-subset.woff2
          curl --fail --silent --show-error --location "$LICENSE_URL" -o fonts/licenses/material-symbols/LICENSE.txt
          test "$(wc -c < fonts/material-symbols-outlined-subset.woff2 | tr -d ' ')" = "$FONT_BYTES"
          test "$(sha256sum fonts/material-symbols-outlined-subset.woff2 | awk '{print $1}')" = "$FONT_SHA256"
          test "$(wc -c < fonts/licenses/material-symbols/LICENSE.txt | tr -d ' ')" = "$LICENSE_BYTES"
          test "$(sha256sum fonts/licenses/material-symbols/LICENSE.txt | awk '{print $1}')" = "$LICENSE_SHA256"
          grep -q 'Apache License' fonts/licenses/material-symbols/LICENSE.txt
      - name: Commit assets and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-material-symbols-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/material-symbols-outlined-subset.woff2 fonts/licenses/material-symbols/LICENSE.txt .github/workflows/bootstrap-material-symbols-assets.yml
          git commit -m 'Pin exact Material Symbols subset assets'
          git push origin HEAD:"${{ github.head_ref }}"
