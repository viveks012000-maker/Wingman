name: MyWingman Production Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-weak-password-login-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/login-weak-password-warning-20260818' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply byte-exact login warning patch and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/apply-weak-login-warning.py
          python3 .github/apply-weak-login-warning.py
          node -c supabaseClient.js
          node -c tests/password_recovery_compat.test.js
          node tests/password_recovery_compat.test.js

      - name: Restore production gate, remove patcher and commit only real changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/build-netlify-production-artifact.yml
          rm -f .github/apply-weak-login-warning.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabaseClient.js tests/password_recovery_compat.test.js .github/workflows/build-netlify-production-artifact.yml .github/apply-weak-login-warning.py
          git diff --cached --check
          git commit -m 'Surface Supabase weak-password login warnings'
          final_changed=$(git diff --name-only origin/main HEAD | sort | tr '\n' ' ')
          echo "FINAL_PR_FILES=$final_changed"
          test "$final_changed" = 'supabaseClient.js tests/password_recovery_compat.test.js '
          git push origin HEAD:fix/login-weak-password-warning-20260818

  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Require production manual builds to target main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Verify checkout matches triggering SHA
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "checkout=$actual event_sha=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Full regression and production dependency gate
        run: |
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build strict public artifact
        run: npm run build:netlify

      - name: Verify release truth, API path and public allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f netlify-dist/index.html
          test -f netlify-dist/app.html
          test -f netlify-dist/app.js
          test -f netlify-dist/config.js
          test -f netlify-dist/supabaseClient.js
          test -f netlify-dist/style.css
          test -f netlify-dist/_headers
          test -f netlify-dist/_redirects
          test -f netlify-dist/release.json
          test "$(jq -r .sourceCommit netlify-dist/release.json)" = "$GITHUB_SHA"
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/app.html
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/_headers
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/config.js
          grep -q '<script defer src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any.min.js"></script>' netlify-dist/app.html
          test -f netlify-dist/vendor/heic2any-loader.js
          test -f netlify-dist/vendor/heic2any.min.js
          for page in index.html app.html 404.html; do
            test "$(grep -Fo 'data-inline-source="style.css"' "netlify-dist/$page" | wc -l | tr -d ' ')" = 1
            ! grep -Eq 'href="/?style\.css"' "netlify-dist/$page"
          done
          for forbidden in server.js database.js package.json package-lock.json PROMPT_SYSTEM_MEMORY.json PROJECT_MASTER_SPECIFICATION.md API_DOCUMENTATION.md; do
            if [ -e "netlify-dist/$forbidden" ]; then echo "FORBIDDEN $forbidden" >&2; exit 1; fi
          done
          for forbidden_dir in middleware migrations tests config utilities scripts .github; do
            if [ -e "netlify-dist/$forbidden_dir" ]; then echo "FORBIDDEN $forbidden_dir" >&2; exit 1; fi
          done
          ! find netlify-dist -type f | grep -E '\.(sql|sqlite|db|md|ps1|bat|vbs)$'
          echo "PUBLIC_FILE_COUNT=$(find netlify-dist -type f | wc -l)"

      - name: Create exact public deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f wingman-production.zip
          (cd netlify-dist && zip -qr ../wingman-production.zip .)
          unzip -l wingman-production.zip
          sha256sum wingman-production.zip

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: wingman-production-${{ github.sha }}
          path: wingman-production.zip
          if-no-files-found: error
          retention-days: 7
