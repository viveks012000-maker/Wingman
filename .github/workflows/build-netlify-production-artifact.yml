name: MyWingman Production Verification Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-cors-revocation-do-not-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact deployed release and Railway CORS policy
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='a15dd415973ef96c3bb6101250ebc095f472992d'
          FRONTEND='https://mywingman.pages.dev'
          BACKEND='https://wingman-production-c6ce.up.railway.app'
          OLD_NETLIFY='https://soft-sawine-30785c.netlify.app'

          deployed=''
          for attempt in $(seq 1 80); do
            deployed=$(curl --fail --silent --show-error --retry 2 --retry-all-errors "$FRONTEND/release.json" | jq -r '.sourceCommit // empty' || true)
            [ "$deployed" = "$TARGET_SHA" ] && break
            echo "waiting_for_cloudflare attempt=$attempt observed=$deployed"
            sleep 3
          done
          echo "live_release=$deployed expected=$TARGET_SHA"
          test "$deployed" = "$TARGET_SHA"

          curl --fail --silent --show-error "$BACKEND/" | jq -e '.status == "ok" and .service == "mywingman-api"' >/dev/null

          probe_cors() {
            local origin="$1"
            local file="$2"
            curl --silent --show-error -D "$file" -o /dev/null -X OPTIONS \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              "$BACKEND/api/credits"
            grep -i '^access-control-allow-origin:' "$file" | tr -d '\r' || true
          }

          echo '--- Pages CORS ---'
          probe_cors 'https://mywingman.pages.dev' /tmp/pages.headers
          grep -iq '^access-control-allow-origin: https://mywingman.pages.dev' /tmp/pages.headers

          echo '--- Misdirected custom domain CORS ---'
          probe_cors 'https://mywingman.com' /tmp/stale.headers
          ! grep -iq '^access-control-allow-origin: https://mywingman.com' /tmp/stale.headers

          echo '--- Retired Netlify CORS ---'
          probe_cors 'https://soft-sawine-30785c.netlify.app' /tmp/netlify.headers
          ! grep -iq '^access-control-allow-origin: https://soft-sawine-30785c.netlify.app' /tmp/netlify.headers

          echo '--- Null/wildcard sanity ---'
          probe_cors 'null' /tmp/null.headers
          ! grep -iq '^access-control-allow-origin:' /tmp/null.headers

          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")" = '404'
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/")" = '200'
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = '200'

          echo 'LIVE_CORS_REVOCATION_VERIFICATION=PASS'
