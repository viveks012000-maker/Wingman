name: MyWingman Production Verification Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-css-lock-do-not-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact production CSS and deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='1114611f5c8298670c6c78e151856439ba6429db'
          EXPECTED_CSS_SHA='f513634da85c3b6248efedb2a70605d10552cb251e73bfccd0b3b5dc6af87f56'
          EXPECTED_CSS_BYTES='113877'
          FRONTEND='https://mywingman.pages.dev'
          BACKEND='https://wingman-production-c6ce.up.railway.app'
          OLD_NETLIFY='https://soft-sawine-30785c.netlify.app'

          deployed=''
          for attempt in $(seq 1 80); do
            deployed=$(curl --fail --silent --show-error --retry 2 --retry-all-errors "$FRONTEND/release.json" | jq -r '.sourceCommit // empty' || true)
            [ "$deployed" = "$TARGET_SHA" ] && break
            echo "waiting_for_cloudflare attempt=$attempt observed=$deployed"
            sleep 3
          done
          echo "live_release=$deployed expected=$TARGET_SHA"
          test "$deployed" = "$TARGET_SHA"

          curl --fail --silent --show-error --compressed "$FRONTEND/output.css" -o /tmp/live-output.css
          live_bytes=$(wc -c < /tmp/live-output.css | tr -d ' ')
          live_sha=$(sha256sum /tmp/live-output.css | awk '{print $1}')
          echo "live_output_css_bytes=$live_bytes"
          echo "live_output_css_sha256=$live_sha"
          test "$live_bytes" = "$EXPECTED_CSS_BYTES"
          test "$live_sha" = "$EXPECTED_CSS_SHA"

          manifest_sha=$(curl --fail --silent --show-error "$FRONTEND/release.json" | jq -r '.files["output.css"] // empty')
          echo "manifest_output_css_sha256=$manifest_sha"
          test "$manifest_sha" = "$EXPECTED_CSS_SHA"

          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/")" = '200'
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = '200'
          random_path="audit-not-found-${RANDOM}-${RANDOM}"
          test "$(curl --silent --show-error -o /tmp/missing.html -w '%{http_code}' "$FRONTEND/$random_path")" = '404'
          grep -Fq 'Page Not Found | MyWingman' /tmp/missing.html

          curl --fail --silent --show-error "$BACKEND/" | jq -e '.status == "ok" and .service == "mywingman-api"' >/dev/null
          for origin in 'https://mywingman.com' 'https://soft-sawine-30785c.netlify.app'; do
            curl --silent --show-error -D /tmp/denied.headers -o /dev/null -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
            ! grep -iq "^access-control-allow-origin: $origin" /tmp/denied.headers
          done
          curl --silent --show-error -D /tmp/pages.headers -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
          grep -iq '^access-control-allow-origin: https://mywingman.pages.dev' /tmp/pages.headers
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")" = '404'

          echo 'LIVE_CSS_LOCK_VERIFICATION=PASS'
