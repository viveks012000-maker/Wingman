name: MyWingman Production Verification Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  heic-to-csp-diagnostic-do-not-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect and browser-test heic-to 1.5.2 CSP build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts heic-to@1.5.2
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('node_modules/heic-to/package.json', 'utf8'));
          console.log('HEIC_TO_VERSION=' + pkg.version);
          console.log('HEIC_TO_LICENSE=' + pkg.license);
          console.log('HEIC_TO_EXPORTS=' + JSON.stringify(pkg.exports));
          NODE
          echo '--- heic-to dist files ---'
          find node_modules/heic-to -maxdepth 4 -type f | sort
          echo '--- unsafe code generation markers ---'
          grep -RInE '(^|[^[:alnum:]_])(eval\s*\(|new[[:space:]]+Function\s*\()' node_modules/heic-to/dist || true

          mkdir -p tmp/heic-diagnostic
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tigranbs/test-heic-images/master/image1.heic \
            -o tmp/heic-diagnostic/sample.heic
          test "$(wc -c < tmp/heic-diagnostic/sample.heic)" -gt 1000

          CSP_ENTRY=$(node - <<'NODE'
          const pkg = require('./node_modules/heic-to/package.json');
          const entry = pkg.exports && pkg.exports['./csp'];
          let value = entry;
          if (entry && typeof entry === 'object') value = entry.browser || entry.import || entry.default || entry.require;
          if (!value || typeof value !== 'string') process.exit(2);
          process.stdout.write(value.replace(/^\.\//, ''));
          NODE
          )
          echo "HEIC_TO_CSP_ENTRY=$CSP_ENTRY"
          test -f "node_modules/heic-to/$CSP_ENTRY"

          cat > tmp/heic-diagnostic/index.html <<EOF
          <!doctype html><html><head>
          <meta charset="utf-8">
          <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
          </head><body><div id="status">starting</div><script type="module" src="/tmp/heic-diagnostic/test.mjs"></script></body></html>
          EOF
          cat > tmp/heic-diagnostic/test.mjs <<EOF
          import { heicTo } from '/node_modules/heic-to/$CSP_ENTRY';
          window.__heicDiagnostic = { done: false, ok: false, error: null };
          try {
            const response = await fetch('/tmp/heic-diagnostic/sample.heic');
            if (!response.ok) throw new Error('fixture fetch failed ' + response.status);
            const input = await response.blob();
            const converted = await heicTo({ blob: input, type: 'image/jpeg', quality: 0.82 });
            if (!(converted instanceof Blob)) throw new Error('conversion did not return Blob');
            if (converted.type !== 'image/jpeg') throw new Error('unexpected output MIME ' + converted.type);
            if (converted.size < 1000) throw new Error('converted JPEG unexpectedly small: ' + converted.size);
            const url = URL.createObjectURL(converted);
            const img = new Image();
            img.src = url;
            await img.decode();
            if (!(img.naturalWidth > 0 && img.naturalHeight > 0)) throw new Error('decoded JPEG has invalid dimensions');
            URL.revokeObjectURL(url);
            window.__heicDiagnostic = { done: true, ok: true, bytes: converted.size, width: img.naturalWidth, height: img.naturalHeight };
            document.getElementById('status').textContent = 'PASS';
          } catch (error) {
            window.__heicDiagnostic = { done: true, ok: false, error: String(error && error.stack || error) };
            document.getElementById('status').textContent = 'FAIL';
          }
          EOF

          python3 -m http.server 4173 >/tmp/heic-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror:' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console:' + m.text()); });
            const resp = await page.goto('http://127.0.0.1:4173/tmp/heic-diagnostic/index.html', { waitUntil: 'load' });
            if (!resp || resp.status() !== 200) throw new Error('diagnostic page failed to load');
            await page.waitForFunction(() => window.__heicDiagnostic && window.__heicDiagnostic.done, null, { timeout: 60000 });
            const result = await page.evaluate(() => window.__heicDiagnostic);
            console.log('HEIC_TO_BROWSER_RESULT=' + JSON.stringify(result));
            console.log('HEIC_TO_BROWSER_ERRORS=' + JSON.stringify(errors));
            if (!result.ok) throw new Error('HEIC conversion failed: ' + result.error);
            if (errors.length) throw new Error('browser errors under strict CSP: ' + errors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          echo 'HEIC_TO_CSP_DIAGNOSTIC=PASS'
