name: MyWingman Production Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-password-recovery-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/password-recovery-compat-20260818' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic repair payload from temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/bootstrap-password-recovery-fix.yml').read_text()
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1:
              raise SystemExit('Unexpected bootstrap Python start marker')
          payload = source.split(start, 1)[1]
          if end not in payload:
              raise SystemExit('Bootstrap Python end marker missing')
          payload = payload.split(end, 1)[0]
          lines = payload.splitlines()
          normalized = []
          for line in lines:
              if line.startswith('          '):
                  normalized.append(line[10:])
              else:
                  normalized.append(line)
          Path('/tmp/apply-password-recovery-fix.py').write_text('\n'.join(normalized) + '\n')
          PY
          python3 /tmp/apply-password-recovery-fix.py
          node tests/password_recovery_compat.test.js
          node -c supabaseClient.js
          node -c tests/password_recovery_compat.test.js

      - name: Restore gate, remove all bootstrap material and commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/build-netlify-production-artifact.yml
          rm -f .github/workflows/bootstrap-password-recovery-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabaseClient.js tests/password_recovery_compat.test.js tests/run_all_tests.js .github/workflows/build-netlify-production-artifact.yml .github/workflows/bootstrap-password-recovery-fix.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'supabaseClient.js tests/password_recovery_compat.test.js tests/run_all_tests.js '
          git commit -m 'Complete Supabase password recovery flow'
          git push origin HEAD:fix/password-recovery-compat-20260818

  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Require production manual builds to target main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Verify checkout matches triggering SHA
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "checkout=$actual event_sha=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Full regression and production dependency gate
        run: |
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build strict public artifact
        run: npm run build:netlify

      - name: Verify release truth, API path and public allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f netlify-dist/index.html
          test -f netlify-dist/app.html
          test -f netlify-dist/app.js
          test -f netlify-dist/config.js
          test -f netlify-dist/supabaseClient.js
          test -f netlify-dist/style.css
          test -f netlify-dist/_headers
          test -f netlify-dist/_redirects
          test -f netlify-dist/release.json
          test "$(jq -r .sourceCommit netlify-dist/release.json)" = "$GITHUB_SHA"
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/app.html
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/_headers
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/config.js
          grep -q '<script defer src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any.min.js"></script>' netlify-dist/app.html
          test -f netlify-dist/vendor/heic2any-loader.js
          test -f netlify-dist/vendor/heic2any.min.js
          for page in index.html app.html 404.html; do
            test "$(grep -Fo 'data-inline-source="style.css"' "netlify-dist/$page" | wc -l | tr -d ' ')" = 1
            ! grep -Eq 'href="/?style\.css"' "netlify-dist/$page"
          done
          for forbidden in server.js database.js package.json package-lock.json PROMPT_SYSTEM_MEMORY.json PROJECT_MASTER_SPECIFICATION.md API_DOCUMENTATION.md; do
            if [ -e "netlify-dist/$forbidden" ]; then echo "FORBIDDEN $forbidden" >&2; exit 1; fi
          done
          for forbidden_dir in middleware migrations tests config utilities scripts .github; do
            if [ -e "netlify-dist/$forbidden_dir" ]; then echo "FORBIDDEN $forbidden_dir" >&2; exit 1; fi
          done
          ! find netlify-dist -type f | grep -E '\.(sql|sqlite|db|md|ps1|bat|vbs)$'
          echo "PUBLIC_FILE_COUNT=$(find netlify-dist -type f | wc -l)"

      - name: Create exact public deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f wingman-production.zip
          (cd netlify-dist && zip -qr ../wingman-production.zip .)
          unzip -l wingman-production.zip
          sha256sum wingman-production.zip

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: wingman-production-${{ github.sha }}
          path: wingman-production.zip
          if-no-files-found: error
          retention-days: 7
