name: MyWingman Production Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Require production manual builds to target main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Verify checkout matches triggering SHA
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "checkout=$actual event_sha=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Full regression and production dependency gate
        run: |
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build strict public artifact
        run: npm run build:netlify

      - name: Verify release truth, API path and public allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f netlify-dist/index.html
          test -f netlify-dist/app.html
          test -f netlify-dist/app.js
          test -f netlify-dist/config.js
          test -f netlify-dist/supabaseClient.js
          test -f netlify-dist/style.css
          test -f netlify-dist/_headers
          test -f netlify-dist/_redirects
          test -f netlify-dist/release.json
          test "$(jq -r .sourceCommit netlify-dist/release.json)" = "$GITHUB_SHA"
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/app.html
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/_headers
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/config.js
          grep -q '<script defer src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any-loader.js"></script>' netlify-dist/app.html
          ! grep -q '<script src="./vendor/heic2any.min.js"></script>' netlify-dist/app.html
          test -f netlify-dist/vendor/heic2any-loader.js
          test -f netlify-dist/vendor/heic2any.min.js
          for page in index.html app.html 404.html; do
            test "$(grep -Fo 'data-inline-source="style.css"' "netlify-dist/$page" | wc -l | tr -d ' ')" = 1
            ! grep -Eq 'href="/?style\.css"' "netlify-dist/$page"
          done
          for forbidden in server.js database.js package.json package-lock.json PROMPT_SYSTEM_MEMORY.json PROJECT_MASTER_SPECIFICATION.md API_DOCUMENTATION.md; do
            if [ -e "netlify-dist/$forbidden" ]; then echo "FORBIDDEN $forbidden" >&2; exit 1; fi
          done
          for forbidden_dir in middleware migrations tests config utilities scripts .github; do
            if [ -e "netlify-dist/$forbidden_dir" ]; then echo "FORBIDDEN $forbidden_dir" >&2; exit 1; fi
          done
          ! find netlify-dist -type f | grep -E '\.(sql|sqlite|db|md|ps1|bat|vbs)$'
          echo "PUBLIC_FILE_COUNT=$(find netlify-dist -type f | wc -l)"

      - name: Create exact public deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f wingman-production.zip
          (cd netlify-dist && zip -qr ../wingman-production.zip .)
          unzip -l wingman-production.zip
          sha256sum wingman-production.zip

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: wingman-production-${{ github.sha }}
          path: wingman-production.zip
          if-no-files-found: error
          retention-days: 7

      - name: TEMPORARY live paid-plan and custom-domain verification - DO NOT MERGE
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='0876976a5cbb470da817d3196ba879576d8b3229'
          FRONTEND='https://mywingman.pages.dev'
          BACKEND='https://wingman-production-c6ce.up.railway.app'
          OLD_NETLIFY='https://soft-sawine-30785c.netlify.app'

          deployed=''
          for attempt in $(seq 1 60); do
            deployed=$(curl --fail --silent --show-error --retry 2 --retry-all-errors "$FRONTEND/release.json" | jq -r '.sourceCommit // empty' || true)
            [ "$deployed" = "$TARGET_SHA" ] && break
            echo "waiting_for_release attempt=$attempt observed=$deployed"
            sleep 3
          done
          echo "live_release=$deployed expected=$TARGET_SHA"
          test "$deployed" = "$TARGET_SHA"

          curl --fail --silent --show-error "$FRONTEND/config.js" -o /tmp/live-config.js
          git show "$TARGET_SHA:config.js" > /tmp/git-config.js
          live_hash=$(sha256sum /tmp/live-config.js | awk '{print $1}')
          git_hash=$(sha256sum /tmp/git-config.js | awk '{print $1}')
          echo "live_config_hash=$live_hash git_config_hash=$git_hash"
          test "$live_hash" = "$git_hash"
          grep -q "select('has_paid_credits')" /tmp/live-config.js
          ! grep -q "from('credit_transactions')" /tmp/live-config.js

          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/")" = '200'
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = '200'
          random_path="audit-not-found-${RANDOM}-${RANDOM}"
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/$random_path")" = '404'

          curl --fail --silent --show-error "$BACKEND/" | jq -e '.status == "ok" and .service == "mywingman-api"' >/dev/null
          curl --silent --show-error -D /tmp/cf-cors.txt -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
          grep -iq '^access-control-allow-origin: https://mywingman.pages.dev' /tmp/cf-cors.txt
          curl --silent --show-error -D /tmp/old-cors.txt -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
          ! grep -iq '^access-control-allow-origin: https://soft-sawine-30785c.netlify.app' /tmp/old-cors.txt
          old_status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          echo "retired_netlify_status=$old_status"
          test "$old_status" = '404'

          echo '--- CUSTOM DOMAIN DIAGNOSTIC ---'
          getent ahosts mywingman.com || true
          custom_status=$(curl --silent --show-error --location --max-time 20 -o /tmp/custom-body -w '%{http_code}' https://mywingman.com/ || true)
          custom_final=$(curl --silent --show-error --location --max-time 20 -o /dev/null -w '%{url_effective}' https://mywingman.com/ || true)
          echo "custom_domain_status=$custom_status"
          echo "custom_domain_final_url=$custom_final"
          if [ "$custom_status" = '200' ]; then
            custom_hash=$(sha256sum /tmp/custom-body | awk '{print $1}')
            pages_hash=$(curl --fail --silent --show-error "$FRONTEND/" | sha256sum | awk '{print $1}')
            echo "custom_landing_hash=$custom_hash pages_landing_hash=$pages_hash"
          fi
          echo 'LIVE_PAID_PLAN_VERIFICATION=PASS'
