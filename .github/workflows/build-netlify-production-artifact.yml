name: MyWingman Production Verification Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-vendor-provenance-do-not-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact deployment, vendor hashes, routing and CORS
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='907689c295fabd86f798021c8387848441a60cb0'
          FRONTEND='https://mywingman.pages.dev'
          BACKEND='https://wingman-production-c6ce.up.railway.app'
          OLD_NETLIFY='https://soft-sawine-30785c.netlify.app'

          deployed=''
          for attempt in $(seq 1 80); do
            deployed=$(curl --fail --silent --show-error --retry 2 --retry-all-errors "$FRONTEND/release.json" | jq -r '.sourceCommit // empty' || true)
            [ "$deployed" = "$TARGET_SHA" ] && break
            echo "waiting_for_cloudflare attempt=$attempt observed=$deployed"
            sleep 3
          done
          echo "live_release=$deployed expected=$TARGET_SHA"
          test "$deployed" = "$TARGET_SHA"

          verify_vendor() {
            local path="$1" expected_bytes="$2" expected_sha="$3"
            local tmp="/tmp/$(basename "$path")"
            curl --fail --silent --show-error --compressed "$FRONTEND/$path" -o "$tmp"
            local bytes sha
            bytes=$(wc -c < "$tmp" | tr -d ' ')
            sha=$(sha256sum "$tmp" | awk '{print $1}')
            echo "$path bytes=$bytes sha256=$sha"
            test "$bytes" = "$expected_bytes"
            test "$sha" = "$expected_sha"
            local manifest_sha
            manifest_sha=$(curl --fail --silent --show-error "$FRONTEND/release.json" | jq -r --arg p "$path" '.files[$p] // empty')
            test "$manifest_sha" = "$expected_sha"
          }

          verify_vendor 'vendor/supabase.min.js' '212199' 'cf529fe8980cbe6f2dd3e3930ecf96352ed3d3d71233b6760e4f927f89b94b9f'
          verify_vendor 'vendor/cropperjs/cropper.min.js' '37035' '615835110d07d9842d1c0a995e9fc79fb4dfa8d2c1b879ff0d648570714ee1c7'
          verify_vendor 'vendor/cropperjs/cropper.min.css' '3804' '055b9c1ce54007be24408e3d02e584e82c60a9a52cd1c780e5ff08318a1d787f'
          verify_vendor 'vendor/heic2any.min.js' '1351840' '0963cfa50e9e1e7e6af929a40a81e3e898a673f1270eafa6917dd137e4968164'

          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/")" = '200'
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = '200'
          random_path="vendor-audit-not-found-${RANDOM}-${RANDOM}"
          test "$(curl --silent --show-error -o /tmp/missing.html -w '%{http_code}' "$FRONTEND/$random_path")" = '404'
          grep -Fq 'Page Not Found | MyWingman' /tmp/missing.html

          curl --fail --silent --show-error "$BACKEND/" | jq -e '.status == "ok" and .service == "mywingman-api"' >/dev/null
          curl --silent --show-error -D /tmp/pages.headers -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
          grep -iq '^access-control-allow-origin: https://mywingman.pages.dev' /tmp/pages.headers
          for origin in 'https://mywingman.com' 'https://soft-sawine-30785c.netlify.app' 'null'; do
            curl --silent --show-error -D /tmp/denied.headers -o /dev/null -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' "$BACKEND/api/credits"
            ! grep -iq '^access-control-allow-origin:' /tmp/denied.headers
          done
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")" = '404'
          echo 'LIVE_VENDOR_PROVENANCE_VERIFICATION=PASS'
