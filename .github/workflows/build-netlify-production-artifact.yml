name: MyWingman Production Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-vendor-provenance:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/vendor-provenance-monitoring-20260818'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply provenance patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python .github/apply-vendor-provenance.py
          npm ci
          node tests/browser_vendor_provenance.test.js
          npm audit --omit=dev --audit-level=high
          rm .github/apply-vendor-provenance.py
          git checkout origin/main -- .github/workflows/build-netlify-production-artifact.yml
          test ! -e .github/apply-vendor-provenance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          echo 'Final branch changes relative to main:'
          git diff --cached --name-only
          git commit -m 'Track browser vendor provenance and dependency updates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify checkout matches triggering SHA
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "checkout=$actual event_sha=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression and production dependency gate
        run: |
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build strict public artifact
        run: npm run build:netlify
      - name: Verify release truth, API path and public allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f netlify-dist/index.html
          test -f netlify-dist/app.html
          test -f netlify-dist/release.json
          test "$(jq -r .sourceCommit netlify-dist/release.json)" = "$GITHUB_SHA"
          test ! -e netlify-dist/config/browser-vendor-provenance.json
          for forbidden_dir in middleware migrations tests config utilities scripts .github; do
            if [ -e "netlify-dist/$forbidden_dir" ]; then echo "FORBIDDEN $forbidden_dir" >&2; exit 1; fi
          done
          ! find netlify-dist -type f | grep -E '\.(sql|sqlite|db|md|ps1|bat|vbs)$'
      - name: Create exact public deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f wingman-production.zip
          (cd netlify-dist && zip -qr ../wingman-production.zip .)
          sha256sum wingman-production.zip
