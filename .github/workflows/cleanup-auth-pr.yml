name: Clean Auth Repair PR

on:
  push:
    branches:
      - fix/fail-closed-email-auth

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fail-closed-email-auth
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore main artifacts and apply narrow index auth patch
        run: python .github/scripts/clean_auth_pr.py prepare
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run targeted auth regression
        run: node tests/auth_fail_closed_signup.test.js
      - name: Run full regression suite
        run: npm test
      - name: Verify migrations
        run: npm run verify:migrations
      - name: Build production artifact
        run: npm run build:production
      - name: Remove generated drift and assert exact final diff
        run: python .github/scripts/clean_auth_pr.py finalize
      - name: Commit clean verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auth): clean repair diff after full verification"
          git push origin HEAD:fix/fail-closed-email-auth
