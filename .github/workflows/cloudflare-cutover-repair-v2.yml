name: Guarded Cloudflare cutover repair v2
on:
  push:
    branches: [fix/cloudflare-production-cutover-20260817]
    paths:
      - .github/workflows/cloudflare-cutover-repair-v2.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-production-cutover-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply exact Cloudflare cutover patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('server.js', "    'https://mywingman.com',\n    'https://chimerical-granita-c68c5a.netlify.app',", "    'https://mywingman.com',\n    'https://mywingman.pages.dev',\n    'https://chimerical-granita-c68c5a.netlify.app',")
          replace_once('scripts/build-netlify-dist.js', "  'refund.html',\n  'app.js',", "  'refund.html',\n  '404.html',\n  'app.js',")
          replace_once('scripts/build-netlify-dist.js', "  fs.writeFileSync(path.join(OUT, '_redirects'), '/app /app.html 200\\n', 'utf8');", "  fs.writeFileSync(path.join(OUT, '_redirects'), '# Cloudflare Pages handles clean HTML URLs natively; no /app rewrite is required.\\n', 'utf8');")
          replace_once('tests/cors_production_policy.test.js', "assert.ok(server.includes(\"'https://mywingman.com'\"), 'Custom production domain must remain allowed');", "assert.ok(server.includes(\"'https://mywingman.com'\"), 'Custom production domain must remain allowed');\nassert.ok(server.includes(\"'https://mywingman.pages.dev'\"), 'Exact Cloudflare Pages production origin must be explicitly allowed');")
          replace_once('tests/run_all_tests.js', "    { name: '40. Mobile Empty-State WCAG Contrast Guard', file: 'empty_state_mobile_contrast.test.js' }\n];", "    { name: '40. Mobile Empty-State WCAG Contrast Guard', file: 'empty_state_mobile_contrast.test.js' },\n    { name: '41. Cloudflare Pages Routing, 404 & CORS Cutover Guard', file: 'cloudflare_pages_cutover.test.js' }\n];")

          Path('404.html').write_text('''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="robots" content="noindex, nofollow">
            <title>Page Not Found | MyWingman</title>
            <link rel="stylesheet" href="/output.css">
            <link rel="stylesheet" href="/style.css">
          </head>
          <body class="min-h-screen bg-[#070a12] text-white flex items-center justify-center px-6">
            <main class="w-full max-w-xl text-center" aria-labelledby="not-found-title">
              <a href="/" aria-label="MyWingman home" class="inline-flex items-center justify-center mb-8">
                <img src="/logo.png" alt="MyWingman" class="h-12 w-auto">
              </a>
              <p class="text-violet-300 font-semibold tracking-wide uppercase text-sm mb-3">404</p>
              <h1 id="not-found-title" class="text-3xl sm:text-4xl font-bold mb-4">Page not found</h1>
              <p class="text-slate-300 leading-relaxed mb-8">The page you requested does not exist. No private application or server files are available at this address.</p>
              <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="inline-flex min-h-11 items-center justify-center rounded-xl bg-violet-600 px-6 py-3 font-semibold hover:bg-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-300">Go to homepage</a>
                <a href="/app.html" class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-600 px-6 py-3 font-semibold hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-300">Open MyWingman</a>
              </div>
            </main>
          </body>
          </html>
          '''.replace('          ', ''))
          PY
      - name: Create permanent Cloudflare cutover regression
        run: |
          cat > tests/cloudflare_pages_cutover.test.js <<'EOF'
          'use strict';

          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const ROOT = path.resolve(__dirname, '..');
          const OUT = path.join(ROOT, 'netlify-dist');
          const buildScript = fs.readFileSync(path.join(ROOT, 'scripts', 'build-netlify-dist.js'), 'utf8');
          const server = fs.readFileSync(path.join(ROOT, 'server.js'), 'utf8');

          assert.ok(server.includes("'https://mywingman.pages.dev'"), 'Cloudflare production origin must be explicitly allowed by Railway CORS');
          assert.ok(!server.includes("'https://*.pages.dev'"), 'CORS must never allow every pages.dev project');
          assert.ok(buildScript.includes("'404.html'"), 'Safe frontend artifact must include a top-level 404.html');
          assert.ok(!buildScript.includes("'/app /app.html 200\\n'"), 'Artifact must not generate the Cloudflare /app self-rewrite loop');

          try {
            execFileSync(process.execPath, ['scripts/build-netlify-dist.js'], { cwd: ROOT, stdio: 'pipe' });

            const redirects = fs.readFileSync(path.join(OUT, '_redirects'), 'utf8');
            const activeRedirects = redirects.split(/\r?\n/).map(x => x.trim()).filter(x => x && !x.startsWith('#'));
            assert.deepStrictEqual(activeRedirects, [], 'Cloudflare cutover artifact must not contain an active /app rewrite');

            const notFoundPath = path.join(OUT, '404.html');
            assert.ok(fs.existsSync(notFoundPath), 'Top-level 404.html must be emitted for Cloudflare Pages');
            const notFound = fs.readFileSync(notFoundPath, 'utf8');
            assert.ok(/Page not found/i.test(notFound), '404 page must contain a clear not-found message');
            assert.ok(!/SUPABASE_SERVICE_ROLE_KEY|AICREDITS_API_KEY/.test(notFound), '404 page must not reveal secret names');

            const release = JSON.parse(fs.readFileSync(path.join(OUT, 'release.json'), 'utf8'));
            assert.ok(release.files && release.files['404.html'], 'release.json must fingerprint 404.html');
            assert.ok(release.files['_redirects'], 'release.json must fingerprint _redirects');

            console.log('✔ Cloudflare Pages cutover guard passed: clean /app routing artifact, real 404 asset, exact CORS origin.');
          } finally {
            fs.rmSync(OUT, { recursive: true, force: true });
          }
          EOF
      - name: Run targeted cutover guard
        run: node tests/cloudflare_pages_cutover.test.js
      - name: Run complete regression suite
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build safe static frontend artifact
        run: npm run build:netlify
      - name: Scope and artifact sanity
        run: |
          test -f netlify-dist/404.html
          test -f netlify-dist/release.json
          test -f netlify-dist/_headers
          test -f netlify-dist/_redirects
          ! grep -q '^/app /app.html 200' netlify-dist/_redirects
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -e netlify-dist/database.js
      - name: Commit only intended product/test changes
        run: |
          rm -rf netlify-dist
          git add server.js scripts/build-netlify-dist.js 404.html tests/cors_production_policy.test.js tests/cloudflare_pages_cutover.test.js tests/run_all_tests.js
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make frontend Cloudflare Pages production-ready'
          git push origin HEAD:fix/cloudflare-production-cutover-20260817
