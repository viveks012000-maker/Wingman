name: Guarded final Cloudflare accessibility repair
on:
  push:
    branches: [fix/cloudflare-final-accessibility-20260817]
    paths:
      - .github/workflows/cloudflare-final-a11y-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-final-accessibility-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply exact accessibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old,new,1))

          replace_once(
            'app.html',
            '<div id="chatbox-messages-container" style="flex: 1; padding: 22px; padding-bottom: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #090714 !important; opacity: 1 !important; scrollbar-width: thin; scrollbar-color: #2e1a47 #090714;"></div>',
            '<div id="chatbox-messages-container" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Practice conversation messages" tabindex="0" style="flex: 1; padding: 22px; padding-bottom: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #090714 !important; opacity: 1 !important; scrollbar-width: thin; scrollbar-color: #2e1a47 #090714;"></div>'
          )
          replace_once(
            'app.html',
            'id="chatbox-credit-notice" style="display: flex; justify-content: space-between; align-items: center; padding: 2px 16px 8px 16px; font-size: 11px; color: rgba(192, 132, 252, 0.6); font-family: monospace; letter-spacing: 0.5px;"',
            'id="chatbox-credit-notice" style="display: flex; justify-content: space-between; align-items: center; padding: 2px 16px 8px 16px; font-size: 11px; color: #c084fc; font-family: monospace; letter-spacing: 0.5px;"'
          )
          replace_once(
            'app.js',
            "chatCounter.style.color = len > 5000 ? '#ef4444' : (len > 4500 ? '#f59e0b' : 'rgba(192, 132, 252, 0.6)');",
            "chatCounter.style.color = len > 5000 ? '#ef4444' : (len > 4500 ? '#f59e0b' : '#c084fc');"
          )
          replace_once(
            'app.html',
            '<input type="checkbox" id="settingLinguisticShorthand" class="sr-only peer" checked>',
            '<input type="checkbox" id="settingLinguisticShorthand" aria-label="Use linguistic shorthand" class="sr-only peer" checked>'
          )
          replace_once(
            'app.html',
            '<input type="range" id="settingEmojiDensity" min="0" max="2" value="1" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-violet-500">',
            '<input type="range" id="settingEmojiDensity" aria-label="Emoji density" min="0" max="2" value="1" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-violet-500">'
          )
          replace_once(
            'app.html',
            '<input type="checkbox" id="settingPlexusToggle" class="sr-only peer" checked onclick="window.togglePlexusPerformance()">',
            '<input type="checkbox" id="settingPlexusToggle" aria-label="Show background plexus canvas" class="sr-only peer" checked onclick="window.togglePlexusPerformance()">'
          )
          replace_once(
            'tests/run_all_tests.js',
            "    { name: '41. Cloudflare Pages Routing, 404 & CORS Cutover Guard', file: 'cloudflare_pages_cutover.test.js' }\n];",
            "    { name: '41. Cloudflare Pages Routing, 404 & CORS Cutover Guard', file: 'cloudflare_pages_cutover.test.js' },\n    { name: '42. Cloudflare Final Accessibility Guard', file: 'cloudflare_final_accessibility.test.js' }\n];"
          )
          PY
      - name: Create permanent regression
        run: |
          cat > tests/cloudflare_final_accessibility.test.js <<'EOF'
          'use strict';
          const assert=require('assert');
          const fs=require('fs');
          const path=require('path');
          const ROOT=path.resolve(__dirname,'..');
          const html=fs.readFileSync(path.join(ROOT,'app.html'),'utf8');
          const js=fs.readFileSync(path.join(ROOT,'app.js'),'utf8');

          function luminance(hex){
            const n=hex.replace('#','');
            const rgb=[0,2,4].map(i=>parseInt(n.slice(i,i+2),16)/255).map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4));
            return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];
          }
          function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}

          assert.ok(html.includes('id="chatbox-messages-container" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Practice conversation messages" tabindex="0"'), 'Maeve scrollable message log must be keyboard-focusable and named');
          assert.ok(html.includes('id="chatbox-credit-notice" style="display: flex; justify-content: space-between; align-items: center; padding: 2px 16px 8px 16px; font-size: 11px; color: #c084fc;'), 'Maeve credit notice must use the accessible purple');
          assert.ok(js.includes("chatCounter.style.color = len > 5000 ? '#ef4444' : (len > 4500 ? '#f59e0b' : '#c084fc');"), 'Character counter default color must not regress to translucent low contrast');
          assert.ok(contrast('#c084fc','#0c0918')>=4.5, `Maeve helper contrast must meet WCAG AA; got ${contrast('#c084fc','#0c0918').toFixed(2)}`);
          assert.ok(contrast('#ef4444','#0c0918')>=4.5, 'Over-limit red counter state must meet AA');
          assert.ok(contrast('#f59e0b','#0c0918')>=4.5, 'Near-limit amber counter state must meet AA');

          for(const [id,label] of [
            ['settingLinguisticShorthand','Use linguistic shorthand'],
            ['settingEmojiDensity','Emoji density'],
            ['settingPlexusToggle','Show background plexus canvas']
          ]){
            const re=new RegExp(`<input[^>]*id=["']${id}["'][^>]*aria-label=["']${label}["']|<input[^>]*aria-label=["']${label}["'][^>]*id=["']${id}["']`);
            assert.ok(re.test(html), `${id} must have accessible name: ${label}`);
          }
          console.log(`✔ Cloudflare final accessibility guard passed; helper contrast ${contrast('#c084fc','#0c0918').toFixed(2)}:1.`);
          EOF
      - name: Run targeted accessibility guard
        run: node tests/cloudflare_final_accessibility.test.js
      - name: Run complete regression suite
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build safe frontend artifact
        run: npm run build:netlify
      - name: Artifact sanity
        run: |
          test -f netlify-dist/404.html
          test -f netlify-dist/release.json
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
      - name: Commit only intended product/test files
        run: |
          rm -rf netlify-dist
          git add app.html app.js tests/cloudflare_final_accessibility.test.js tests/run_all_tests.js
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close final Cloudflare accessibility gaps'
          git push origin HEAD:fix/cloudflare-final-accessibility-20260817
