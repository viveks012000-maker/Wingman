name: CSS Regression Root Cause - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/css-regression-root-cause.yml'

permissions:
  contents: read

jobs:
  diagnose-css-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Build baseline and regenerated Tailwind-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cp output.css /tmp/output-baseline.css
          cp input.css /tmp/input-original.css
          node <<'NODE'
          const fs=require('fs');
          const p='input.css';
          const s=fs.readFileSync(p,'utf8');
          const needle='@import "./style.css";';
          if ((s.split(needle).length-1)!==1) throw new Error('unexpected style.css import count');
          fs.writeFileSync(p,s.replace(needle,'/* diagnostic: custom style.css remains separately loaded */'));
          NODE
          npm run build:css
          cp output.css /tmp/output-candidate.css
          cp /tmp/output-baseline.css output.css
          cp /tmp/input-original.css input.css
          echo "BASELINE_SHA=$(sha256sum /tmp/output-baseline.css | awk '{print $1}')"
          echo "CANDIDATE_SHA=$(sha256sum /tmp/output-candidate.css | awk '{print $1}')"

      - name: Extract suspicious historical rules from stale baseline text
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('/tmp/output-baseline.css','utf8');
          const c=fs.readFileSync('/tmp/output-candidate.css','utf8');
          function contexts(text,needle,label){
            let from=0,count=0;
            while((from=text.indexOf(needle,from))!==-1 && count<30){
              const a=Math.max(0,from-220), z=Math.min(text.length,from+needle.length+320);
              console.log(`${label}[${count}]=${text.slice(a,z)}`);
              from+=needle.length; count++;
            }
            console.log(`${label}_COUNT=${count}`);
          }
          for(const n of ['font-size:17px','font-size:17','font-size:1.0625rem','padding-left:1.25rem','padding-right:1.25rem','@media (min-width:360px)','@media(min-width:360px)','360px']){
            contexts(b,n,`BASELINE_${Buffer.from(n).toString('hex')}`);
            contexts(c,n,`CANDIDATE_${Buffer.from(n).toString('hex')}`);
          }
          NODE

      - name: Compare exact matched rules on the affected mobile header chain
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const http=require('http');
          const fs=require('fs');
          const path=require('path');
          const root=process.cwd();
          const css={baseline:fs.readFileSync('/tmp/output-baseline.css'),candidate:fs.readFileSync('/tmp/output-candidate.css')};
          let mode='baseline';
          const mime={'.html':'text/html; charset=utf-8','.js':'application/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.svg':'image/svg+xml','.woff2':'font/woff2','.png':'image/png'};
          const server=http.createServer((req,res)=>{
            const u=new URL(req.url,'http://local');
            if(u.pathname==='/output.css'){res.writeHead(200,{'content-type':'text/css; charset=utf-8'});return res.end(css[mode]);}
            let rel=decodeURIComponent(u.pathname); if(rel==='/') rel='/index.html';
            const f=path.join(root,rel.replace(/^\/+/,''));
            if(!f.startsWith(root)||!fs.existsSync(f)||!fs.statSync(f).isFile()){res.writeHead(404);return res.end('Not Found');}
            res.writeHead(200,{'content-type':mime[path.extname(f)]||'application/octet-stream'});res.end(fs.readFileSync(f));
          });
          const listen=()=>new Promise(r=>server.listen(0,'127.0.0.1',r));

          async function capture(browser,which){
            mode=which;
            const context=await browser.newContext({viewport:{width:360,height:800}});
            const page=await context.newPage();
            await page.route('**/*',route=>{
              const u=new URL(route.request().url());
              return u.hostname==='127.0.0.1'?route.continue():route.abort();
            });
            await page.goto(`http://127.0.0.1:${server.address().port}/app.html?m=${which}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(150);
            const out=await page.evaluate(()=>{
              function d(el){
                const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                return {tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),rect:[r.x,r.y,r.width,r.height,r.right],scrollWidth:el.scrollWidth,styles:{fontSize:cs.fontSize,lineHeight:cs.lineHeight,paddingLeft:cs.paddingLeft,paddingRight:cs.paddingRight,width:cs.width,height:cs.height,gap:cs.gap,display:cs.display,flex:cs.flex,flexShrink:cs.flexShrink,justifyContent:cs.justifyContent,alignItems:cs.alignItems}};
              }
              function rules(el){
                const out=[];
                function walk(rs,sheet,cond=''){
                  for(const rule of [...rs]){
                    if(rule.type===CSSRule.STYLE_RULE){let m=false;try{m=el.matches(rule.selectorText)}catch{};if(m)out.push({sheet,cond,selector:rule.selectorText,css:rule.style.cssText});}
                    else if(rule.cssRules){const next=rule.type===CSSRule.MEDIA_RULE?(rule.conditionText||rule.media?.mediaText||''):cond;walk(rule.cssRules,sheet,next);}
                  }
                }
                for(const s of [...document.styleSheets]){let rs;try{rs=s.cssRules}catch{continue};walk(rs,s.href||'INLINE');}
                return out;
              }
              const target=[...document.querySelectorAll('*')].find(el=>typeof el.className==='string'&&el.className.includes('flex items-center gap-1 sm:gap-2 shrink-0'));
              if(!target) throw new Error('target mobile header action group not found');
              const nodes={html:document.documentElement,body:document.body,header:target.parentElement,target,child0:target.children[0],child1:target.children[1],child2:target.children[2]};
              const result={doc:{innerWidth,htmlScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}};
              for(const [k,el] of Object.entries(nodes)) result[k]={descriptor:d(el),rules:rules(el)};
              return result;
            });
            await context.close(); return out;
          }

          function ruleKey(x){return `${x.sheet}|${x.cond}|${x.selector}|${x.css}`}
          function compareRules(a,b){
            const am=new Map(a.map(x=>[ruleKey(x),x])),bm=new Map(b.map(x=>[ruleKey(x),x]));
            return {baselineOnly:[...am.keys()].filter(k=>!bm.has(k)).map(k=>am.get(k)),candidateOnly:[...bm.keys()].filter(k=>!am.has(k)).map(k=>bm.get(k))};
          }
          (async()=>{
            await listen(); const browser=await chromium.launch({headless:true});
            try{
              const b=await capture(browser,'baseline'),c=await capture(browser,'candidate');
              console.log('BASELINE_DOC='+JSON.stringify(b.doc)); console.log('CANDIDATE_DOC='+JSON.stringify(c.doc));
              for(const k of ['html','body','header','target','child0','child1','child2']){
                console.log(`BASELINE_${k.toUpperCase()}=${JSON.stringify(b[k].descriptor)}`);
                console.log(`CANDIDATE_${k.toUpperCase()}=${JSON.stringify(c[k].descriptor)}`);
                const diff=compareRules(b[k].rules,c[k].rules);
                console.log(`RULE_DIFF_${k.toUpperCase()}=${JSON.stringify(diff)}`);
              }
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Restore source proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- input.css output.css style.css)"
