name: Current main independent full test

on:
  push:
    branches: [audit/full-production-forensics]
    paths: ['.github/workflows/current-main-full-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parse all first-party JS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            case "$f" in ./vendor/*|./node_modules/*) continue ;; esac
            node --check "$f"
          done < <(find . -type f -name '*.js' -print0)
      - name: Full suite
        run: npm test
