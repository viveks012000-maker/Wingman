name: Frontend eval dependency isolation
on:
  push:
    branches: [fix/frontend-meta-csp-no-eval]
    paths: [.github/workflows/frontend_meta_csp_gate.yml]
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-meta-csp-no-eval
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove unsafe-eval only in runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          old="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co;"
          new="script-src 'self' 'unsafe-inline' https://*.supabase.co;"
          if s.count(old) != 1: raise SystemExit(f'expected one CSP marker, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Isolate eval-producing browser bundle
        shell: bash
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const mime={'.html':'text/html','.js':'application/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.svg':'image/svg+xml'};
          const server=http.createServer((req,res)=>{
            let p=(req.url.split('?')[0]||'/'); if(p==='/') p='/app.html';
            const fp=path.join(root,p.replace(/^\//,''));
            if(!fp.startsWith(root)||!fs.existsSync(fp)||fs.statSync(fp).isDirectory()){res.statusCode=404;return res.end('not found');}
            res.setHeader('Content-Type',mime[path.extname(fp)]||'application/octet-stream'); fs.createReadStream(fp).pipe(res);
          });
          const cases=[
            ['baseline', null],
            ['without-cropper', /\/vendor\/cropperjs\/cropper\.min\.js$/],
            ['without-heic2any', /\/vendor\/heic2any\.min\.js$/],
            ['without-supabase', /\/vendor\/supabase\.min\.js$/],
            ['without-appjs', /\/app\.js$/]
          ];
          (async()=>{
            await new Promise(r=>server.listen(4193,'127.0.0.1',r));
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const results=[];
            for(const [name,block] of cases){
              const page=await browser.newPage();
              if(block){
                await page.route('**/*', async route=>{
                  const u=new URL(route.request().url());
                  if(block.test(u.pathname)) return route.fulfill({status:200,contentType:'application/javascript',body:'/* intentionally suppressed for isolation */'});
                  return route.continue();
                });
              }
              const evalErrors=[];
              const allPageErrors=[];
              page.on('pageerror',e=>{
                const s=String(e);
                allPageErrors.push(s);
                if(/unsafe-eval|Evaluating a string as JavaScript|EvalError/i.test(s)) evalErrors.push(s);
              });
              await page.goto('http://127.0.0.1:4193/app.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1500);
              results.push({name,evalErrorCount:evalErrors.length,evalErrors,allPageErrorCount:allPageErrors.length,firstPageErrors:allPageErrors.slice(0,4)});
              await page.close();
            }
            console.log('ISOLATION_RESULTS='+JSON.stringify(results,null,2));
            const baseline=results.find(x=>x.name==='baseline');
            if(!baseline || baseline.evalErrorCount===0) throw new Error('baseline did not reproduce eval CSP failure');
            const cleared=results.filter(x=>x.name!=='baseline' && x.evalErrorCount===0).map(x=>x.name);
            console.log('EVAL_CLEARED_WHEN='+JSON.stringify(cleared));
            if(cleared.length===0) throw new Error('no isolated script removal cleared eval failure');
            await browser.close(); server.close();
          })().catch(e=>{console.error(e);server.close();process.exit(1);});
          NODE
