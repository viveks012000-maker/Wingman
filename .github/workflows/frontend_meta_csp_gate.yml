name: Frontend meta CSP hardening gate
on:
  push:
    branches: [fix/frontend-meta-csp-no-eval]
    paths: [.github/workflows/frontend_meta_csp_gate.yml]
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-meta-csp-no-eval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply guarded HTML meta-CSP repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co;"
          new = "script-src 'self' 'unsafe-inline' https://*.supabase.co;"
          for rel in ['index.html', 'app.html']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{rel}: expected exactly one unsafe-eval meta CSP, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/runtime_startup_csp_hardening.test.js')
          src = t.read_text(encoding='utf-8')
          anchor = "const envExample = fs.readFileSync(path.join(root, '.env.example'), 'utf8');\n"
          insert = anchor + "const indexHtml = fs.readFileSync(path.join(root, 'index.html'), 'utf8');\nconst appHtml = fs.readFileSync(path.join(root, 'app.html'), 'utf8');\n"
          if src.count(anchor) != 1:
              raise SystemExit('runtime CSP test import anchor mismatch')
          src = src.replace(anchor, insert, 1)
          assertion_anchor = "assert.ok(!buildSource.includes(\"'unsafe-eval'\"), 'Netlify generated CSP must not allow unsafe-eval');\n"
          assertions = assertion_anchor + "assert.ok(!indexHtml.includes(\"'unsafe-eval'\"), 'Landing-page meta CSP must not allow unsafe-eval');\nassert.ok(!appHtml.includes(\"'unsafe-eval'\"), 'App meta CSP must not allow unsafe-eval');\n"
          if src.count(assertion_anchor) != 1:
              raise SystemExit('runtime CSP assertion anchor mismatch')
          src = src.replace(assertion_anchor, assertions, 1)
          t.write_text(src, encoding='utf-8')
          print('Frontend meta CSP hardened and regression expanded.')
          PY
      - name: Full regression, dependency and Netlify build gate
        run: |
          node tests/runtime_startup_csp_hardening.test.js
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build:netlify
          ! grep -R "'unsafe-eval'" netlify-dist/index.html netlify-dist/app.html netlify-dist/_headers
      - name: Chromium run under hardened meta CSP
        shell: bash
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const root=process.cwd();
          const server=http.createServer((req,res)=>{let p=(req.url.split('?')[0]||'/');if(p==='/')p='/index.html';const fp=path.join(root,p.replace(/^\//,''));if(!fp.startsWith(root)||!fs.existsSync(fp)||fs.statSync(fp).isDirectory()){res.statusCode=404;return res.end('not found');}res.setHeader('Content-Type',path.extname(fp)==='.js'?'application/javascript':path.extname(fp)==='.css'?'text/css':'text/html');fs.createReadStream(fp).pipe(res);});
          (async()=>{
            await new Promise(r=>server.listen(4191,'127.0.0.1',r));
            const browser=await chromium.launch({headless:true});
            for(const pageName of ['index.html','app.html']){
              const page=await browser.newPage();
              const pageErrors=[]; const cspEvalErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error' && /unsafe-eval|Refused to evaluate|Content Security Policy/i.test(m.text())) cspEvalErrors.push(m.text());});
              await page.goto('http://127.0.0.1:4191/'+pageName,{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1200);
              console.log(pageName, JSON.stringify({pageErrors,cspEvalErrors}));
              if(pageErrors.length) throw new Error(pageName+' page errors: '+pageErrors.join(' | '));
              if(cspEvalErrors.length) throw new Error(pageName+' attempted eval under CSP: '+cspEvalErrors.join(' | '));
              await page.close();
            }
            await browser.close();server.close();
          })().catch(e=>{console.error(e);server.close();process.exit(1);});
          NODE
      - name: Commit verified CSP files only
        shell: bash
        run: |
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add index.html app.html tests/runtime_startup_csp_hardening.test.js
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$'app.html\nindex.html\ntests/runtime_startup_csp_hardening.test.js'
          test "$changed" = "$expected"
          git commit -m 'security: remove unsafe-eval from frontend meta CSP'
          git push origin HEAD:fix/frontend-meta-csp-no-eval
