name: Generate pinned HEIC runtime

on:
  push:
    branches:
      - fix/heic-csp-replacement
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-heic-runtime.yml'
      - 'scripts/build-heic-browser-runtime.sh'

permissions:
  contents: read

concurrency:
  group: generate-heic-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify runner build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake make curl git python3 sha256sum; do
            command -v "$tool" >/dev/null
          done

      - name: Build exact pinned browser runtime and source materials
        shell: bash
        run: bash scripts/build-heic-browser-runtime.sh

      - name: Verify generated runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/heic-runtime/heic-to-csp.js
          test -s vendor/heic-runtime/NOTICE.txt
          test -s vendor/heic-runtime/SOURCE.txt
          test -s vendor/heic-runtime/LICENSE-heic-to.txt
          test -s vendor/heic-runtime/LICENSE-libheif.txt
          test -s vendor/heic-runtime/LICENSE-libde265.txt
          test -s vendor/heic-runtime/source/heic-to-worker.js
          test -s vendor/heic-runtime/source/libheif-build-emscripten.sh
          ACTUAL_SHA256="$(sha256sum vendor/heic-runtime/heic-to-csp.js | awk '{print $1}')"
          ACTUAL_BYTES="$(wc -c < vendor/heic-runtime/heic-to-csp.js | tr -d ' ')"
          EXPECTED_SHA256="d19857f33f41f9d21d27d515d95d60a2dff0369bcc4d4525c8eef487be7dd9a5"
          EXPECTED_BYTES="3168650"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          ! grep -Eq '(^|[^[:alnum:]_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\()' vendor/heic-runtime/heic-to-csp.js

      - name: Upload mismatched runtime artifact (diagnostic)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heic-runtime-mismatch-${{ github.sha }}
          path: vendor/heic-runtime/heic-to-csp.js
          if-no-files-found: ignore
          retention-days: 7
# trigger workflow
# trigger workflow
