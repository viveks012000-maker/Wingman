name: Generate pinned HEIC runtime

on:
  push:
    branches:
      - fix/heic-csp-replacement
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-heic-runtime.yml'
      - 'scripts/build-heic-browser-runtime.sh'

permissions:
  contents: write

concurrency:
  group: generate-heic-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Verify runner build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake make curl git python3 sha256sum; do
            command -v "$tool" >/dev/null
          done

      - name: Build exact pinned browser runtime and source materials
        shell: bash
        run: bash scripts/build-heic-browser-runtime.sh

      - name: Verify generated runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/heic-runtime/heic-to-csp.js
          test -s vendor/heic-runtime/NOTICE.txt
          test -s vendor/heic-runtime/SOURCE.txt
          test -s vendor/heic-runtime/LICENSE-heic-to.txt
          test -s vendor/heic-runtime/LICENSE-libheif.txt
          test -s vendor/heic-runtime/LICENSE-libde265.txt
          test -s vendor/heic-runtime/source/heic-to-worker.js
          test -s vendor/heic-runtime/source/libheif-build-emscripten.sh
           test "$(sha256sum vendor/heic-runtime/heic-to-csp.js | awk '{print $1}')" = '9e645c9d6b73f68bd18f90f48227a4a4bbf98f071d02fa001e83537b5f7dd408'
           test "$(wc -c < vendor/heic-runtime/heic-to-csp.js | tr -d ' ')" = '3168650'
          ! grep -Eq '(^|[^[:alnum:]_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\()' vendor/heic-runtime/heic-to-csp.js

      - name: Commit generated runtime to this branch only
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/heic-csp-replacement'
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           git add vendor/heic-runtime
          if git diff --cached --quiet; then
            echo 'Generated runtime already matches the committed bytes.'
            exit 0
           fi
           git commit -m 'vendor: add patched strict-CSP HEIC runtime'
           git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
# trigger workflow
# trigger workflow
