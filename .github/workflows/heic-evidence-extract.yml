name: HEIC exact evidence extractor — DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heic-evidence-extract.yml'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  extract-exact-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: '96026398568'
      PR_NUMBER: '94'
    steps:
      - name: Extract only explicit HEIC diagnostic markers
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > /tmp/job.log

          grep -aE 'HEIC_[A-Z0-9_]+=' /tmp/job.log \
            | sed -E 's/^.*(HEIC_[A-Z0-9_]+=)/\1/' \
            | sort -u > /tmp/evidence.txt

          for required in \
            'HEIC_1231_CSP_DIAGNOSTIC=PASS' \
            'HEIC_1231_BROWSER_RESULT=' \
            'HEIC_1231_BROWSER_ERRORS=' \
            'HEIC_CANDIDATE_SHA256=' \
            'HEIC_CANDIDATE_RAW_BYTES=' \
            'HEIC_CANDIDATE_GZIP_BYTES=' \
            'HEIC_CANDIDATE_BROTLI_BYTES=' \
            'HEIC_FIXTURE_SHA256=' \
            'HEIC_PROVENANCE_LIBHEIF_TAG=' \
            'HEIC_PROVENANCE_LIBDE265_COMMIT='; do
            grep -qF "$required" /tmp/evidence.txt || {
              echo "Missing required evidence marker: $required" >&2
              exit 1
            }
          done

          grep -qF 'HEIC_1231_BROWSER_ERRORS=[]' /tmp/evidence.txt || {
            echo 'Browser error array was not empty; refusing to publish evidence as a pass.' >&2
            exit 1
          }

          {
            echo '## HEIC diagnostic exact evidence'
            echo
            echo 'Source: successful HEIC diagnostic job `96026398568` / run `32239384828`.'
            echo 'Only explicit `HEIC_*` markers were extracted; raw runner logs are not posted.'
            echo
            echo '```text'
            cat /tmp/evidence.txt
            echo '```'
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
