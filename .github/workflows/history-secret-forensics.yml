name: Git history secret forensics
on:
  push:
    branches: [audit/post-netlify-deploy-20260815]
    paths: ['.github/workflows/history-secret-forensics.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history without printing values
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess
          names = re.compile(r'(?i)\b(AICREDITS_API_KEY(?:_VISION)?|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|JWT_SECRET)\b\s*[:=]\s*["\']?([^\s"\'`,;}]{16,})')
          keyish = re.compile(r'(?i)\b(sk-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})\b')
          allow_fragments = ('your_', 'example', 'dummy', 'test_', 'process.env', '${{', 'SUPABASE_SERVICE_ROLE_KEY', 'AICREDITS_API_KEY')
          commits = subprocess.check_output(['git','rev-list','--all'], text=True).splitlines()
          findings=[]
          for sha in commits:
              try:
                  names_list=subprocess.check_output(['git','ls-tree','-r','--name-only',sha],text=True,stderr=subprocess.DEVNULL).splitlines()
              except subprocess.CalledProcessError:
                  continue
              for path in names_list:
                  if path.startswith(('node_modules/','vendor/')): continue
                  try:
                      blob=subprocess.check_output(['git','show',f'{sha}:{path}'],stderr=subprocess.DEVNULL)
                      if len(blob)>2_000_000 or b'\x00' in blob[:1000]: continue
                      text=blob.decode('utf-8','ignore')
                  except Exception: continue
                  for i,line in enumerate(text.splitlines(),1):
                      candidates=[]
                      m=names.search(line)
                      if m: candidates.append(('named_assignment',m.group(2)))
                      for k in keyish.findall(line): candidates.append(('key_pattern',k))
                      for kind,val in candidates:
                          lv=val.lower()
                          if any(x.lower() in lv for x in allow_fragments): continue
                          findings.append((sha[:12],path,i,kind,len(val)))
          unique=[]; seen=set()
          for f in findings:
              key=(f[1],f[2],f[3],f[4])
              if key in seen: continue
              seen.add(key); unique.append(f)
          print('HISTORY_SECRET_FINDING_COUNT='+str(len(unique)))
          for sha,path,line,kind,length in unique[:100]:
              print(f'REDACTED_SECRET_LOCATION commit={sha} file={path} line={line} kind={kind} length={length}')
          if len(unique)>100: print('OUTPUT_TRUNCATED=true')
          PY
