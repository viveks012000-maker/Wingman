name: Apply interface accessibility round2

on:
  push:
    branches:
      - fix/interface-accessibility-round2-20260817
    paths:
      - .github/workflows/interface-accessibility-round2-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add shared accessibility runtime and exact UI fixes
        run: |
          cat > accessibility.js <<'JS'
          (function () {
            'use strict';

            var modalConfigs = {
              interstitialModal: { close: 'closeInterstitialModal', label: 'Age and consent' },
              authRequiredModal: { close: 'closeAuthRequiredModal', label: 'Sign in' },
              purchaseModal: { close: 'closePurchaseModal', label: 'Buy credits' },
              settingsModal: { close: 'closeSettingsModal', label: 'Settings' },
              cropModal: { close: 'closeCropModal', label: 'Crop image' },
              deleteAccountModal: { close: 'closeDeleteAccountModal', label: 'Delete account' }
            };
            var states = new Map();

            function isVisible(el) {
              if (!el || !el.isConnected) return false;
              var style = getComputedStyle(el);
              if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) return false;
              if (el.classList.contains('hidden') || el.classList.contains('pointer-events-none')) return false;
              var r = el.getBoundingClientRect();
              return r.width > 0 && r.height > 0;
            }

            function focusables(modal) {
              return Array.from(modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'))
                .filter(function (el) {
                  var s = getComputedStyle(el);
                  var r = el.getBoundingClientRect();
                  return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                });
            }

            function setDialogName(modal, config) {
              modal.setAttribute('role', 'dialog');
              modal.setAttribute('aria-modal', 'true');
              modal.setAttribute('tabindex', '-1');
              var heading = modal.querySelector('h1,h2,h3,h4');
              if (heading) {
                if (!heading.id) heading.id = modal.id + '-title';
                modal.setAttribute('aria-labelledby', heading.id);
                modal.removeAttribute('aria-label');
              } else if (!modal.hasAttribute('aria-label')) {
                modal.setAttribute('aria-label', config.label + ' dialog');
              }
            }

            function enhanceCloseControls(modal, config) {
              modal.querySelectorAll('button').forEach(function (button) {
                var onclick = button.getAttribute('onclick') || '';
                var text = (button.innerText || button.textContent || '').trim().replace(/\s+/g, ' ').toLowerCase();
                if (onclick.indexOf(config.close) !== -1 && (text === 'close' || text === '×' || text === '')) {
                  if (!button.getAttribute('aria-label')) button.setAttribute('aria-label', 'Close ' + config.label.toLowerCase() + ' dialog');
                  button.classList.add('a11y-icon-touch-target');
                }
              });
            }

            function openState(modal) {
              var st = states.get(modal) || { open: false, returnFocus: null };
              if (isVisible(modal) && !st.open) {
                st.open = true;
                st.returnFocus = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
                modal.setAttribute('aria-hidden', 'false');
                states.set(modal, st);
                setTimeout(function () {
                  if (!isVisible(modal)) return;
                  var first = focusables(modal)[0] || modal;
                  try { first.focus({ preventScroll: true }); } catch (_) { try { first.focus(); } catch (_) {} }
                }, 0);
              } else if (!isVisible(modal) && st.open) {
                st.open = false;
                modal.setAttribute('aria-hidden', 'true');
                states.set(modal, st);
                var target = st.returnFocus;
                st.returnFocus = null;
                if (target && target.isConnected && typeof target.focus === 'function') {
                  setTimeout(function () { try { target.focus({ preventScroll: true }); } catch (_) { try { target.focus(); } catch (_) {} } }, 0);
                }
              } else if (!isVisible(modal)) {
                modal.setAttribute('aria-hidden', 'true');
              }
            }

            function topOpenModal() {
              var open = Object.keys(modalConfigs).map(function (id) { return document.getElementById(id); }).filter(isVisible);
              open.sort(function (a, b) {
                return (parseInt(getComputedStyle(a).zIndex || '0', 10) || 0) - (parseInt(getComputedStyle(b).zIndex || '0', 10) || 0);
              });
              return open.length ? open[open.length - 1] : null;
            }

            function closeTopModal(modal) {
              var cfg = modalConfigs[modal.id];
              if (!cfg) return false;
              var fn = window[cfg.close];
              if (typeof fn !== 'function') return false;
              try { fn(); return true; } catch (_) { return false; }
            }

            function enhancePasswordToggle() {
              var button = document.getElementById('togglePasswordBtn');
              var input = document.getElementById('authPasswordInput');
              if (!button || !input) return;
              button.removeAttribute('tabindex');
              button.classList.add('a11y-icon-touch-target');
              function sync() { button.setAttribute('aria-label', input.type === 'password' ? 'Show password' : 'Hide password'); }
              sync();
              button.addEventListener('click', function () { setTimeout(sync, 0); });
            }

            function enhanceNonNativeActions() {
              document.querySelectorAll('[onclick*="openPurchaseModal"]').forEach(function (el) {
                if (/^(BUTTON|A)$/.test(el.tagName)) return;
                el.setAttribute('role', 'button');
                if (el.tabIndex < 0) el.tabIndex = 0;
                if (!el.getAttribute('aria-label')) el.setAttribute('aria-label', 'Buy credits');
                if (!el.__wingmanKeyboardAction) {
                  el.__wingmanKeyboardAction = true;
                  el.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                      event.preventDefault();
                      el.click();
                    }
                  });
                }
              });
            }

            function init() {
              Object.keys(modalConfigs).forEach(function (id) {
                var modal = document.getElementById(id);
                if (!modal) return;
                var cfg = modalConfigs[id];
                setDialogName(modal, cfg);
                enhanceCloseControls(modal, cfg);
                states.set(modal, { open: false, returnFocus: null });
                openState(modal);
                new MutationObserver(function () { openState(modal); }).observe(modal, { attributes: true, attributeFilter: ['class','style','hidden'] });
              });
              enhancePasswordToggle();
              enhanceNonNativeActions();
            }

            document.addEventListener('keydown', function (event) {
              var modal = topOpenModal();
              if (!modal) return;
              if (event.key === 'Escape') {
                event.preventDefault();
                closeTopModal(modal);
                return;
              }
              if (event.key !== 'Tab') return;
              var list = focusables(modal);
              if (!list.length) { event.preventDefault(); modal.focus(); return; }
              var first = list[0], last = list[list.length - 1];
              if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
              else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
              else if (!modal.contains(document.activeElement)) { event.preventDefault(); first.focus(); }
            }, true);

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
            else init();
          })();
          JS

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c != expected: raise SystemExit(f'{path}: expected {expected}, found {c} for {old[:90]!r}')
              p.write_text(s.replace(old,new))

          # Load the shared accessibility runtime after each page's own functions exist.
          replace_exact('app.html','    <script src="app.js"></script>\n</body>','    <script src="app.js"></script>\n    <script src="accessibility.js"></script>\n</body>')
          replace_exact('index.html','</body>\n</html>','    <script src="accessibility.js"></script>\n</body>\n</html>')

          # Add the runtime to the strict public artifact allowlist and cache policy.
          replace_exact('scripts/build-netlify-dist.js',"  'config.js',\n  'supabaseClient.js',","  'config.js',\n  'accessibility.js',\n  'supabaseClient.js',")
          replace_exact('scripts/build-netlify-dist.js',"    '/config.js',\n    '  Cache-Control: no-cache, must-revalidate',\n    '/supabaseClient.js',","    '/config.js',\n    '  Cache-Control: no-cache, must-revalidate',\n    '/accessibility.js',\n    '  Cache-Control: no-cache, must-revalidate',\n    '/supabaseClient.js',")

          # Exact landing-page contrast failure from axe.
          replace_exact('index.html','text-[10px] text-slate-500/70 max-w-xl','text-[10px] text-slate-400 max-w-xl')

          # Text links in prose/legal blocks must be visually distinguishable without color alone.
          for name in ['index.html','terms.html','privacy.html','refund.html']:
              p=Path(name); s=p.read_text(); s=s.replace('hover:underline','underline underline-offset-2 hover:no-underline'); p.write_text(s)

          # Shared style fixes: mobile input zoom floor, modal touch targets, exact analyzer contrast failures.
          p=Path('style.css'); s=p.read_text()
          addon = r'''

/* Accessibility hardening: cross-browser mobile + keyboard contracts. */
.a11y-icon-touch-target {
    min-width: 44px !important;
    min-height: 44px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
}

#analyzeEmptyState > p:nth-child(3),
#screenshotPreviewContainer > div > p:nth-child(3) {
    color: #9ca3af !important;
}

@media (max-width: 767px) {
    #authEmailInput,
    #authPasswordInput,
    #forgotEmailInput,
    #resetEmailInput,
    #bioInput,
    #auditBioInput,
    #simulator-chat-input {
        font-size: 16px !important;
    }
}
'''
          if 'Accessibility hardening: cross-browser mobile + keyboard contracts.' in s:
              raise SystemExit('style accessibility block already exists unexpectedly')
          p.write_text(s + addon)

          # Strengthen browser QA against the exact reproduced failures.
          p=Path('tests/browser_viewport_live_qa.js'); s=p.read_text()
          needle = '''                if (width <= 430 && pageName === 'app.html') {\n                    const maeveFontPx = await page.$eval('#simulator-chat-input', el => parseFloat(getComputedStyle(el).fontSize));\n                    if (maeveFontPx < 16) {\n                        throw new Error(`Maeve mobile input must compute to >=16px to avoid iOS focus zoom; got ${maeveFontPx}px at ${width}px`);\n                    }\n                }'''
          replacement = '''                if (width <= 430 && pageName === 'app.html') {\n                    const mobileInputFonts = await page.evaluate(() => ['authEmailInput','authPasswordInput','resetEmailInput','bioInput','auditBioInput','simulator-chat-input'].map(id => document.getElementById(id)).filter(Boolean).map(el => ({ id: el.id, px: parseFloat(getComputedStyle(el).fontSize) })));\n                    const undersized = mobileInputFonts.filter(x => x.px < 16);\n                    if (undersized.length) {\n                        throw new Error(`Mobile text inputs must compute to >=16px to avoid iOS focus zoom: ${JSON.stringify(undersized)}`);\n                    }\n\n                    await page.evaluate(() => window.openAuthRequiredModal());\n                    await page.waitForTimeout(30);\n                    const appAuth = await page.evaluate(() => {\n                        const m=document.getElementById('authRequiredModal');\n                        const close=[...m.querySelectorAll('button')].find(b => (b.getAttribute('onclick')||'').includes('closeAuthRequiredModal'));\n                        const eye=document.getElementById('togglePasswordBtn');\n                        const cr=close.getBoundingClientRect(), er=eye.getBoundingClientRect();\n                        return {\n                          role:m.getAttribute('role'), modal:m.getAttribute('aria-modal'), labelledby:m.getAttribute('aria-labelledby'), focused:m.contains(document.activeElement),\n                          close:{w:cr.width,h:cr.height,label:close.getAttribute('aria-label')},\n                          eye:{w:er.width,h:er.height,label:eye.getAttribute('aria-label'),tabIndex:eye.tabIndex}\n                        };\n                    });\n                    if (appAuth.role !== 'dialog' || appAuth.modal !== 'true' || !appAuth.labelledby || !appAuth.focused) throw new Error(`App auth dialog semantics/focus invalid: ${JSON.stringify(appAuth)}`);\n                    if (appAuth.close.w < 40 || appAuth.close.h < 40 || !appAuth.close.label) throw new Error(`App auth close target invalid: ${JSON.stringify(appAuth.close)}`);\n                    if (appAuth.eye.w < 40 || appAuth.eye.h < 40 || appAuth.eye.tabIndex < 0 || appAuth.eye.label !== 'Show password') throw new Error(`App password toggle invalid: ${JSON.stringify(appAuth.eye)}`);\n                    await page.keyboard.press('Escape'); await page.waitForTimeout(30);\n                    if (await page.isVisible('#authRequiredModal')) throw new Error('Escape did not close app auth dialog');\n\n                    const buySemantics = await page.evaluate(() => {\n                        const candidates=[...document.querySelectorAll('[onclick*="openPurchaseModal"]')].filter(el => el.tagName !== 'BUTTON' && el.tagName !== 'A');\n                        return candidates.map(el => ({ role:el.getAttribute('role'), tabIndex:el.tabIndex, label:el.getAttribute('aria-label') }));\n                    });\n                    if (buySemantics.some(x => x.role !== 'button' || x.tabIndex < 0 || !x.label)) throw new Error(`Non-native Buy Credits control lacks keyboard semantics: ${JSON.stringify(buySemantics)}`);\n                }'''
          if s.count(needle)!=1: raise SystemExit(f'app browser QA anchor mismatch: {s.count(needle)}')
          s=s.replace(needle,replacement)

          needle2 = '''                    await page.evaluate(() => window.openInterstitialModal());\n                    await page.waitForTimeout(20);\n                    const interstitialClose = await page.$eval('#interstitialModal button[aria-label="Close age and consent dialog"]', el => {'''
          replacement2 = '''                    await page.evaluate(() => window.openInterstitialModal());\n                    await page.waitForTimeout(20);\n                    const interstitialSemantics = await page.evaluate(() => {\n                        const m=document.getElementById('interstitialModal');\n                        return { role:m.getAttribute('role'), modal:m.getAttribute('aria-modal'), labelledby:m.getAttribute('aria-labelledby'), focused:m.contains(document.activeElement) };\n                    });\n                    if (interstitialSemantics.role !== 'dialog' || interstitialSemantics.modal !== 'true' || !interstitialSemantics.labelledby || !interstitialSemantics.focused) throw new Error(`Interstitial dialog semantics/focus invalid: ${JSON.stringify(interstitialSemantics)}`);\n                    const interstitialClose = await page.$eval('#interstitialModal button[aria-label="Close age and consent dialog"]', el => {'''
          if s.count(needle2)!=1: raise SystemExit(f'index interstitial anchor mismatch: {s.count(needle2)}')
          s=s.replace(needle2,replacement2)

          needle3 = '''                    await page.evaluate(() => window.openAuthRequiredModal());\n                    await page.waitForTimeout(20);\n                    const authTargets = await page.evaluate(() => {'''
          replacement3 = '''                    await page.evaluate(() => window.openAuthRequiredModal());\n                    await page.waitForTimeout(20);\n                    const authTargets = await page.evaluate(() => {\n                        const modal=document.getElementById('authRequiredModal');'''
          if s.count(needle3)!=1: raise SystemExit(f'index auth anchor mismatch: {s.count(needle3)}')
          s=s.replace(needle3,replacement3)
          old_return = '''                        return {\n                            close: { width: cr.width, height: cr.height, label: close.getAttribute('aria-label') },\n                            eye: { width: er.width, height: er.height, label: eye.getAttribute('aria-label'), tabIndex: eye.tabIndex }\n                        };'''
          new_return = '''                        return {\n                            modal: { role: modal.getAttribute('role'), ariaModal: modal.getAttribute('aria-modal'), labelledby: modal.getAttribute('aria-labelledby'), focused: modal.contains(document.activeElement) },\n                            close: { width: cr.width, height: cr.height, label: close.getAttribute('aria-label') },\n                            eye: { width: er.width, height: er.height, label: eye.getAttribute('aria-label'), tabIndex: eye.tabIndex }\n                        };'''
          if s.count(old_return)!=1: raise SystemExit(f'auth return anchor mismatch: {s.count(old_return)}')
          s=s.replace(old_return,new_return)
          old_if = '''                    if (authTargets.close.width < 40 || authTargets.close.height < 40) {'''
          new_if = '''                    if (authTargets.modal.role !== 'dialog' || authTargets.modal.ariaModal !== 'true' || !authTargets.modal.labelledby || !authTargets.modal.focused) {\n                        throw new Error(`Auth dialog semantics/focus invalid: ${JSON.stringify(authTargets.modal)}`);\n                    }\n                    if (authTargets.close.width < 40 || authTargets.close.height < 40) {'''
          if s.count(old_if)!=1: raise SystemExit(f'auth if anchor mismatch: {s.count(old_if)}')
          p.write_text(s.replace(old_if,new_if))
          PY

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Strict frontend-only Netlify build
        run: npm run build:netlify
      - name: Verify intended scope and commit green repair
        run: |
          set -euo pipefail
          git status --short
          mapfile -t changed < <(git status --porcelain | awk '{print $2}' | grep -v '^netlify-dist/' | sort)
          expected=(accessibility.js app.html index.html privacy.html refund.html scripts/build-netlify-dist.js style.css terms.html tests/browser_viewport_live_qa.js)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected changed files: ${changed[*]}"
            exit 1
          fi
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add accessibility.js app.html index.html privacy.html refund.html scripts/build-netlify-dist.js style.css terms.html tests/browser_viewport_live_qa.js
          git commit -m 'fix: unify modal keyboard and mobile accessibility'
          git push origin HEAD:fix/interface-accessibility-round2-20260817
