name: Apply interface accessibility round2

on:
  push:
    branches:
      - fix/interface-accessibility-round2-20260817
    paths:
      - scripts/apply-interface-accessibility-round2.py
      - .github/workflows/interface-accessibility-round2-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize audit-only applicator anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-interface-accessibility-round2.py')
          s=p.read_text()

          old="""replace_exact(\n    'index.html',\n    '</body>\\n</html>',\n    '    <script src=\"accessibility.js\"></script>\\n</body>\\n</html>'\n)"""
          new="""p_index = Path('index.html')\ns_index = p_index.read_text()\nif s_index.count('</body>') != 1:\n    raise SystemExit(f\"index.html: expected one </body>, found {s_index.count('</body>')}\")\np_index.write_text(s_index.replace('</body>', '    <script src=\"accessibility.js\"></script>\\n</body>'))"""
          if s.count(old)!=1:
              raise SystemExit(f'index applicator anchor mismatch: {s.count(old)}')
          s=s.replace(old,new)

          old_visibility="if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) return false;"
          new_visibility="if (style.display === 'none' || style.visibility === 'hidden') return false;"
          if s.count(old_visibility)!=1:
              raise SystemExit(f'visibility applicator anchor mismatch: {s.count(old_visibility)}')
          s=s.replace(old_visibility,new_visibility)

          anchor="""    function init() {\n        Object.keys(modalConfigs).forEach(function (id) {"""
          replacement="""    function wrapModalFunctions(modal, config) {\n        var openName = config.close.replace(/^close/, 'open');\n        var originalOpen = window[openName];\n        if (typeof originalOpen === 'function' && !originalOpen.__wingmanA11yWrapped) {\n            var wrappedOpen = function () {\n                var st = states.get(modal) || { open: false, returnFocus: null };\n                if (!st.open) {\n                    st.returnFocus = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;\n                }\n                var result = originalOpen.apply(this, arguments);\n                st.open = true;\n                modal.setAttribute('aria-hidden', 'false');\n                states.set(modal, st);\n                var first = focusables(modal)[0] || modal;\n                try { first.focus({ preventScroll: true }); } catch (_) { try { first.focus(); } catch (_) {} }\n                return result;\n            };\n            wrappedOpen.__wingmanA11yWrapped = true;\n            window[openName] = wrappedOpen;\n        }\n\n        var originalClose = window[config.close];\n        if (typeof originalClose === 'function' && !originalClose.__wingmanA11yWrapped) {\n            var wrappedClose = function () {\n                var st = states.get(modal) || { open: false, returnFocus: null };\n                var target = st.returnFocus;\n                var result = originalClose.apply(this, arguments);\n                st.open = false;\n                st.returnFocus = null;\n                modal.setAttribute('aria-hidden', 'true');\n                states.set(modal, st);\n                if (target && target.isConnected && typeof target.focus === 'function') {\n                    setTimeout(function () {\n                        try { target.focus({ preventScroll: true }); } catch (_) { try { target.focus(); } catch (_) {} }\n                    }, 0);\n                }\n                return result;\n            };\n            wrappedClose.__wingmanA11yWrapped = true;\n            window[config.close] = wrappedClose;\n        }\n    }\n\n    function init() {\n        Object.keys(modalConfigs).forEach(function (id) {"""
          if s.count(anchor)!=1:
              raise SystemExit(f'modal wrapper insertion anchor mismatch: {s.count(anchor)}')
          s=s.replace(anchor,replacement)

          anchor2="""            states.set(modal, { open: false, returnFocus: null });\n            openState(modal);"""
          replacement2="""            states.set(modal, { open: false, returnFocus: null });\n            wrapModalFunctions(modal, cfg);\n            openState(modal);"""
          if s.count(anchor2)!=1:
              raise SystemExit(f'modal wrapper call anchor mismatch: {s.count(anchor2)}')
          p.write_text(s.replace(anchor2,replacement2))
          PY
      - name: Apply exact round2 product/test patch
        run: python scripts/apply-interface-accessibility-round2.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Strict frontend-only Netlify build
        run: npm run build:netlify
      - name: Verify intended scope and commit green repair
        run: |
          set -euo pipefail
          git status --short
          mapfile -t changed < <(git status --porcelain | awk '{print $2}' | grep -v '^netlify-dist/' | grep -v '^scripts/apply-interface-accessibility-round2.py$' | sort)
          expected=(accessibility.js app.html index.html privacy.html refund.html scripts/build-netlify-dist.js style.css terms.html tests/browser_viewport_live_qa.js)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected changed files: ${changed[*]}"
            exit 1
          fi
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add accessibility.js app.html index.html privacy.html refund.html scripts/build-netlify-dist.js style.css terms.html tests/browser_viewport_live_qa.js
          git commit -m 'fix: unify modal keyboard and mobile accessibility'
          git push origin HEAD:fix/interface-accessibility-round2-20260817
