name: Apply interface mobile accessibility repair

on:
  push:
    branches:
      - fix/interface-mobile-accessibility-20260817
    paths:
      - .github/workflows/interface-mobile-accessibility-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact minimal product/test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count} for {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # Landing-page brand links: make the link purpose explicit to accessibility APIs.
          replace_exact('index.html',
              '<a href="index.html" class="flex items-center gap-3 group shrink-0" title="MyWingman Home">',
              '<a href="index.html" class="flex items-center gap-3 group shrink-0" title="MyWingman Home" aria-label="MyWingman home">')
          replace_exact('index.html',
              '<a href="index.html" class="flex items-center gap-2.5">',
              '<a href="index.html" class="flex items-center gap-2.5" aria-label="MyWingman home">')

          # Mobile menu icon has an explicit action name.
          replace_exact('index.html',
              '<button type="button" id="mobile-menu-btn"\n                    class="flex sm:hidden items-center justify-center text-slate-400 hover:text-white transition-colors p-2 z-50 cursor-pointer"',
              '<button type="button" id="mobile-menu-btn" aria-label="Open navigation menu" aria-expanded="false"\n                    class="flex sm:hidden items-center justify-center text-slate-400 hover:text-white transition-colors p-2 z-50 cursor-pointer"')

          # Both modal close controls are explicit 44x44 touch targets with meaningful names.
          replace_exact('index.html',
              '<button type="button"\n                class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-1.5 rounded-full hover:bg-white/10"\n                onclick="window.closeInterstitialModal()">',
              '<button type="button" aria-label="Close age and consent dialog"\n                class="absolute top-4 right-4 w-11 h-11 flex items-center justify-center text-slate-400 hover:text-white transition-colors p-0 rounded-full hover:bg-white/10"\n                onclick="window.closeInterstitialModal()">')
          replace_exact('index.html',
              '<button type="button" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-1"\n                onclick="window.closeAuthRequiredModal(event)">',
              '<button type="button" aria-label="Close sign-in dialog" class="absolute top-4 right-4 w-11 h-11 flex items-center justify-center text-slate-400 hover:text-white transition-colors p-0 rounded-full hover:bg-white/10"\n                onclick="window.closeAuthRequiredModal(event)">')

          # Password eye is keyboard reachable, 44x44, and does not overlap typed text.
          replace_exact('index.html',
              'class="w-full bg-black/50 border border-white/15 rounded-xl p-2.5 pr-10 text-sm text-white focus:border-violet-500 focus:outline-none transition-all" />',
              'class="w-full bg-black/50 border border-white/15 rounded-xl p-2.5 pr-14 text-sm text-white focus:border-violet-500 focus:outline-none transition-all" />')
          replace_exact('index.html',
              '<button type="button" id="togglePasswordBtn"\n                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors cursor-pointer"\n                            onclick="window.togglePasswordVisibility()" tabindex="-1">',
              '<button type="button" id="togglePasswordBtn" aria-label="Show password"\n                            class="absolute right-0.5 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center text-slate-400 hover:text-white transition-colors cursor-pointer rounded-lg"\n                            onclick="window.togglePasswordVisibility()">')
          replace_exact('index.html',
              'if (pwInput.type === "password") {\n                pwInput.type = "text";\n                if (iconEl) iconEl.textContent = "visibility";\n            } else {\n                pwInput.type = "password";\n                if (iconEl) iconEl.textContent = "visibility_off";\n            }',
              'if (pwInput.type === "password") {\n                pwInput.type = "text";\n                toggleBtn.setAttribute("aria-label", "Hide password");\n                if (iconEl) iconEl.textContent = "visibility";\n            } else {\n                pwInput.type = "password";\n                toggleBtn.setAttribute("aria-label", "Show password");\n                if (iconEl) iconEl.textContent = "visibility_off";\n            }')

          # Safari/iOS: focused text controls below 16px can auto-zoom the page.
          replace_exact('app.html',
              '.chatbox-footer input,\n            #simulator-chat-input {\n                font-size: 15px !important;',
              '.chatbox-footer input,\n            #simulator-chat-input {\n                font-size: 16px !important;')

          # Strengthen the existing 45-viewport browser QA with the exact regressions found live.
          p = Path('tests/browser_viewport_live_qa.js')
          s = p.read_text()
          needle = '''                await page.waitForTimeout(100);\n\n                if (pageErrors.length > 0) {'''
          injection = '''                await page.waitForTimeout(100);\n\n                // Mobile usability regressions found by the production cross-browser audit.\n                if (width <= 430 && pageName === 'app.html') {\n                    const maeveFontPx = await page.$eval('#simulator-chat-input', el => parseFloat(getComputedStyle(el).fontSize));\n                    if (maeveFontPx < 16) {\n                        throw new Error(`Maeve mobile input must compute to >=16px to avoid iOS focus zoom; got ${maeveFontPx}px at ${width}px`);\n                    }\n                }\n\n                if (width <= 430 && pageName === 'index.html') {\n                    const footerLabel = await page.$eval('footer a[href="index.html"]', el => el.getAttribute('aria-label'));\n                    if (footerLabel !== 'MyWingman home') {\n                        throw new Error(`Footer brand link needs explicit accessible purpose; got ${footerLabel}`);\n                    }\n\n                    await page.evaluate(() => window.openInterstitialModal());\n                    await page.waitForTimeout(20);\n                    const interstitialClose = await page.$eval('#interstitialModal button[aria-label="Close age and consent dialog"]', el => {\n                        const r = el.getBoundingClientRect();\n                        return { width: r.width, height: r.height };\n                    });\n                    if (interstitialClose.width < 40 || interstitialClose.height < 40) {\n                        throw new Error(`Interstitial close touch target too small: ${interstitialClose.width}x${interstitialClose.height}`);\n                    }\n                    await page.evaluate(() => window.closeInterstitialModal());\n\n                    await page.evaluate(() => window.openAuthRequiredModal());\n                    await page.waitForTimeout(20);\n                    const authTargets = await page.evaluate(() => {\n                        const close = document.querySelector('#authRequiredModal button[aria-label="Close sign-in dialog"]');\n                        const eye = document.getElementById('togglePasswordBtn');\n                        const cr = close.getBoundingClientRect();\n                        const er = eye.getBoundingClientRect();\n                        return {\n                            close: { width: cr.width, height: cr.height, label: close.getAttribute('aria-label') },\n                            eye: { width: er.width, height: er.height, label: eye.getAttribute('aria-label'), tabIndex: eye.tabIndex }\n                        };\n                    });\n                    if (authTargets.close.width < 40 || authTargets.close.height < 40) {\n                        throw new Error(`Auth close touch target too small: ${authTargets.close.width}x${authTargets.close.height}`);\n                    }\n                    if (authTargets.eye.width < 40 || authTargets.eye.height < 40) {\n                        throw new Error(`Password visibility touch target too small: ${authTargets.eye.width}x${authTargets.eye.height}`);\n                    }\n                    if (authTargets.eye.label !== 'Show password' || authTargets.eye.tabIndex < 0) {\n                        throw new Error(`Password visibility control accessibility invalid: ${JSON.stringify(authTargets.eye)}`);\n                    }\n                    await page.click('#togglePasswordBtn');\n                    const hideLabel = await page.getAttribute('#togglePasswordBtn', 'aria-label');\n                    if (hideLabel !== 'Hide password') throw new Error(`Password visibility label did not update: ${hideLabel}`);\n                    await page.click('#togglePasswordBtn');\n                    await page.evaluate(() => window.closeAuthRequiredModal());\n                }\n\n                if (pageErrors.length > 0) {'''
          if s.count(needle) != 1:
              raise SystemExit(f'browser QA injection anchor mismatch: {s.count(needle)}')
          p.write_text(s.replace(needle, injection))
          PY

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Strict frontend-only Netlify build
        run: npm run build:netlify
      - name: Verify intended scope and commit green repair
        run: |
          set -euo pipefail
          git status --short
          mapfile -t changed < <(git status --porcelain | awk '{print $2}' | grep -v '^netlify-dist/' | sort)
          expected=(app.html index.html tests/browser_viewport_live_qa.js)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected changed files: ${changed[*]}"
            exit 1
          fi
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add app.html index.html tests/browser_viewport_live_qa.js
          git commit -m 'fix: harden mobile auth controls and Maeve input'
          git push origin HEAD:fix/interface-mobile-accessibility-20260817
