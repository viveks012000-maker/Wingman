name: Joyful live audit
on:
  push:
    branches:
      - audit/joyful-conkies-live
    paths:
      - .github/workflows/joyful_live_audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fingerprint deployed artifact and sensitive paths
        shell: bash
        run: |
          set -u
          SITE='https://joyful-conkies-026a81.netlify.app'
          EXPECTED='127296d18c51636d4453f2abbd1af72a284575bc'
          release_code=$(curl -sS -o /tmp/release.json -w '%{http_code}' "$SITE/release.json?audit=$(date +%s)")
          echo "release.json -> $release_code"
          if [ "$release_code" = '200' ]; then
            cat /tmp/release.json
            actual=$(jq -r .sourceCommit /tmp/release.json 2>/dev/null || true)
            echo "RELEASE_MATCH=$([ "$actual" = "$EXPECTED" ] && echo true || echo false) actual=$actual expected=$EXPECTED"
          else
            echo 'RELEASE_MATCH=false'
          fi
          for f in app.html app.js config.js supabaseClient.js style.css; do
            code=$(curl -sS -o "/tmp/live-${f//\//_}" -w '%{http_code}' "$SITE/$f?audit=$(date +%s%N)")
            echo "$f -> $code"
            if [ "$code" = '200' ] && [ -f "$f" ]; then
              live=$(sha256sum "/tmp/live-${f//\//_}" | awk '{print $1}')
              repo=$(sha256sum "$f" | awk '{print $1}')
              echo "$f LIVE_SHA256=$live REPO_SHA256=$repo MATCH=$([ "$live" = "$repo" ] && echo true || echo false)"
            fi
          done
          for p in server.js package.json database.js middleware/security.js tests/run_all_tests.js migrations/005_user_consent_and_age_verification.sql; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$SITE/$p?audit=$(date +%s%N)")
            echo "SENSITIVE $p -> $code"
          done
      - name: Probe Railway CORS from exact new origin
        shell: bash
        run: |
          set -u
          ORIGIN='https://joyful-conkies-026a81.netlify.app'
          API='https://wingman-production-c6ce.up.railway.app'
          curl -sS -D /tmp/h -o /tmp/b -H "Origin: $ORIGIN" "$API/api/health"
          cat /tmp/h
          echo '--- body ---'
          cat /tmp/b
          acao=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/h)
          echo "ACAO=${acao:-NONE}"
          echo "JOYFUL_CORS_ALLOWED=$([ "$acao" = "$ORIGIN" ] && echo true || echo false)"
      - name: Live logged-out browser interaction audit
        shell: bash
        run: |
          cat > /tmp/live-audit.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            await context.addInitScript(() => { try { localStorage.clear(); sessionStorage.clear(); } catch (_) {} });
            const page = await context.newPage();
            const pageErrors=[]; const consoleErrors=[]; const aiRequests=[];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('request', req => { if (/\/api\/(chat|analyze|icebreaker|optimize|simulator\/review)/.test(req.url())) aiRequests.push(req.url()); });
            await page.goto('https://joyful-conkies-026a81.netlify.app/app.html?audit=' + Date.now(), {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              window.__auditAuthModalCalls = 0;
              window.__auditPurchaseModalCalls = 0;
              const a = window.openAuthRequiredModal;
              const p = window.openPurchaseModal;
              window.openAuthRequiredModal = function(...args){ window.__auditAuthModalCalls++; return typeof a === 'function' ? a.apply(this,args) : undefined; };
              window.openPurchaseModal = function(...args){ window.__auditPurchaseModalCalls++; return typeof p === 'function' ? p.apply(this,args) : undefined; };
            });
            const results = {};
            const chat = page.locator('#simulator-chat-input');
            const send = page.locator('#chatbox-send-btn');
            results.chatInputDisabledBefore = await chat.isDisabled();
            await chat.fill('Can you help me reply to this message?');
            await page.waitForTimeout(150);
            results.sendDisabledWithText = await send.isDisabled();
            results.sendOpacity = await send.evaluate(el => getComputedStyle(el).opacity);
            if (!results.sendDisabledWithText) { await send.click(); await page.waitForTimeout(250); }

            const ice = page.locator('#bioInput');
            const iceBtn = page.locator('#generateIcebreakerBtn');
            await ice.fill('Loves hiking, coffee, dogs and weekend road trips.');
            await page.waitForTimeout(150);
            results.iceDisabled = await iceBtn.isDisabled();
            if (!results.iceDisabled) { await iceBtn.click(); await page.waitForTimeout(200); }

            const bio = page.locator('#auditBioInput');
            const bioBtn = page.locator('#runAuditBtn');
            await bio.fill('Curious traveler who loves coffee, books and spontaneous weekend adventures.');
            await page.waitForTimeout(150);
            results.bioDisabled = await bioBtn.isDisabled();
            if (!results.bioDisabled) { await bioBtn.click(); await page.waitForTimeout(200); }

            const screenshotInput = page.locator('#screenshotInput');
            results.screenshotInputDisabled = await screenshotInput.isDisabled();
            if (!results.screenshotInputDisabled) {
              const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlZ8kQAAAAASUVORK5CYII=', 'base64');
              await screenshotInput.setInputFiles({name:'audit.png',mimeType:'image/png',buffer:png});
              await page.waitForTimeout(900);
              const analyzer = page.locator('#runAnalysisBtn');
              results.analyzerDisabled = await analyzer.isDisabled();
              if (!results.analyzerDisabled) { await analyzer.click(); await page.waitForTimeout(250); }
            }
            results.counts = await page.evaluate(() => ({auth:window.__auditAuthModalCalls,purchase:window.__auditPurchaseModalCalls}));
            results.aiRequests = aiRequests;
            results.pageErrors = pageErrors;
            results.consoleErrors = consoleErrors.slice(0,15);
            console.log('LIVE_AUDIT=' + JSON.stringify(results));
            assert.strictEqual(results.chatInputDisabledBefore, false, 'Maeve input must be usable while logged out');
            assert.strictEqual(results.sendDisabledWithText, false, 'Maeve Send must activate with logged-out text');
            assert(Number(results.sendOpacity) >= 0.95, 'Maeve Send must look active');
            assert.strictEqual(results.iceDisabled, false, 'Icebreaker must become clickable while logged out');
            assert.strictEqual(results.bioDisabled, false, 'Bio optimizer must become clickable while logged out');
            assert.strictEqual(results.screenshotInputDisabled, false, 'Screenshot input must be usable while logged out');
            assert.strictEqual(results.analyzerDisabled, false, 'Analyzer must become clickable while logged out');
            assert(results.counts.auth >= 4, 'All four clicks must invoke auth-required UX');
            assert.strictEqual(results.counts.purchase, 0, 'Logged-out clicks must never open purchase modal');
            assert.strictEqual(results.aiRequests.length, 0, 'Logged-out clicks must not reach paid AI routes');
            assert.strictEqual(results.pageErrors.length, 0, 'No page errors allowed');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node /tmp/live-audit.js
