name: Joyful high-risk exposure probe
on:
  push:
    branches:
      - audit/joyful-conkies-live
    paths:
      - .github/workflows/joyful_secret_exposure_probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe status only; never print contents
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://joyful-conkies-026a81.netlify.app'
          for p in '.env' '.env.example' '.git/config' 'package-lock.json' 'PROMPT_SYSTEM_MEMORY.json' 'PROJECT_MASTER_SPECIFICATION.md'; do
            code=$(curl -sS -o /tmp/probe -w '%{http_code}' "$SITE/$p?audit=$(date +%s%N)")
            size=$(wc -c </tmp/probe | tr -d ' ')
            echo "$p STATUS=$code SIZE=$size"
          done
