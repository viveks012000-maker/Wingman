name: output.css Coverage Diagnostic - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-favicon-outputcss-diagnostic.yml'

permissions:
  contents: read

jobs:
  css-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 75dc5f70569794cb4e69a089e21f0c8051cfc5d8
      FRONTEND: https://mywingman.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Require exact production release
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl --connect-timeout 12 --max-time 30 -fsS -H 'Cache-Control: no-cache' "$FRONTEND/release.json?verify=$GITHUB_RUN_ID")
          deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty')
          echo "CLOUDFLARE_SOURCE_COMMIT=$deployed"
          test "$deployed" = "$EXPECTED_SHA"

      - name: Measure output.css transfer and disjoint route coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const https = require('https');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const base = process.env.FRONTEND;
          const widths = [320, 375, 430, 1440];

          function sha256(buf) {
            return crypto.createHash('sha256').update(buf).digest('hex');
          }

          // Same sweep-line semantics used by Puppeteer's CSSCoverage implementation:
          // the innermost active rule's hit count controls each disjoint segment.
          function convertToDisjointRanges(nestedRanges) {
            const points = [];
            for (const range of nestedRanges) {
              points.push({ offset: range.startOffset, type: 0, range });
              points.push({ offset: range.endOffset, type: 1, range });
            }
            points.sort((a, b) => {
              if (a.offset !== b.offset) return a.offset - b.offset;
              if (a.type !== b.type) return b.type - a.type;
              const aLength = a.range.endOffset - a.range.startOffset;
              const bLength = b.range.endOffset - b.range.startOffset;
              return a.type === 0 ? bLength - aLength : aLength - bLength;
            });
            const hitCountStack = [];
            const results = [];
            let lastOffset = 0;
            for (const point of points) {
              if (hitCountStack.length && lastOffset < point.offset && hitCountStack[hitCountStack.length - 1] > 0) {
                const lastResult = results[results.length - 1];
                if (lastResult && lastResult.end === lastOffset) lastResult.end = point.offset;
                else results.push({ start: lastOffset, end: point.offset });
              }
              lastOffset = point.offset;
              if (point.type === 0) hitCountStack.push(point.range.count);
              else hitCountStack.pop();
            }
            return results.filter(range => range.end - range.start > 0);
          }

          function mergeRanges(ranges) {
            const sorted = ranges.filter(r => r.end > r.start).sort((a,b) => a.start - b.start || a.end - b.end);
            const out = [];
            for (const r of sorted) {
              const last = out[out.length - 1];
              if (!last || r.start > last.end) out.push({ start: r.start, end: r.end });
              else if (r.end > last.end) last.end = r.end;
            }
            return out;
          }

          function intersectRanges(a, b) {
            a = mergeRanges(a); b = mergeRanges(b);
            const out = [];
            let i = 0, j = 0;
            while (i < a.length && j < b.length) {
              const start = Math.max(a[i].start, b[j].start);
              const end = Math.min(a[i].end, b[j].end);
              if (end > start) out.push({ start, end });
              if (a[i].end < b[j].end) i++; else j++;
            }
            return mergeRanges(out);
          }

          function byteLen(text, ranges) {
            return ranges.reduce((n, r) => n + Buffer.byteLength(text.slice(r.start, r.end)), 0);
          }

          function fetchEncoded(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  'Accept-Encoding': 'br, gzip',
                  'Cache-Control': 'no-cache',
                  'User-Agent': 'MyWingman-outputcss-diagnostic'
                }
              }, res => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  res.resume();
                  return resolve(fetchEncoded(new URL(res.headers.location, url).toString()));
                }
                const chunks = [];
                res.on('data', c => chunks.push(c));
                res.on('end', () => {
                  const wire = Buffer.concat(chunks);
                  if (res.statusCode !== 200) return reject(new Error(`output.css HTTP ${res.statusCode}`));
                  const enc = String(res.headers['content-encoding'] || '').toLowerCase();
                  let decoded = wire;
                  if (enc === 'br') decoded = zlib.brotliDecompressSync(wire);
                  else if (enc === 'gzip') decoded = zlib.gunzipSync(wire);
                  else if (enc && enc !== 'identity') return reject(new Error(`Unsupported content-encoding ${enc}`));
                  resolve({ wire, decoded, headers: res.headers, encoding: enc || 'identity' });
                });
              });
              req.on('error', reject);
              req.setTimeout(30000, () => req.destroy(new Error('output.css request timeout')));
            });
          }

          async function capture(browser, route, width) {
            const context = await browser.newContext({ viewport: { width, height: 900 } });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            const headers = new Map();
            const requests = [];
            const pageErrors = [];
            const consoleErrors = [];
            page.on('request', r => requests.push(r.url()));
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            cdp.on('CSS.styleSheetAdded', ({ header }) => headers.set(header.styleSheetId, header));

            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            await cdp.send('CSS.startRuleUsageTracking');
            const response = await page.goto(base + route + `?css_coverage=${Date.now()}-${width}`, {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });
            if (!response || response.status() !== 200) throw new Error(`${route} ${width}: HTTP failure`);
            await page.waitForTimeout(1200);
            const usageResult = await cdp.send('CSS.stopRuleUsageTracking');

            const matches = [...headers.values()].filter(h => /\/output\.css(?:[?#]|$)/i.test(h.sourceURL || ''));
            if (matches.length !== 1) throw new Error(`${route} ${width}: expected one output.css stylesheet, found ${matches.length}`);
            const id = matches[0].styleSheetId;
            const { text } = await cdp.send('CSS.getStyleSheetText', { styleSheetId: id });
            const raw = usageResult.ruleUsage
              .filter(x => x.styleSheetId === id)
              .map(x => ({ startOffset: x.startOffset, endOffset: x.endOffset, count: x.used ? 1 : 0 }));
            const used = convertToDisjointRanges(raw);

            if (!requests.some(u => /\/output\.css(?:[?#]|$)/i.test(u))) throw new Error(`${route} ${width}: output.css not requested`);
            if (requests.some(u => /\/favicon\.ico(?:[?#]|$)/i.test(u))) throw new Error(`${route} ${width}: favicon.ico request regressed`);
            if (pageErrors.length) throw new Error(`${route} ${width}: page errors ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`${route} ${width}: console errors ${consoleErrors.join(' | ')}`);

            await context.close();
            return { text, used, rawRuleCount: raw.length };
          }

          async function routeCoverage(browser, route) {
            let text = null;
            let union = [];
            const perViewport = [];
            for (const width of widths) {
              const result = await capture(browser, route, width);
              if (text === null) text = result.text;
              else if (text !== result.text) throw new Error(`${route}: output.css changed between viewport captures`);
              const usedBytes = byteLen(result.text, result.used);
              perViewport.push({ width, rawRuleCount: result.rawRuleCount, usedBytes, usedPct: Number((100 * usedBytes / Buffer.byteLength(result.text)).toFixed(2)) });
              union = mergeRanges([...union, ...result.used]);
            }
            const fullBytes = Buffer.byteLength(text);
            const usedBytes = byteLen(text, union);
            return {
              text,
              used: union,
              stats: {
                route,
                widths,
                fullBytes,
                usedBytes,
                uncoveredBytes: fullBytes - usedBytes,
                usedPct: Number((100 * usedBytes / fullBytes).toFixed(2)),
                uncoveredPct: Number((100 * (fullBytes - usedBytes) / fullBytes).toFixed(2)),
                perViewport
              }
            };
          }

          (async () => {
            const transfer = await fetchEncoded(`${base}/output.css?transfer_diag=${Date.now()}`);
            const transferStats = {
              wireBytes: transfer.wire.length,
              decodedBytes: transfer.decoded.length,
              contentEncoding: transfer.encoding,
              contentType: transfer.headers['content-type'] || null,
              cacheControl: transfer.headers['cache-control'] || null,
              etag: transfer.headers.etag || null,
              decodedSha256: sha256(transfer.decoded)
            };
            console.log(`OUTPUT_CSS_TRANSFER=${JSON.stringify(transferStats)}`);

            const browser = await chromium.launch({ headless: true });
            try {
              const home = await routeCoverage(browser, '/');
              const app = await routeCoverage(browser, '/app');
              const homeHash = sha256(Buffer.from(home.text));
              const appHash = sha256(Buffer.from(app.text));
              if (homeHash !== appHash || homeHash !== transferStats.decodedSha256) throw new Error(`CSS hash mismatch transfer=${transferStats.decodedSha256} home=${homeHash} app=${appHash}`);
              if (home.stats.fullBytes !== transferStats.decodedBytes || app.stats.fullBytes !== transferStats.decodedBytes) throw new Error('Decoded CSS byte size mismatch');

              console.log(`HOME_OUTPUT_CSS_COVERAGE=${JSON.stringify(home.stats)}`);
              console.log(`APP_OUTPUT_CSS_COVERAGE=${JSON.stringify(app.stats)}`);

              const shared = intersectRanges(home.used, app.used);
              const union = mergeRanges([...home.used, ...app.used]);
              const sharedBytes = byteLen(home.text, shared);
              const unionBytes = byteLen(home.text, union);
              const routeOverlap = {
                fullCssBytes: Buffer.byteLength(home.text),
                homeUsedBytes: home.stats.usedBytes,
                appUsedBytes: app.stats.usedBytes,
                sharedUsedBytes: sharedBytes,
                homeOnlyUsedBytes: home.stats.usedBytes - sharedBytes,
                appOnlyUsedBytes: app.stats.usedBytes - sharedBytes,
                unionUsedBytes: unionBytes,
                unionUncoveredBytes: Buffer.byteLength(home.text) - unionBytes,
                sharedPctOfUnion: unionBytes ? Number((100 * sharedBytes / unionBytes).toFixed(2)) : 0
              };
              console.log(`OUTPUT_CSS_ROUTE_OVERLAP=${JSON.stringify(routeOverlap)}`);
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Inspect Tailwind CSS build configuration without modifying it
        shell: bash
        run: |
          set -euo pipefail
          echo "PACKAGE_SCRIPTS=$(jq -c '.scripts // {}' package.json)"
          mapfile -t configs < <(find . -maxdepth 3 -type f \( -name 'tailwind.config.*' -o -name 'postcss.config.*' \) -not -path './node_modules/*' | sort)
          echo "CSS_CONFIG_FILES=${#configs[@]}"
          if [ "${#configs[@]}" -gt 0 ]; then
            for file in "${configs[@]}"; do
              echo "===== $file ====="
              sed -n '1,240p' "$file"
            done
          fi
          echo '===== OUTPUT.CSS / TAILWIND REFERENCES ====='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='output.css' -E 'output\.css|tailwindcss|@tailwind|@source|content[[:space:]]*:' . | head -n 260 || true

          echo '===== DYNAMIC CLASS CONSTRUCTION CANDIDATES ====='
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['.'];
          const skip = new Set(['node_modules', '.git', 'dist', 'public', 'test-results', 'playwright-report']);
          const exts = new Set(['.js', '.html']);
          const patterns = [
            /class(Name)?\s*=/,
            /classList\.(add|remove|toggle)\s*\(/,
            /setAttribute\(\s*['"]class['"]/,
            /`[^`\n]*\$\{[^}]+\}[^`\n]*`/
          ];
          let files = 0, candidates = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skip.has(entry.name)) continue;
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (exts.has(path.extname(entry.name))) {
                files++;
                const lines = fs.readFileSync(p, 'utf8').split(/\r?\n/);
                lines.forEach((line, i) => {
                  if (patterns.some(re => re.test(line))) {
                    candidates++;
                    if (candidates <= 260) console.log(`${p}:${i + 1}:${line.trim().slice(0, 500)}`);
                  }
                });
              }
            }
          }
          walk('.');
          console.log(`DYNAMIC_SCAN_FILES=${files}`);
          console.log(`DYNAMIC_CLASS_CANDIDATES=${candidates}`);
          NODE
