name: Live Favicon + output.css Diagnostic - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-favicon-outputcss-diagnostic.yml'

permissions:
  contents: read

jobs:
  live-verify-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 75dc5f70569794cb4e69a089e21f0c8051cfc5d8
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify exact Cloudflare deployment and infrastructure
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 30); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS -H 'Cache-Control: no-cache' "$FRONTEND/release.json?verify=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"

          root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/?verify=$GITHUB_RUN_ID")
          app_code=$(curl -sS -o /tmp/app.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/app?verify=$GITHUB_RUN_ID")
          miss_code=$(curl -sS -o /tmp/missing.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/__favicon_live_missing__$GITHUB_RUN_ID")
          echo "CLOUDFLARE_HTTP root=$root_code app=$app_code missing=$miss_code"
          test "$root_code" = 200
          test "$app_code" = 200
          test "$miss_code" = 404

          icon_count=$(grep -Eo '<link[[:space:]]+rel="icon"[^>]*>' /tmp/root.html | wc -l | tr -d ' ')
          echo "LANDING_ICON_COUNT=$icon_count"
          test "$icon_count" = 1
          grep -Fq 'href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦅</text></svg>"' /tmp/root.html

          health=$(curl -fsS -H 'Cache-Control: no-cache' "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active

          cf=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s\n' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          echo 'CLOUDFLARE_CORS=accepted_exact_origin'

          old=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s\n' "$old" | grep -Eqi '^access-control-allow-origin:'; then
            echo 'Old Netlify origin is still trusted by Railway' >&2
            exit 1
          fi
          echo 'OLD_NETLIFY_CORS=rejected'

          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi

      - name: Chromium Firefox WebKit favicon and runtime matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const base = process.env.FRONTEND;

          async function run(name, type) {
            const browser = await type.launch({ headless: true });
            let count = 0;
            try {
              for (const route of ['/', '/app']) {
                for (const width of [320, 375, 430, 1440]) {
                  const context = await browser.newContext({ viewport: { width, height: 900 } });
                  const page = await context.newPage();
                  const pageErrors = [];
                  const consoleErrors = [];
                  const requests = [];
                  page.on('pageerror', e => pageErrors.push(String(e)));
                  page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
                  page.on('request', r => requests.push(r.url()));

                  const response = await page.goto(base + route + `?browser_verify=${Date.now()}-${width}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  if (!response || response.status() !== 200) throw new Error(`${name} ${route} ${width}: HTTP failure`);
                  await page.waitForTimeout(700);

                  const state = await page.evaluate(() => ({
                    scrollWidth: document.documentElement.scrollWidth,
                    innerWidth,
                    supabase: !!(window.supabaseClient && window.supabaseClient.auth),
                    iconLinks: [...document.querySelectorAll('link[rel~="icon"]')].map(x => x.getAttribute('href') || ''),
                    bodyLength: (document.body && document.body.textContent || '').trim().length,
                    readyState: document.readyState
                  }));

                  if (!state.supabase) throw new Error(`${name} ${route} ${width}: Supabase did not initialize`);
                  if (!state.iconLinks.length || !state.iconLinks.every(x => x.startsWith('data:image/svg+xml,'))) throw new Error(`${name} ${route} ${width}: explicit data favicon missing ${JSON.stringify(state.iconLinks)}`);
                  if (requests.some(u => /\/favicon\.ico(?:[?#]|$)/i.test(u))) throw new Error(`${name} ${route} ${width}: /favicon.ico request observed`);
                  if (state.scrollWidth > state.innerWidth + 1) throw new Error(`${name} ${route} ${width}: horizontal overflow ${state.scrollWidth}>${state.innerWidth}`);
                  if (state.bodyLength < 100) throw new Error(`${name} ${route} ${width}: suspiciously empty body`);
                  if (pageErrors.length) throw new Error(`${name} ${route} ${width}: pageerror ${pageErrors.join(' | ')}`);
                  if (consoleErrors.length) throw new Error(`${name} ${route} ${width}: console errors ${consoleErrors.join(' | ')}`);

                  console.log(`${name} ${route} ${width} PASS faviconRequests=0`);
                  count++;
                  await context.close();
                }
              }
            } finally {
              await browser.close();
            }
            console.log(`${name}_LIVE_PASS=${count}/8`);
          }

          (async () => {
            await run('CHROMIUM', chromium);
            await run('FIREFOX', firefox);
            await run('WEBKIT', webkit);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Diagnose output.css transfer and route coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const https = require('https');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const base = process.env.FRONTEND;

          function sha256(buf) { return crypto.createHash('sha256').update(buf).digest('hex'); }
          function mergeRanges(ranges) {
            const sorted = ranges.filter(r => r.end > r.start).sort((a,b) => a.start - b.start || a.end - b.end);
            const out = [];
            for (const r of sorted) {
              const last = out[out.length - 1];
              if (!last || r.start > last.end) out.push({ start: r.start, end: r.end });
              else if (r.end > last.end) last.end = r.end;
            }
            return out;
          }
          function charLen(ranges) { return ranges.reduce((n,r) => n + (r.end - r.start), 0); }
          function byteLen(text, ranges) { return ranges.reduce((n,r) => n + Buffer.byteLength(text.slice(r.start, r.end)), 0); }
          function intersectRanges(a, b) {
            a = mergeRanges(a); b = mergeRanges(b);
            const out = []; let i = 0, j = 0;
            while (i < a.length && j < b.length) {
              const start = Math.max(a[i].start, b[j].start);
              const end = Math.min(a[i].end, b[j].end);
              if (end > start) out.push({ start, end });
              if (a[i].end < b[j].end) i++; else j++;
            }
            return mergeRanges(out);
          }
          function unionRanges(a, b) { return mergeRanges([...a, ...b]); }

          function fetchEncoded(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  'Accept-Encoding': 'br, gzip',
                  'Cache-Control': 'no-cache',
                  'User-Agent': 'MyWingman-outputcss-diagnostic'
                }
              }, res => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  res.resume();
                  return resolve(fetchEncoded(new URL(res.headers.location, url).toString()));
                }
                const chunks = [];
                res.on('data', c => chunks.push(c));
                res.on('end', () => {
                  const wire = Buffer.concat(chunks);
                  if (res.statusCode !== 200) return reject(new Error(`output.css HTTP ${res.statusCode}`));
                  const enc = String(res.headers['content-encoding'] || '').toLowerCase();
                  let decoded = wire;
                  if (enc === 'br') decoded = zlib.brotliDecompressSync(wire);
                  else if (enc === 'gzip') decoded = zlib.gunzipSync(wire);
                  else if (enc && enc !== 'identity') return reject(new Error(`Unsupported content-encoding ${enc}`));
                  resolve({ wire, decoded, headers: res.headers, encoding: enc || 'identity' });
                });
              });
              req.on('error', reject);
              req.setTimeout(30000, () => req.destroy(new Error('output.css request timeout')));
            });
          }

          async function coverage(browser, route) {
            const context = await browser.newContext({ viewport: { width: 375, height: 900 } });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            const headers = new Map();
            const requests = [];
            const pageErrors = [];
            const consoleErrors = [];
            page.on('request', r => requests.push(r.url()));
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            cdp.on('CSS.styleSheetAdded', ({ header }) => headers.set(header.styleSheetId, header));
            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            await cdp.send('CSS.startRuleUsageTracking');
            const response = await page.goto(base + route + `?css_coverage=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            if (!response || response.status() !== 200) throw new Error(`${route}: HTTP failure`);
            await page.waitForTimeout(1200);
            const usageResult = await cdp.send('CSS.stopRuleUsageTracking');
            const matches = [...headers.values()].filter(h => /\/output\.css(?:[?#]|$)/i.test(h.sourceURL || ''));
            if (matches.length !== 1) throw new Error(`${route}: expected one output.css stylesheet, found ${matches.length} ${JSON.stringify(matches.map(x => x.sourceURL))}`);
            const id = matches[0].styleSheetId;
            const { text } = await cdp.send('CSS.getStyleSheetText', { styleSheetId: id });
            const rules = usageResult.ruleUsage.filter(x => x.styleSheetId === id);
            const tracked = mergeRanges(rules.map(x => ({ start: x.startOffset, end: x.endOffset })));
            const used = mergeRanges(rules.filter(x => x.used).map(x => ({ start: x.startOffset, end: x.endOffset })));
            const stats = {
              route,
              cssSourceURL: matches[0].sourceURL,
              cssChars: text.length,
              cssBytes: Buffer.byteLength(text),
              cssSha256: sha256(Buffer.from(text)),
              trackedRules: rules.length,
              trackedChars: charLen(tracked),
              trackedBytes: byteLen(text, tracked),
              usedChars: charLen(used),
              usedBytes: byteLen(text, used),
              usedPctOfTracked: charLen(tracked) ? Number((100 * charLen(used) / charLen(tracked)).toFixed(2)) : 0,
              usedPctLowerBoundOfFile: text.length ? Number((100 * charLen(used) / text.length).toFixed(2)) : 0,
              outputCssRequested: requests.some(u => /\/output\.css(?:[?#]|$)/i.test(u)),
              faviconIcoRequests: requests.filter(u => /\/favicon\.ico(?:[?#]|$)/i.test(u)).length,
              pageErrors,
              consoleErrors
            };
            await context.close();
            return { text, tracked, used, stats };
          }

          (async () => {
            const transfer = await fetchEncoded(`${base}/output.css?transfer_diag=${Date.now()}`);
            const transferStats = {
              wireBytes: transfer.wire.length,
              decodedBytes: transfer.decoded.length,
              contentEncoding: transfer.encoding,
              contentType: transfer.headers['content-type'] || null,
              cacheControl: transfer.headers['cache-control'] || null,
              cfCacheStatus: transfer.headers['cf-cache-status'] || null,
              etag: transfer.headers.etag || null,
              decodedSha256: sha256(transfer.decoded)
            };
            console.log(`OUTPUT_CSS_TRANSFER=${JSON.stringify(transferStats)}`);

            const browser = await chromium.launch({ headless: true });
            try {
              const home = await coverage(browser, '/');
              const app = await coverage(browser, '/app');
              if (home.stats.cssSha256 !== app.stats.cssSha256) throw new Error('output.css differs between routes');
              if (home.stats.cssBytes !== transfer.decoded.length) throw new Error(`CSS decoded byte mismatch browser=${home.stats.cssBytes} transfer=${transfer.decoded.length}`);
              if (!home.stats.outputCssRequested || !app.stats.outputCssRequested) throw new Error('output.css was not requested on both routes');
              if (home.stats.faviconIcoRequests || app.stats.faviconIcoRequests) throw new Error('favicon.ico request reappeared during CSS diagnostic');
              if (home.stats.pageErrors.length || app.stats.pageErrors.length) throw new Error(`page errors: ${JSON.stringify({home:home.stats.pageErrors, app:app.stats.pageErrors})}`);
              if (home.stats.consoleErrors.length || app.stats.consoleErrors.length) throw new Error(`console errors: ${JSON.stringify({home:home.stats.consoleErrors, app:app.stats.consoleErrors})}`);

              console.log(`HOME_OUTPUT_CSS_COVERAGE=${JSON.stringify(home.stats)}`);
              console.log(`APP_OUTPUT_CSS_COVERAGE=${JSON.stringify(app.stats)}`);

              const shared = intersectRanges(home.used, app.used);
              const union = unionRanges(home.used, app.used);
              const sharedBytes = byteLen(home.text, shared);
              const unionBytes = byteLen(home.text, union);
              const homeBytes = byteLen(home.text, home.used);
              const appBytes = byteLen(home.text, app.used);
              const routeSplit = {
                fullCssBytes: Buffer.byteLength(home.text),
                homeUsedBytes: homeBytes,
                appUsedBytes: appBytes,
                sharedUsedBytes: sharedBytes,
                homeOnlyUsedBytes: homeBytes - sharedBytes,
                appOnlyUsedBytes: appBytes - sharedBytes,
                unionUsedBytes: unionBytes,
                sharedPctOfUnion: unionBytes ? Number((100 * sharedBytes / unionBytes).toFixed(2)) : 0
              };
              console.log(`OUTPUT_CSS_ROUTE_OVERLAP=${JSON.stringify(routeSplit)}`);
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Inspect Tailwind CSS build configuration without modifying it
        shell: bash
        run: |
          set -euo pipefail
          echo "PACKAGE_SCRIPTS=$(jq -c '.scripts // {}' package.json)"
          mapfile -t configs < <(find . -maxdepth 3 -type f \( -name 'tailwind.config.*' -o -name 'postcss.config.*' \) -not -path './node_modules/*' | sort)
          echo "CSS_CONFIG_FILES=${#configs[@]}"
          if [ "${#configs[@]}" -gt 0 ]; then
            for file in "${configs[@]}"; do
              echo "===== $file ====="
              sed -n '1,240p' "$file"
            done
          fi
          echo '===== OUTPUT.CSS REFERENCES ====='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='output.css' -E 'output\.css|tailwindcss|@tailwind|@source|content[[:space:]]*:' . | head -n 240 || true
          echo '===== DYNAMIC CLASS CONSTRUCTION CANDIDATES ====='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E 'class(Name)?[[:space:]]*=|classList\.(add|remove|toggle)|setAttribute\(["'"']class["'"']|`[^`]*\$\{[^}]+\}[^`]*`' -- '*.js' '*.html' 2>/dev/null | head -n 240 || true
