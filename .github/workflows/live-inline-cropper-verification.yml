name: Live Inline Cropper CSS Verification - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-inline-cropper-verification.yml'

permissions:
  contents: read

jobs:
  chromium-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: e485cb85d4971524265f6a40c0650a0022b8f94a
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify exact deployment, backend, CORS and retirement
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 30); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"
          curl -fsS "$FRONTEND/app" > /tmp/app.html
          test "$(grep -Fo 'data-inline-source="vendor/cropperjs/cropper.min.css"' /tmp/app.html | wc -l | tr -d ' ')" = 1
          ! grep -Eq 'href=["'"']\.?/?vendor/cropperjs/cropper\.min\.css["'"']' /tmp/app.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/__cropper_live_missing__")" = 404
          health=$(curl -fsS "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active
          cf=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s\n' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          old=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s\n' "$old" | grep -Eqi '^access-control-allow-origin:'; then exit 1; fi
          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/"); old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi
      - name: Chromium live matrix and Cropper delivery
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),base=process.env.FRONTEND;
          (async()=>{const b=await chromium.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await b.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),errors=[];pg.on('pageerror',e=>errors.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.waitForTimeout(500);const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),cropInline:document.querySelectorAll('style[data-inline-source="vendor/cropperjs/cropper.min.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name),crop:p=>getComputedStyle(p)}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||errors.length)throw new Error(`${p} ${w} runtime failure ${JSON.stringify({d,errors})}`);if(p==='/app'){if(d.cropInline!==1)throw new Error(`${p} ${w} inline marker missing`);if(d.res.some(x=>/\/vendor\/cropperjs\/cropper\.min\.css(?:\?|$)/.test(x)))throw new Error(`${p} ${w} Cropper CSS network request`);const styles=await pg.evaluate(()=>{const el=document.createElement('div');el.className='cropper-container';document.body.appendChild(el);const s=getComputedStyle(el);const out={position:s.position,touchAction:s.touchAction,userSelect:s.userSelect};el.remove();return out});if(styles.position!=='relative'||styles.touchAction!=='none'||styles.userSelect!=='none')throw new Error(`${p} ${w} Cropper styles missing ${JSON.stringify(styles)}`)}console.log(`CHROMIUM ${p} ${w} PASS`);n++;await c.close()}}finally{await b.close()}console.log(`CHROMIUM_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse live measurement
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          export CHROME_PATH="$CHROME_BIN"
          npx --yes lighthouse@12 "$FRONTEND/" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/home.json
          npx --yes lighthouse@12 "$FRONTEND/app" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices --output=json --output-path=/tmp/app.json
          node <<'NODE'
          const fs=require('fs');
          for(const [label,file] of [['HOME','/tmp/home.json'],['APP','/tmp/app.json']]){const r=JSON.parse(fs.readFileSync(file)),c=r.categories,a=r.audits;const o={performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:c.seo?Math.round(c.seo.score*100):null,FCP_ms:Math.round(a['first-contentful-paint'].numericValue),LCP_ms:Math.round(a['largest-contentful-paint'].numericValue),TBT_ms:Math.round(a['total-blocking-time'].numericValue),CLS:Number(a['cumulative-layout-shift'].numericValue.toFixed(3)),SpeedIndex_ms:Math.round(a['speed-index'].numericValue)};const rb=a['render-blocking-insight']?.details?.items||[];const net=(a['network-requests']?.details?.items||[]).map(x=>({url:x.url||'',transferSize:Math.round(x.transferSize||0)}));console.log(`${label}_LIGHTHOUSE=${JSON.stringify(o)}`);console.log(`${label}_RENDER_BLOCKING=${JSON.stringify(rb)}`);console.log(`${label}_TOP_NETWORK=${JSON.stringify(net.sort((x,y)=>y.transferSize-x.transferSize).slice(0,15))}`);if(label==='APP'&&(JSON.stringify(rb).includes('cropper.min.css')||net.some(x=>/\/vendor\/cropperjs\/cropper\.min\.css(?:\?|$)/.test(x.url))))throw new Error('APP Cropper CSS still on network/render-blocking path');if(o.accessibility<90||o.bestPractices<90||(o.seo!==null&&o.seo<90))throw new Error(`${label} quality regression`)}
          NODE

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { EXPECTED_SHA: e485cb85d4971524265f6a40c0650a0022b8f94a, FRONTEND: https://mywingman.pages.dev }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Firefox live matrix
        run: |
          node <<'NODE'
          const {firefox}=require('playwright'),base=process.env.FRONTEND;(async()=>{let rel;for(let i=0;i<30;i++){try{rel=await(await fetch(base+'/release.json')).json()}catch{}if(rel?.sourceCommit===process.env.EXPECTED_SHA)break;await new Promise(r=>setTimeout(r,10000))}if(rel?.sourceCommit!==process.env.EXPECTED_SHA)throw new Error('wrong deployed SHA');const b=await firefox.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await b.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),pe=[];pg.on('pageerror',e=>pe.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.waitForTimeout(300);const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),inline:document.querySelectorAll('style[data-inline-source="vendor/cropperjs/cropper.min.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name)}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||pe.length||(p==='/app'&&(d.inline!==1||d.res.some(x=>/\/vendor\/cropperjs\/cropper\.min\.css/.test(x)))))throw new Error(`${p} ${w} failure`);console.log(`FIREFOX ${p} ${w} PASS`);n++;await c.close()}}finally{await b.close()}console.log(`FIREFOX_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { EXPECTED_SHA: e485cb85d4971524265f6a40c0650a0022b8f94a, FRONTEND: https://mywingman.pages.dev }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: WebKit live matrix
        run: |
          node <<'NODE'
          const {webkit}=require('playwright'),base=process.env.FRONTEND;(async()=>{let rel;for(let i=0;i<30;i++){try{rel=await(await fetch(base+'/release.json')).json()}catch{}if(rel?.sourceCommit===process.env.EXPECTED_SHA)break;await new Promise(r=>setTimeout(r,10000))}if(rel?.sourceCommit!==process.env.EXPECTED_SHA)throw new Error('wrong deployed SHA');const b=await webkit.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await b.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),pe=[];pg.on('pageerror',e=>pe.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.waitForTimeout(300);const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),inline:document.querySelectorAll('style[data-inline-source="vendor/cropperjs/cropper.min.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name)}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||pe.length||(p==='/app'&&(d.inline!==1||d.res.some(x=>/\/vendor\/cropperjs\/cropper\.min\.css/.test(x)))))throw new Error(`${p} ${w} failure`);console.log(`WEBKIT ${p} ${w} PASS`);n++;await c.close()}}finally{await b.close()}console.log(`WEBKIT_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
