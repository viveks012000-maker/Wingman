name: Live Logo Production Verification - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-logo-production-verification.yml'

permissions:
  contents: read

jobs:
  chromium-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 3be74334f5a0a402682f35a87f50ddea2f84afca
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
      LOGO_SHA256: 14316f420346ec38bc2746820200c9ece64cbd7da32f285ce687940c11995e96
      LOGO_BYTES: '33724'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify exact Cloudflare deployment, logo bytes, backend and retirement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-logo-probe
          deployed=''
          for attempt in $(seq 1 30); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            if [ "$deployed" = "$EXPECTED_SHA" ]; then printf '%s\n' "$release" > live-logo-probe/release.json; break; fi
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "$FRONTEND/" > live-logo-probe/index.html
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "$FRONTEND/app" > live-logo-probe/app.html
          grep -q 'logo-384.webp' live-logo-probe/index.html
          grep -q 'logo-384.webp' live-logo-probe/app.html
          ! grep -Eqi 'src=["'"']/?logo\.png["'"']|this\.src=["'"']logo\.png["'"']' live-logo-probe/index.html live-logo-probe/app.html

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "$FRONTEND/logo-384.webp" -o live-logo-probe/logo-384.webp
          test "$(wc -c < live-logo-probe/logo-384.webp | tr -d ' ')" = "$LOGO_BYTES"
          test "$(sha256sum live-logo-probe/logo-384.webp | awk '{print $1}')" = "$LOGO_SHA256"
          echo "LIVE_LOGO_BYTES=$(wc -c < live-logo-probe/logo-384.webp | tr -d ' ')"
          echo "LIVE_LOGO_SHA256=$(sha256sum live-logo-probe/logo-384.webp | awk '{print $1}')"

          test "$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$FRONTEND/")" = 200
          test "$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = 200
          test "$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$FRONTEND/__logo_probe_missing__")" = 404

          health=$(curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active

          cf=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          old=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s' "$old" | grep -Eqi '^access-control-allow-origin:'; then echo 'old Netlify CORS unexpectedly allowed' >&2; exit 1; fi

          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi

      - name: Chromium 8-check live matrix with logo request guard
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const base=process.env.FRONTEND;
          (async()=>{const browser=await chromium.launch({headless:true});let n=0;try{
            for(const p of ['/','/app']) for(const w of [320,375,430,1440]){
              const c=await browser.newContext({viewport:{width:w,height:900}}),page=await c.newPage();
              const pe=[],ce=[];page.on('pageerror',e=>pe.push(String(e)));page.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
              const r=await page.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});if(!r||r.status()!==200)throw new Error(`${p} ${w} HTTP`);
              await page.evaluate(async()=>{await document.fonts.ready;await document.fonts.load('24px "Material Symbols Outlined"')});await page.waitForTimeout(700);
              const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,font:document.fonts.check('24px "Material Symbols Outlined"'),sup:!!(window.supabaseClient&&window.supabaseClient.auth),logos:[...document.querySelectorAll('img[src*="logo-384.webp"]')].map(x=>({complete:x.complete,nw:x.naturalWidth,nh:x.naturalHeight,src:x.currentSrc||x.src})),resources:performance.getEntriesByType('resource').map(x=>x.name)}));
              if(d.sw>d.iw+1||!d.font||!d.sup||pe.length||ce.length)throw new Error(`${p} ${w} runtime failure pageErrors=${JSON.stringify(pe)} consoleErrors=${JSON.stringify(ce)}`);
              if(!d.logos.length||d.logos.some(x=>!x.complete||x.nw!==384||x.nh!==384))throw new Error(`${p} ${w} optimized logo failed ${JSON.stringify(d.logos)}`);
              if(!d.resources.some(x=>/\/logo-384\.webp(?:\?|$)/.test(x)))throw new Error(`${p} ${w} optimized logo was not requested`);
              if(d.resources.some(x=>/\/logo\.png(?:\?|$)/.test(x)))throw new Error(`${p} ${w} oversized logo.png was requested`);
              console.log(`CHROMIUM ${p} ${w} PASS logo=${d.logos[0].nw}x${d.logos[0].nh}`);n++;await c.close();
            }
          }finally{await browser.close()}console.log(`CHROMIUM_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lighthouse live production after logo optimization
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)
          export CHROME_PATH
          npx --yes lighthouse@12 "$FRONTEND/" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=live-logo-probe/home.json
          npx --yes lighthouse@12 "$FRONTEND/app" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices --output=json --output-path=live-logo-probe/app.json
          node <<'NODE'
          const fs=require('fs');
          const baseline={HOME:{performance:76,FCP_ms:2786,LCP_ms:5291,TBT_ms:49,CLS:0.004,SpeedIndex_ms:2786},APP:{performance:71,FCP_ms:2779,LCP_ms:5597,TBT_ms:222,CLS:0.019,SpeedIndex_ms:2779}};
          for(const [label,file] of [['HOME','live-logo-probe/home.json'],['APP','live-logo-probe/app.json']]){
            const r=JSON.parse(fs.readFileSync(file)),c=r.categories,a=r.audits;
            const o={performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:c.seo?Math.round(c.seo.score*100):null,FCP_ms:Math.round(a['first-contentful-paint'].numericValue),LCP_ms:Math.round(a['largest-contentful-paint'].numericValue),TBT_ms:Math.round(a['total-blocking-time'].numericValue),CLS:Number(a['cumulative-layout-shift'].numericValue.toFixed(3)),SpeedIndex_ms:Math.round(a['speed-index'].numericValue)};
            const b=baseline[label]; const delta={performance_points:o.performance-b.performance,FCP_ms:o.FCP_ms-b.FCP_ms,LCP_ms:o.LCP_ms-b.LCP_ms,TBT_ms:o.TBT_ms-b.TBT_ms,CLS:Number((o.CLS-b.CLS).toFixed(3)),SpeedIndex_ms:o.SpeedIndex_ms-b.SpeedIndex_ms};
            const net=(a['network-requests']?.details?.items||[]).map(x=>({url:x.url,transferSize:Math.round(x.transferSize||0),resourceSize:Math.round(x.resourceSize||0),mimeType:x.mimeType||''}));
            const logo=net.filter(x=>/\/logo(?:-384)?\.(?:webp|png)(?:\?|$)/.test(x.url||''));
            const top=net.slice().sort((x,y)=>y.transferSize-x.transferSize).slice(0,15);
            const imageAudits=Object.entries(a).filter(([k,v])=>/image|lcp|render-block/i.test(k)&&v&&typeof v==='object').map(([k,v])=>({id:k,score:v.score,numericValue:v.numericValue,displayValue:v.displayValue,title:v.title}));
            console.log(`${label}_POST_LOGO=${JSON.stringify(o)} BASELINE=${JSON.stringify(b)} DELTA=${JSON.stringify(delta)}`);
            console.log(`${label}_LOGO_NETWORK=${JSON.stringify(logo)}`);
            console.log(`${label}_TOP_NETWORK=${JSON.stringify(top)}`);
            console.log(`${label}_IMAGE_LCP_AUDITS=${JSON.stringify(imageAudits)}`);
            if(!logo.some(x=>/logo-384\.webp/.test(x.url))||logo.some(x=>/logo\.png/.test(x.url)))throw new Error(`${label}: wrong logo network path`);
            if(o.accessibility<90||o.bestPractices<90||(o.seo!==null&&o.seo<90))throw new Error(`${label}: quality category regression`);
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-logo-chromium-lighthouse-${{ github.sha }}
          path: live-logo-probe/
          if-no-files-found: warn
          retention-days: 3

  firefox-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 3be74334f5a0a402682f35a87f50ddea2f84afca
      FRONTEND: https://mywingman.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Wait for exact Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 30); do
            deployed=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"
      - name: Firefox 8-check live matrix with logo request guard
        run: |
          node <<'NODE'
          const {firefox}=require('playwright'),base=process.env.FRONTEND;(async()=>{const browser=await firefox.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await browser.newContext({viewport:{width:w,height:900}}),page=await c.newPage();const pe=[],ce=[];page.on('pageerror',e=>pe.push(String(e)));page.on('console',m=>{if(m.type()==='error')ce.push(m.text())});const r=await page.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});if(!r||r.status()!==200)throw new Error(`${p} ${w} HTTP`);await page.evaluate(async()=>{await document.fonts.ready;await document.fonts.load('24px "Material Symbols Outlined"')});await page.waitForTimeout(700);const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,font:document.fonts.check('24px "Material Symbols Outlined"'),sup:!!(window.supabaseClient&&window.supabaseClient.auth),logos:[...document.querySelectorAll('img[src*="logo-384.webp"]')].map(x=>({complete:x.complete,nw:x.naturalWidth,nh:x.naturalHeight})),resources:performance.getEntriesByType('resource').map(x=>x.name)}));if(d.sw>d.iw+1||!d.font||!d.sup||pe.length||ce.length)throw new Error(`${p} ${w} runtime failure pageErrors=${JSON.stringify(pe)} consoleErrors=${JSON.stringify(ce)}`);if(!d.logos.length||d.logos.some(x=>!x.complete||x.nw!==384||x.nh!==384)||!d.resources.some(x=>/\/logo-384\.webp(?:\?|$)/.test(x))||d.resources.some(x=>/\/logo\.png(?:\?|$)/.test(x)))throw new Error(`${p} ${w} logo failure`);console.log(`FIREFOX ${p} ${w} PASS`);n++;await c.close()}}finally{await browser.close()}console.log(`FIREFOX_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

  webkit-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 3be74334f5a0a402682f35a87f50ddea2f84afca
      FRONTEND: https://mywingman.pages.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: Wait for exact Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 30); do
            deployed=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"
      - name: WebKit 8-check live matrix with logo request guard
        run: |
          node <<'NODE'
          const {webkit}=require('playwright'),base=process.env.FRONTEND;(async()=>{const browser=await webkit.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await browser.newContext({viewport:{width:w,height:900}}),page=await c.newPage();const pe=[],ce=[];page.on('pageerror',e=>pe.push(String(e)));page.on('console',m=>{if(m.type()==='error')ce.push(m.text())});const r=await page.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});if(!r||r.status()!==200)throw new Error(`${p} ${w} HTTP`);await page.evaluate(async()=>{await document.fonts.ready;await document.fonts.load('24px "Material Symbols Outlined"')});await page.waitForTimeout(700);const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,font:document.fonts.check('24px "Material Symbols Outlined"'),sup:!!(window.supabaseClient&&window.supabaseClient.auth),logos:[...document.querySelectorAll('img[src*="logo-384.webp"]')].map(x=>({complete:x.complete,nw:x.naturalWidth,nh:x.naturalHeight})),resources:performance.getEntriesByType('resource').map(x=>x.name)}));if(d.sw>d.iw+1||!d.font||!d.sup||pe.length||ce.length)throw new Error(`${p} ${w} runtime failure pageErrors=${JSON.stringify(pe)} consoleErrors=${JSON.stringify(ce)}`);if(!d.logos.length||d.logos.some(x=>!x.complete||x.nw!==384||x.nh!==384)||!d.resources.some(x=>/\/logo-384\.webp(?:\?|$)/.test(x))||d.resources.some(x=>/\/logo\.png(?:\?|$)/.test(x)))throw new Error(`${p} ${w} logo failure`);console.log(`WEBKIT ${p} ${w} PASS`);n++;await c.close()}}finally{await browser.close()}console.log(`WEBKIT_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
