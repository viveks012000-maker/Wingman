name: Live Material Symbols Verification - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-material-symbols-verification.yml'

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: d07841cef59baf6b069f7b798c21e7a6d44fc2ff
      EXPECTED_FONT_SHA: 56f6255b1341a07abae9b27ad468ecbf7de7141c6522a078060fb4c5173def70
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify exact Cloudflare deployment and infrastructure
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 30); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/__material_symbols_live_missing__")" = 404

          for route in / /app; do
            curl -fsS "$FRONTEND$route" > "/tmp/page$(echo "$route" | tr '/' '_').html"
            headers=$(curl -sS -D - -o /dev/null "$FRONTEND$route" | tr -d '\r')
            if printf '%s\n' "$headers" | grep -Eqi 'fonts\.(googleapis|gstatic)\.com'; then
              echo "Obsolete Google Fonts CSP/header host remains on $route" >&2
              exit 1
            fi
          done

          curl -fsS "$FRONTEND/fonts/material-symbols-outlined-subset.woff2" -o /tmp/material-symbols.woff2
          actual_font_sha=$(sha256sum /tmp/material-symbols.woff2 | awk '{print $1}')
          actual_font_bytes=$(wc -c < /tmp/material-symbols.woff2 | tr -d ' ')
          echo "LIVE_MATERIAL_SYMBOLS_BYTES=$actual_font_bytes SHA256=$actual_font_sha"
          test "$actual_font_bytes" = 16580
          test "$actual_font_sha" = "$EXPECTED_FONT_SHA"

          health=$(curl -fsS "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active

          cf=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s\n' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'

          old=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s\n' "$old" | grep -Eqi '^access-control-allow-origin:'; then
            echo 'Old Netlify origin is still trusted by Railway' >&2
            exit 1
          fi

          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi

      - name: Chromium Firefox WebKit live matrices
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const base = process.env.FRONTEND;
          const localFontPath = '/fonts/material-symbols-outlined-subset.woff2';

          async function run(name, type) {
            const browser = await type.launch({ headless: true });
            let count = 0;
            try {
              for (const route of ['/', '/app']) {
                for (const width of [320, 375, 430, 1440]) {
                  const context = await browser.newContext({ viewport: { width, height: 900 } });
                  const page = await context.newPage();
                  const pageErrors = [];
                  const consoleErrors = [];
                  const requests = [];
                  page.on('pageerror', e => pageErrors.push(String(e)));
                  page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
                  page.on('request', r => requests.push(r.url()));

                  const response = await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  if (!response || response.status() !== 200) throw new Error(`${name} ${route} ${width}: HTTP failure`);
                  await page.waitForTimeout(500);

                  const state = await page.evaluate(async () => {
                    await document.fonts.load("24px 'Material Symbols Outlined'");
                    await document.fonts.load("16px 'Geist'");
                    await document.fonts.load("16px 'Plus Jakarta Sans'");
                    const wrapper = document.createElement('div');
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined';
                    icon.textContent = 'home';
                    wrapper.appendChild(icon);
                    document.body.appendChild(wrapper);
                    const cs = getComputedStyle(icon);
                    const out = {
                      scrollWidth: document.documentElement.scrollWidth,
                      innerWidth,
                      supabase: !!(window.supabaseClient && window.supabaseClient.auth),
                      materialReady: document.fonts.check("24px 'Material Symbols Outlined'"),
                      geistReady: document.fonts.check("16px 'Geist'"),
                      pjsReady: document.fonts.check("16px 'Plus Jakarta Sans'"),
                      iconFamily: cs.fontFamily,
                      iconWidth: icon.getBoundingClientRect().width,
                      localStyles: document.querySelectorAll('style[data-self-hosted-material-symbols]').length,
                      googlePreconnects: [...document.querySelectorAll('link[rel="preconnect"]')].filter(x => /fonts\.(googleapis|gstatic)\.com/i.test(x.href)).length,
                      googleInHtml: /fonts\.(googleapis|gstatic)\.com/i.test(document.documentElement.innerHTML),
                      logoSources: [...document.images].map(x => x.getAttribute('src') || '').filter(x => /logo/i.test(x)),
                      resources: performance.getEntriesByType('resource').map(x => x.name)
                    };
                    wrapper.remove();
                    return out;
                  });

                  const allUrls = [...requests, ...state.resources];
                  if (!state.supabase) throw new Error(`${name} ${route} ${width}: Supabase did not initialize`);
                  if (!state.materialReady || !state.geistReady || !state.pjsReady) throw new Error(`${name} ${route} ${width}: local fonts not ready`);
                  if (!state.iconFamily.includes('Material Symbols Outlined') || !(state.iconWidth > 0 && state.iconWidth < 80)) throw new Error(`${name} ${route} ${width}: icon rendering invalid ${JSON.stringify(state)}`);
                  if (state.localStyles !== 1) throw new Error(`${name} ${route} ${width}: local Material Symbols style count=${state.localStyles}`);
                  if (state.googlePreconnects !== 0 || state.googleInHtml) throw new Error(`${name} ${route} ${width}: obsolete Google font dependency remains in DOM`);
                  if (allUrls.some(u => /fonts\.(googleapis|gstatic)\.com/i.test(u))) throw new Error(`${name} ${route} ${width}: external Google font request observed`);
                  if (!allUrls.some(u => u.includes(localFontPath))) throw new Error(`${name} ${route} ${width}: local Material Symbols font was not requested`);
                  if (allUrls.some(u => /\/logo\.png(?:\?|$)/i.test(u))) throw new Error(`${name} ${route} ${width}: legacy logo.png requested`);
                  if (state.logoSources.length && state.logoSources.some(u => !/logo-384\.webp/i.test(u))) throw new Error(`${name} ${route} ${width}: non-optimized logo source ${JSON.stringify(state.logoSources)}`);
                  if (state.scrollWidth > state.innerWidth + 1) throw new Error(`${name} ${route} ${width}: horizontal overflow ${state.scrollWidth}>${state.innerWidth}`);
                  if (pageErrors.length) throw new Error(`${name} ${route} ${width}: pageerror ${pageErrors.join(' | ')}`);
                  if (consoleErrors.length) throw new Error(`${name} ${route} ${width}: console errors ${consoleErrors.join(' | ')}`);

                  console.log(`${name} ${route} ${width} PASS`);
                  count++;
                  await context.close();
                }
              }
            } finally {
              await browser.close();
            }
            console.log(`${name}_LIVE_PASS=${count}/8`);
          }

          (async () => {
            await run('CHROMIUM', chromium);
            await run('FIREFOX', firefox);
            await run('WEBKIT', webkit);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Fresh Lighthouse production measurement
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$CHROME_BIN"
          npx --yes lighthouse@12 "$FRONTEND/" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/home.json
          npx --yes lighthouse@12 "$FRONTEND/app" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices --output=json --output-path=/tmp/app.json
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['HOME','/tmp/home.json'], ['APP','/tmp/app.json']]) {
            const r = JSON.parse(fs.readFileSync(file));
            const c = r.categories, a = r.audits;
            const metrics = {
              performance: Math.round(c.performance.score * 100),
              accessibility: Math.round(c.accessibility.score * 100),
              bestPractices: Math.round(c['best-practices'].score * 100),
              seo: c.seo ? Math.round(c.seo.score * 100) : null,
              FCP_ms: Math.round(a['first-contentful-paint'].numericValue),
              LCP_ms: Math.round(a['largest-contentful-paint'].numericValue),
              TBT_ms: Math.round(a['total-blocking-time'].numericValue),
              CLS: Number(a['cumulative-layout-shift'].numericValue.toFixed(3)),
              SpeedIndex_ms: Math.round(a['speed-index'].numericValue)
            };
            const blocking = a['render-blocking-insight']?.details?.items || [];
            const network = (a['network-requests']?.details?.items || []).map(x => ({ url: x.url || '', transferSize: Math.round(x.transferSize || 0) }));
            console.log(`${label}_LIGHTHOUSE=${JSON.stringify(metrics)}`);
            console.log(`${label}_RENDER_BLOCKING=${JSON.stringify(blocking)}`);
            console.log(`${label}_TOP_NETWORK=${JSON.stringify(network.sort((x,y) => y.transferSize - x.transferSize).slice(0,15))}`);
            if (JSON.stringify(blocking).match(/Material\+Symbols|fonts\.googleapis\.com/i)) throw new Error(`${label}: external Material Symbols still render-blocking`);
            if (network.some(x => /fonts\.(googleapis|gstatic)\.com/i.test(x.url))) throw new Error(`${label}: Google font network request remains`);
            if (!network.some(x => x.url.includes('/fonts/material-symbols-outlined-subset.woff2'))) throw new Error(`${label}: local Material Symbols font absent from Lighthouse network`);
            if (metrics.accessibility < 90 || metrics.bestPractices < 90 || (metrics.seo !== null && metrics.seo < 90)) throw new Error(`${label}: quality category regression`);
          }
          NODE
