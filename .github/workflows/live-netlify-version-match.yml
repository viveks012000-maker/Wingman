name: Identify live Netlify source version

on:
  push:
    branches: [audit/full-production-forensics]
    paths: ['.github/workflows/live-netlify-version-match.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/full-production-forensics
      - name: Match live assets against git history
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chimerical-granita-c68c5a.netlify.app'
          mkdir -p /tmp/live
          files=(app.html app.js config.js supabaseClient.js style.css)
          for f in "${files[@]}"; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "/tmp/live/$f"
            live_sha=$(sha256sum "/tmp/live/$f" | awk '{print $1}')
            echo "LIVE $f sha256=$live_sha"
            found=''
            while read -r c; do
              if git cat-file -e "$c:$f" 2>/dev/null; then
                repo_sha=$(git show "$c:$f" | sha256sum | awk '{print $1}')
                if [ "$repo_sha" = "$live_sha" ]; then
                  found="$c"
                  echo "MATCH $f commit=$c date=$(git show -s --format=%cI "$c") subject=$(git show -s --format=%s "$c")"
                  break
                fi
              fi
            done < <(git rev-list --all --date-order)
            if [ -z "$found" ]; then echo "MATCH $f commit=NONE"; fi
          done

          echo '=== LIVE CREDIT-RELEVANT LINES ==='
          grep -n -E 'function hasSufficientCredits|checkCreditBalance|openPurchaseModal|creditsStatus|updateUICredits\(0\)|status === 402|state\.credits <|isCreditsBlocked' /tmp/live/app.js || true
          echo '=== LIVE CSP ==='
          grep -n 'Content-Security-Policy' /tmp/live/app.html || true

      - name: Prove deployment artifact versus CDN cache
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chimerical-granita-c68c5a.netlify.app'
          for f in app.html app.js config.js supabaseClient.js style.css; do
            echo "=== $f normal headers ==="
            curl --fail --silent --show-error --location -D "/tmp/${f}.normal.headers" "$BASE/$f" -o "/tmp/${f}.normal"
            grep -iE '^(age|cache-control|etag|last-modified|server|x-nf-|date):' "/tmp/${f}.normal.headers" || true
            echo "normal_sha=$(sha256sum "/tmp/${f}.normal" | awk '{print $1}')"

            stamp="$(date +%s%N)"
            echo "=== $f cache-busted headers ==="
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -D "/tmp/${f}.bust.headers" "$BASE/$f?wingman_audit=$stamp" -o "/tmp/${f}.bust"
            grep -iE '^(age|cache-control|etag|last-modified|server|x-nf-|date):' "/tmp/${f}.bust.headers" || true
            echo "bust_sha=$(sha256sum "/tmp/${f}.bust" | awk '{print $1}')"
            if cmp -s "/tmp/${f}.normal" "/tmp/${f}.bust"; then
              echo "CACHE_BUST_CHANGED $f=false"
            else
              echo "CACHE_BUST_CHANGED $f=true"
            fi
          done
