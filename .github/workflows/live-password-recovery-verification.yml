name: Live Password Recovery Verification - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-password-recovery-verification.yml'

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 388abc3c5c34039a9a0ee1084737f9b968c3c601
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Require exact Cloudflare release and infrastructure health
        shell: bash
        run: |
          set -euo pipefail
          deployed=''
          for attempt in $(seq 1 36); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS -H 'Cache-Control: no-cache' "$FRONTEND/release.json?verify=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            [ "$deployed" = "$EXPECTED_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"

          root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/?verify=$GITHUB_RUN_ID")
          app_code=$(curl -sS -o /tmp/app.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/app?verify=$GITHUB_RUN_ID")
          miss_code=$(curl -sS -o /tmp/missing.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$FRONTEND/__auth_live_missing__$GITHUB_RUN_ID")
          echo "CLOUDFLARE_HTTP root=$root_code app=$app_code missing=$miss_code"
          test "$root_code" = 200
          test "$app_code" = 200
          test "$miss_code" = 404

          health=$(curl -fsS -H 'Cache-Control: no-cache' "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active

          cf=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s\n' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          echo 'CLOUDFLARE_CORS=accepted_exact_origin'

          old=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s\n' "$old" | grep -Eqi '^access-control-allow-origin:'; then
            echo 'Old Netlify origin is still trusted by Railway' >&2
            exit 1
          fi
          echo 'OLD_NETLIFY_CORS=rejected'

          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi

      - name: Require exact deployed auth client bytes and recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$FRONTEND/supabaseClient.js?verify=$GITHUB_RUN_ID" -o /tmp/live-supabaseClient.js
          cmp -s supabaseClient.js /tmp/live-supabaseClient.js
          echo "AUTH_CLIENT_SHA256=$(sha256sum /tmp/live-supabaseClient.js | awk '{print $1}')"
          echo "AUTH_CLIENT_BYTES=$(wc -c < /tmp/live-supabaseClient.js | tr -d ' ')"
          grep -Fq "event === 'PASSWORD_RECOVERY'" /tmp/live-supabaseClient.js
          grep -Fq "window.completePasswordRecovery = async function" /tmp/live-supabaseClient.js
          grep -Fq "client.auth.updateUser({ password: password })" /tmp/live-supabaseClient.js
          grep -Fq "sessionStorage.getItem('wingman_password_recovery_active')" /tmp/live-supabaseClient.js
          grep -Fq "sessionStorage.setItem('wingman_password_recovery_active', 'true')" /tmp/live-supabaseClient.js
          if grep -Eq "localStorage\.(getItem|setItem)\(['\"]wingman_password_recovery_active" /tmp/live-supabaseClient.js; then
            echo 'Recovery state unexpectedly persists in localStorage' >&2
            exit 1
          fi
          echo 'AUTH_CLIENT_EXACT_BYTES_AND_RECOVERY_INVARIANTS=PASS'

      - name: Non-mutating live browser matrix in Chromium Firefox WebKit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const base = process.env.FRONTEND;

          async function run(name, type) {
            const browser = await type.launch({ headless: true });
            let count = 0;
            try {
              for (const route of ['/', '/app']) {
                for (const width of [320, 375, 430, 1440]) {
                  const context = await browser.newContext({ viewport: { width, height: 900 } });
                  const page = await context.newPage();
                  const pageErrors = [];
                  const consoleErrors = [];
                  const forbiddenMutations = [];
                  page.on('pageerror', e => pageErrors.push(String(e)));
                  page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
                  page.on('request', req => {
                    const u = req.url();
                    const method = req.method();
                    if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') forbiddenMutations.push(`${method} ${u}`);
                  });

                  const response = await page.goto(base + route + `?live_auth_verify=${Date.now()}-${width}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  if (!response || response.status() !== 200) throw new Error(`${name} ${route} ${width}: HTTP failure`);
                  await page.waitForTimeout(800);
                  const state = await page.evaluate(() => ({
                    scrollWidth: document.documentElement.scrollWidth,
                    innerWidth,
                    supabase: !!(window.supabaseClient && window.supabaseClient.auth),
                    completeRecoveryType: typeof window.completePasswordRecovery,
                    recoveryOverlay: !!document.getElementById('wingmanPasswordRecoveryOverlay'),
                    recoveryLocal: localStorage.getItem('wingman_password_recovery_active'),
                    recoverySession: sessionStorage.getItem('wingman_password_recovery_active')
                  }));
                  if (!state.supabase) throw new Error(`${name} ${route} ${width}: Supabase did not initialize`);
                  if (route === '/app' && state.completeRecoveryType !== 'function') throw new Error(`${name} ${route} ${width}: recovery completion function missing`);
                  if (state.recoveryOverlay) throw new Error(`${name} ${route} ${width}: ordinary unauthenticated navigation unexpectedly opened recovery dialog`);
                  if (state.recoveryLocal !== null || state.recoverySession !== null) throw new Error(`${name} ${route} ${width}: ordinary navigation polluted recovery storage`);
                  if (state.scrollWidth > state.innerWidth + 1) throw new Error(`${name} ${route} ${width}: horizontal overflow`);
                  if (pageErrors.length) throw new Error(`${name} ${route} ${width}: pageerror ${pageErrors.join(' | ')}`);
                  if (consoleErrors.length) throw new Error(`${name} ${route} ${width}: console errors ${consoleErrors.join(' | ')}`);
                  if (forbiddenMutations.length) throw new Error(`${name} ${route} ${width}: unexpected mutation requests ${forbiddenMutations.join(' | ')}`);
                  console.log(`${name} ${route} ${width} PASS`);
                  count++;
                  await context.close();
                }
              }

              const context = await browser.newContext({ viewport: { width: 375, height: 900 } });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              const response = await page.goto(base + `/app?type=recovery&nonmutating_verify=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
              if (!response || response.status() !== 200) throw new Error(`${name}: recovery-marker URL HTTP failure`);
              await page.waitForTimeout(800);
              const markerState = await page.evaluate(() => ({
                overlay: !!document.getElementById('wingmanPasswordRecoveryOverlay'),
                session: sessionStorage.getItem('wingman_password_recovery_active'),
                local: localStorage.getItem('wingman_password_recovery_active'),
                hasSession: !!window.currentSupabaseSession
              }));
              if (markerState.hasSession) throw new Error(`${name}: unexpected authenticated session in clean browser context`);
              if (markerState.overlay || markerState.session !== null || markerState.local !== null) throw new Error(`${name}: URL marker without recovery session activated recovery state`);
              if (pageErrors.length) throw new Error(`${name}: recovery-marker page errors ${pageErrors.join(' | ')}`);
              console.log(`${name} recovery-marker-without-session PASS`);
              await context.close();
            } finally {
              await browser.close();
            }
            console.log(`${name}_LIVE_AUTH_PASS=${count + 1}/9`);
          }

          (async () => {
            await run('CHROMIUM', chromium);
            await run('FIREFOX', firefox);
            await run('WEBKIT', webkit);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
