name: Live Netlify release one-shot
on:
  push:
    branches: [audit/post-mobile-repair-20260817]
    paths:
      - .github/workflows/live-release-one-shot.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact live release
        run: |
          node - <<'NODE'
          const expected='5b01f27a9f85157e7cf9ad38e79271f6f6fa4ccb';
          const base='https://soft-sawine-30785c.netlify.app/release.json';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let last='UNKNOWN';
            for(let i=1;i<=120;i++){
              try{
                const r=await fetch(`${base}?nudgewatch=${Date.now()}-${i}`,{headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
                const text=await r.text();
                let actual='UNPARSEABLE';
                try{actual=JSON.parse(text).sourceCommit||'MISSING';}catch(e){}
                last=actual;
                console.log(`attempt=${i} http=${r.status} actual=${actual} expected=${expected}`);
                if(r.status===200&&actual===expected){
                  console.log(`::notice title=NETLIFY_NUDGE_DEPLOYED::actual=${actual} attempts=${i}`);
                  return;
                }
              }catch(e){
                console.log(`attempt=${i} error=${String(e)}`);
              }
              await sleep(5000);
            }
            console.log(`::error title=NETLIFY_NUDGE_STILL_STALE::last=${last} expected=${expected}`);
            process.exit(2);
          })().catch(e=>{console.error(e);process.exit(3);});
          NODE
