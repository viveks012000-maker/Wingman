name: Live Self-Hosted Main Fonts Verification - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-self-host-fonts-verification.yml'

permissions:
  contents: read

jobs:
  chromium-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: a46029fc35cd09533d70003b1a93cbc2209309ee
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - name: Install JS deps and locate system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Verify exact deployed artifact, backend and retirement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-fonts
          deployed=''
          for attempt in $(seq 1 30); do
            release=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null || true)
            deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty' 2>/dev/null || true)
            echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
            if [ "$deployed" = "$EXPECTED_SHA" ]; then printf '%s\n' "$release" > live-fonts/release.json; break; fi
            sleep 10
          done
          test "$deployed" = "$EXPECTED_SHA"
          curl -fsS "$FRONTEND/" > live-fonts/index.html
          curl -fsS "$FRONTEND/app" > live-fonts/app.html
          for page in index.html app.html; do
            test "$(grep -Fo 'data-inline-source="fonts/main-fonts.css"' "live-fonts/$page" | wc -l | tr -d ' ')" = 1
            ! grep -Fq 'fonts.googleapis.com/css2?family=Plus+Jakarta+Sans' "live-fonts/$page"
            grep -Fq 'Material+Symbols+Outlined' "live-fonts/$page"
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/__font_live_missing__")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/fonts/geist-normal-latin.woff2")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/fonts/plus-jakarta-sans-normal-latin.woff2")" = 200
          test "$(curl -fsS "$FRONTEND/fonts/geist-normal-latin.woff2" | sha256sum | awk '{print $1}')" = 19f9c92546aa300c312235e3125af1b81394d8db9a4bc4a425cd5b641d2d54e1
          test "$(curl -fsS "$FRONTEND/fonts/plus-jakarta-sans-normal-latin.woff2" | sha256sum | awk '{print $1}')" = 153fc85b70298beeb1d61a5f723331649e7f23bb77302a66e61cb3e2fbdb5e79
          health=$(curl -fsS "$BACKEND/api/health")
          echo "RAILWAY_HEALTH=$health"
          test "$(printf '%s' "$health" | jq -r .status)" = ok
          test "$(printf '%s' "$health" | jq -r .database)" = supabase_active
          cf=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          printf '%s\n' "$cf" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          old=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health" | tr -d '\r')
          if printf '%s\n' "$old" | grep -Eqi '^access-control-allow-origin:'; then exit 1; fi
          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/"); old_rc=$?
          set -e
          echo "OLD_NETLIFY_RC=$old_rc HTTP=$old_code"
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi
      - name: Chromium 8-check live matrix
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),base=process.env.FRONTEND;
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await browser.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),pe=[];pg.on('pageerror',e=>pe.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.evaluate(async()=>{await document.fonts.ready;await Promise.all([document.fonts.load('400 16px Geist','Hello'),document.fonts.load('400 16px "Plus Jakarta Sans"','Hello'),document.fonts.load('24px "Material Symbols Outlined"')])});await pg.waitForTimeout(500);const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),font:document.fonts.check('24px "Material Symbols Outlined"'),inline:document.querySelectorAll('style[data-inline-source="fonts/main-fonts.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name),logos:[...document.querySelectorAll('img[src*="logo-384.webp"]')].map(x=>({ok:x.complete,nw:x.naturalWidth,nh:x.naturalHeight}))}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||!d.font||pe.length||d.inline!==1)throw new Error(`${p} ${w} runtime ${JSON.stringify({d,pe})}`);if(d.res.some(x=>x.includes('fonts.googleapis.com/css2?family=Plus+Jakarta+Sans'))||d.res.some(x=>/fonts\.gstatic\.com\/(s\/geist|s\/inter|s\/plusjakartasans)/.test(x)))throw new Error(`${p} ${w} external main font request`);if(!d.res.some(x=>/\/fonts\/geist-normal-latin\.woff2(?:\?|$)/.test(x))||!d.res.some(x=>/\/fonts\/plus-jakarta-sans-normal-latin\.woff2(?:\?|$)/.test(x)))throw new Error(`${p} ${w} local Latin fonts missing`);if(!d.logos.length||d.logos.some(x=>!x.ok||x.nw!==384||x.nh!==384)||d.res.some(x=>/\/logo\.png(?:\?|$)/.test(x)))throw new Error(`${p} ${w} logo regression`);console.log(`CHROMIUM ${p} ${w} PASS localFonts=1`);n++;await c.close()}}finally{await browser.close()}console.log(`CHROMIUM_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse live production measurement
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$CHROME_BIN"
          npx --yes lighthouse@12 "$FRONTEND/" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=live-fonts/home.json
          npx --yes lighthouse@12 "$FRONTEND/app" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices --output=json --output-path=live-fonts/app.json
          node <<'NODE'
          const fs=require('fs'),baseline={HOME:{performance:90,FCP_ms:1829,LCP_ms:2987,TBT_ms:16,CLS:.002,SpeedIndex_ms:1829},APP:{performance:88,FCP_ms:1742,LCP_ms:3285,TBT_ms:3,CLS:.001,SpeedIndex_ms:1742}};
          for(const [label,file] of [['HOME','live-fonts/home.json'],['APP','live-fonts/app.json']]){const r=JSON.parse(fs.readFileSync(file)),c=r.categories,a=r.audits;const o={performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:c.seo?Math.round(c.seo.score*100):null,FCP_ms:Math.round(a['first-contentful-paint'].numericValue),LCP_ms:Math.round(a['largest-contentful-paint'].numericValue),TBT_ms:Math.round(a['total-blocking-time'].numericValue),CLS:Number(a['cumulative-layout-shift'].numericValue.toFixed(3)),SpeedIndex_ms:Math.round(a['speed-index'].numericValue)};const b=baseline[label],delta={performance_points:o.performance-b.performance,FCP_ms:o.FCP_ms-b.FCP_ms,LCP_ms:o.LCP_ms-b.LCP_ms,TBT_ms:o.TBT_ms-b.TBT_ms,CLS:Number((o.CLS-b.CLS).toFixed(3)),SpeedIndex_ms:o.SpeedIndex_ms-b.SpeedIndex_ms};const rb=a['render-blocking-insight']?.details?.items||[];const net=(a['network-requests']?.details?.items||[]).map(x=>({url:x.url||'',transferSize:Math.round(x.transferSize||0),resourceSize:Math.round(x.resourceSize||0),mimeType:x.mimeType||''}));console.log(`${label}_POST_SELF_HOST_FONTS=${JSON.stringify(o)} BASELINE=${JSON.stringify(b)} DELTA=${JSON.stringify(delta)}`);console.log(`${label}_RENDER_BLOCKING=${JSON.stringify(rb)}`);console.log(`${label}_TOP_NETWORK=${JSON.stringify(net.slice().sort((x,y)=>y.transferSize-x.transferSize).slice(0,15))}`);if(JSON.stringify(rb).includes('fonts.googleapis.com/css2?family=Plus+Jakarta+Sans'))throw new Error(`${label} main Google font CSS remains render-blocking`);if(net.some(x=>x.url.includes('fonts.googleapis.com/css2?family=Plus+Jakarta+Sans'))||net.some(x=>/fonts\.gstatic\.com\/(s\/geist|s\/inter|s\/plusjakartasans)/.test(x.url)))throw new Error(`${label} external main font request remains`);if(!net.some(x=>/\/fonts\/geist-normal-latin\.woff2(?:\?|$)/.test(x.url))||!net.some(x=>/\/fonts\/plus-jakarta-sans-normal-latin\.woff2(?:\?|$)/.test(x.url)))throw new Error(`${label} local main font files absent`);if(o.accessibility<90||o.bestPractices<90||(o.seo!==null&&o.seo<90))throw new Error(`${label} quality regression`)}
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-self-host-fonts-chromium-${{ github.sha }}
          path: live-fonts/
          retention-days: 3

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { EXPECTED_SHA: a46029fc35cd09533d70003b1a93cbc2209309ee, FRONTEND: https://mywingman.pages.dev }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Firefox 8-check matrix
        run: |
          node <<'NODE'
          const {firefox}=require('playwright'),base=process.env.FRONTEND;(async()=>{const rel=await(await fetch(base+'/release.json')).json();if(rel.sourceCommit!==process.env.EXPECTED_SHA)throw new Error('wrong SHA');const b=await firefox.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await b.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),pe=[];pg.on('pageerror',e=>pe.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.evaluate(async()=>Promise.all([document.fonts.load('400 16px Geist','Hello'),document.fonts.load('400 16px "Plus Jakarta Sans"','Hello')]));const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),inline:document.querySelectorAll('style[data-inline-source="fonts/main-fonts.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name)}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||pe.length||d.inline!==1||d.res.some(x=>x.includes('fonts.googleapis.com/css2?family=Plus+Jakarta+Sans'))||!d.res.some(x=>/\/fonts\/geist-normal-latin\.woff2/.test(x))||!d.res.some(x=>/\/fonts\/plus-jakarta-sans-normal-latin\.woff2/.test(x)))throw new Error(`${p} ${w} failure`);console.log(`FIREFOX ${p} ${w} PASS`);n++;await c.close()}}finally{await b.close()}console.log(`FIREFOX_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { EXPECTED_SHA: a46029fc35cd09533d70003b1a93cbc2209309ee, FRONTEND: https://mywingman.pages.dev }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: WebKit 8-check matrix
        run: |
          node <<'NODE'
          const {webkit}=require('playwright'),base=process.env.FRONTEND;(async()=>{const rel=await(await fetch(base+'/release.json')).json();if(rel.sourceCommit!==process.env.EXPECTED_SHA)throw new Error('wrong SHA');const b=await webkit.launch({headless:true});let n=0;try{for(const p of ['/','/app'])for(const w of [320,375,430,1440]){const c=await b.newContext({viewport:{width:w,height:900}}),pg=await c.newPage(),pe=[];pg.on('pageerror',e=>pe.push(String(e)));const r=await pg.goto(base+p,{waitUntil:'domcontentloaded',timeout:45000});await pg.evaluate(async()=>Promise.all([document.fonts.load('400 16px Geist','Hello'),document.fonts.load('400 16px "Plus Jakarta Sans"','Hello')]));const d=await pg.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,sup:!!(window.supabaseClient&&window.supabaseClient.auth),inline:document.querySelectorAll('style[data-inline-source="fonts/main-fonts.css"]').length,res:performance.getEntriesByType('resource').map(x=>x.name)}));if(!r||r.status()!==200||d.sw>d.iw+1||!d.sup||pe.length||d.inline!==1||d.res.some(x=>x.includes('fonts.googleapis.com/css2?family=Plus+Jakarta+Sans'))||!d.res.some(x=>/\/fonts\/geist-normal-latin\.woff2/.test(x))||!d.res.some(x=>/\/fonts\/plus-jakarta-sans-normal-latin\.woff2/.test(x)))throw new Error(`${p} ${w} failure`);console.log(`WEBKIT ${p} ${w} PASS`);n++;await c.close()}}finally{await b.close()}console.log(`WEBKIT_LIVE_PASS=${n}/8`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
