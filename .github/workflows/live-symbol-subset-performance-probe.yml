name: Temporary Live Symbol Subset Performance Probe - DO NOT MERGE

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-symbol-subset-performance-probe.yml'

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PRODUCTION_SHA: e33f720abc1d215c5caec340132c9c2a08b2928b
      FRONTEND: https://mywingman.pages.dev
      BACKEND: https://wingman-production-c6ce.up.railway.app
      OLD_NETLIFY: https://soft-sawine-30785c.netlify.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install live probe runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Wait for exact Cloudflare deployment and verify live subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-symbol-probe
          deployed=''
          for attempt in $(seq 1 42); do
            if release=$(curl --connect-timeout 12 --max-time 30 -fsS "$FRONTEND/release.json" 2>/dev/null); then
              deployed=$(printf '%s' "$release" | jq -r '.sourceCommit // empty')
              echo "Cloudflare attempt=$attempt sourceCommit=$deployed"
              if [ "$deployed" = "$EXPECTED_PRODUCTION_SHA" ]; then
                printf '%s\n' "$release" > live-symbol-probe/release.json
                break
              fi
            fi
            sleep 10
          done
          test "$deployed" = "$EXPECTED_PRODUCTION_SHA"

          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 -fsS "$FRONTEND/" > live-symbol-probe/index.html
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 -fsS "$FRONTEND/app" > live-symbol-probe/app.html

          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html','app.html'):
              html=Path('live-symbol-probe',name).read_text(encoding='utf-8')
              urls=re.findall(r'https://fonts\.googleapis\.com/css2\?family=Material\+Symbols\+Outlined:[^"\']+icon_names=([^&"\']+)&display=block',html)
              if len(urls)!=1:
                  raise SystemExit(f'{name}: expected exactly one Material Symbols subset URL, got {len(urls)}')
              icons=urls[0].split(',')
              if len(icons)!=45:
                  raise SystemExit(f'{name}: expected 45 icons, got {len(icons)}')
              if 'refresh' not in icons or 'visibility' not in icons or 'visibility_off' not in icons:
                  raise SystemExit(f'{name}: required dynamic icons missing')
              print(f'{name}: LIVE_MATERIAL_SYMBOLS_ICONS={len(icons)}')
          PY
          echo 'Exact Cloudflare SHA + live Material Symbols subset: PASS'

      - name: Verify live Google subset payload size
        shell: bash
        run: |
          set -euo pipefail
          subset_url=$(python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('live-symbol-probe/index.html').read_text(encoding='utf-8')
          m=re.search(r'https://fonts\.googleapis\.com/css2\?family=Material\+Symbols\+Outlined:[^"\']+icon_names=[^"\']+&display=block',html)
          if not m: raise SystemExit('subset URL missing')
          print(m.group(0))
          PY
          )
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 -A "$ua" -fsS "$subset_url" -o live-symbol-probe/material-symbols.css
          font_url=$(python3 - <<'PY'
          import re
          from pathlib import Path
          css=Path('live-symbol-probe/material-symbols.css').read_text(encoding='utf-8')
          m=re.search(r"src:\s*url\((?:['\"])?(https://fonts\.gstatic\.com/[^)'\"]+)(?:['\"])?\)\s*format\(['\"]woff2['\"]\)",css)
          if not m: raise SystemExit('font URL missing')
          print(m.group(1))
          PY
          )
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 -A "$ua" -fsS "$font_url" -o live-symbol-probe/material-symbols.woff2
          bytes=$(wc -c < live-symbol-probe/material-symbols.woff2 | tr -d ' ')
          echo "LIVE_MATERIAL_SYMBOLS_WOFF2_BYTES=$bytes"
          test "$bytes" -gt 1000
          test "$bytes" -lt 300000

      - name: Re-verify production routing security backend and Netlify retirement
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() { curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 "$@"; }
          test "$(retry_curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/")" = 200
          test "$(retry_curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/app")" = 200
          test "$(retry_curl -sS -o /dev/null -w '%{http_code}' "$FRONTEND/__subset_missing__")" = 404
          retry_curl -sS -D live-symbol-probe/frontend-headers.txt -o /dev/null "$FRONTEND/"
          tr -d '\r' < live-symbol-probe/frontend-headers.txt > live-symbol-probe/frontend-headers-clean.txt
          grep -Eqi '^strict-transport-security:[[:space:]]*max-age=31536000' live-symbol-probe/frontend-headers-clean.txt
          grep -Eqi '^content-security-policy:' live-symbol-probe/frontend-headers-clean.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' live-symbol-probe/frontend-headers-clean.txt
          health_code=$(retry_curl -sS -o live-symbol-probe/railway-health.json -w '%{http_code}' "$BACKEND/api/health")
          test "$health_code" = 200
          test "$(jq -r '.status' live-symbol-probe/railway-health.json)" = ok
          test "$(jq -r '.database' live-symbol-probe/railway-health.json)" = supabase_active
          retry_curl -sS -D live-symbol-probe/cors-cloudflare.txt -o /dev/null -X OPTIONS -H 'Origin: https://mywingman.pages.dev' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health"
          tr -d '\r' < live-symbol-probe/cors-cloudflare.txt | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://mywingman\.pages\.dev$'
          retry_curl -sS -D live-symbol-probe/cors-old-netlify.txt -o /dev/null -X OPTIONS -H 'Origin: https://soft-sawine-30785c.netlify.app' -H 'Access-Control-Request-Method: GET' "$BACKEND/api/health"
          if tr -d '\r' < live-symbol-probe/cors-old-netlify.txt | grep -Eqi '^access-control-allow-origin:'; then exit 1; fi
          set +e
          old_code=$(curl --connect-timeout 12 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$OLD_NETLIFY/")
          old_rc=$?
          set -e
          if [ "$old_rc" -eq 0 ]; then test "$old_code" = 404; fi
          echo 'Production invariants: PASS'

      - name: Live Chromium Firefox WebKit matrix and icon rendering
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium, firefox, webkit } = require('playwright');
          const frontend = process.env.FRONTEND;
          const engines = { chromium, firefox, webkit };
          const widths = [320,375,430,1440];
          (async()=>{
            let checks=0;
            for(const [name,launcher] of Object.entries(engines)){
              const browser=await launcher.launch({headless:true});
              try{
                for(const pathname of ['/','/app']){
                  for(const width of widths){
                    const context=await browser.newContext({viewport:{width,height:900}});
                    const page=await context.newPage();
                    const pageErrors=[]; const consoleErrors=[];
                    page.on('pageerror',e=>pageErrors.push(String(e)));
                    page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                    const response=await page.goto(frontend+pathname,{waitUntil:'domcontentloaded',timeout:45000});
                    if(!response||response.status()!==200) throw new Error(`${name} ${pathname} ${width}: HTTP ${response&&response.status()}`);
                    await page.evaluate(async()=>{await document.fonts.ready; await document.fonts.load('24px "Material Symbols Outlined"');});
                    await page.waitForTimeout(900);
                    const data=await page.evaluate(()=>({
                      sw:document.documentElement.scrollWidth, iw:innerWidth,
                      supabase:!!(window.supabaseClient&&window.supabaseClient.auth),
                      fontReady:document.fonts.check('24px "Material Symbols Outlined"'),
                      icons:[...document.querySelectorAll('.material-symbols-outlined')].filter(el=>el.offsetParent!==null).slice(0,80).map(el=>({text:(el.textContent||'').trim(),w:el.getBoundingClientRect().width,f:getComputedStyle(el).fontFamily}))
                    }));
                    if(data.sw>data.iw+1) throw new Error(`${name} ${pathname} ${width}: overflow ${data.sw}>${data.iw}`);
                    if(!data.supabase) throw new Error(`${name} ${pathname} ${width}: Supabase runtime unavailable`);
                    if(!data.fontReady) throw new Error(`${name} ${pathname} ${width}: Material Symbols font unavailable`);
                    for(const icon of data.icons){
                      if(!/Material Symbols Outlined/i.test(icon.f)) throw new Error(`${name} ${pathname} ${width}: icon ${icon.text} wrong font ${icon.f}`);
                      if(icon.text && icon.w>40) throw new Error(`${name} ${pathname} ${width}: icon ${icon.text} likely unligated width=${icon.w}`);
                    }
                    if(pageErrors.length) throw new Error(`${name} ${pathname} ${width}: ${pageErrors.join(' | ')}`);
                    const material=consoleErrors.filter(x=>!/favicon|Failed to load resource.*404/i.test(x));
                    if(material.length) throw new Error(`${name} ${pathname} ${width}: ${material.join(' | ')}`);
                    checks++; await context.close();
                  }
                }
              } finally { await browser.close(); }
            }
            console.log(`LIVE_SYMBOL_SUBSET_BROWSER_MATRIX_PASS=${checks}/24`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Re-measure Lighthouse mobile and font transfer
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)
          test -n "$CHROME_PATH"
          export CHROME_PATH
          npx --yes lighthouse@12 "$FRONTEND/" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=live-symbol-probe/lighthouse-home.json
          npx --yes lighthouse@12 "$FRONTEND/app" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --only-categories=performance,accessibility,best-practices --output=json --output-path=live-symbol-probe/lighthouse-app.json
          node <<'NODE'
          const fs=require('fs');
          const baselines={HOME:{performance:57,FCP_ms:8321,LCP_ms:10721},APP:{performance:57,FCP_ms:8312,LCP_ms:10862}};
          function read(file,label){
            const r=JSON.parse(fs.readFileSync(file,'utf8')),c=r.categories,a=r.audits;
            const out={performance:Math.round((c.performance?.score??0)*100),accessibility:Math.round((c.accessibility?.score??0)*100),bestPractices:Math.round((c['best-practices']?.score??0)*100),seo:c.seo?Math.round(c.seo.score*100):null,FCP_ms:Math.round(a['first-contentful-paint']?.numericValue??0),LCP_ms:Math.round(a['largest-contentful-paint']?.numericValue??0),TBT_ms:Math.round(a['total-blocking-time']?.numericValue??0),CLS:Number((a['cumulative-layout-shift']?.numericValue??0).toFixed(3)),SpeedIndex_ms:Math.round(a['speed-index']?.numericValue??0)};
            const b=baselines[label];
            const delta={performance_points:out.performance-b.performance,FCP_ms:out.FCP_ms-b.FCP_ms,LCP_ms:out.LCP_ms-b.LCP_ms};
            const network=a['network-requests']?.details?.items||[];
            const google=network.filter(x=>/fonts\.(googleapis|gstatic)\.com/.test(x.url||'')).map(x=>({url:x.url,transferSize:Math.round(x.transferSize||0),resourceSize:Math.round(x.resourceSize||0)})).sort((x,y)=>y.transferSize-x.transferSize);
            console.log(`${label}_POST_SUBSET=${JSON.stringify(out)} BASELINE=${JSON.stringify(b)} DELTA=${JSON.stringify(delta)}`);
            console.log(`${label}_GOOGLE_FONT_TRANSFERS=${JSON.stringify(google.slice(0,12))}`);
            if(out.accessibility<90||out.bestPractices<90||(out.seo!==null&&out.seo<90)) process.exitCode=1;
          }
          read('live-symbol-probe/lighthouse-home.json','HOME');
          read('live-symbol-probe/lighthouse-app.json','APP');
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-symbol-subset-probe-${{ github.sha }}
          path: live-symbol-probe/
          if-no-files-found: warn
          retention-days: 3
