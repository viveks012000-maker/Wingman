name: Maeve Repair Gate
on:
  push:
    branches:
      - fix/maeve-runtime-send
    paths:
      - .github/workflows/maeve_repair_gate.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maeve-runtime-send
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply guarded source repair
        run: python scripts/repair_maeve_runtime.py
      - name: Syntax and complete test gate
        run: |
          node -c server.js
          node -c app.js
          node tests/maeve_runtime_repair.test.js
          node tests/feature_access_preflight.test.js
          node tests/run_all_tests.js
          npm audit --omit=dev --audit-level=high
      - name: Commit verified changes only
        shell: bash
        run: |
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add server.js app.js tests/maeve_runtime_repair.test.js tests/feature_access_preflight.test.js tests/run_all_tests.js
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          expected=$'app.js\nserver.js\ntests/feature_access_preflight.test.js\ntests/maeve_runtime_repair.test.js\ntests/run_all_tests.js'
          test "$changed" = "$expected"
          git commit -m 'fix: restore Maeve runtime and clickable feature preflights'
          git push origin HEAD:fix/maeve-runtime-send
