name: Maeve runtime and feature preflight repair
on:
  push:
    branches: [fix/maeve-runtime-send]
    paths:
      - '.github/workflows/maeve_runtime_repair_v2.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maeve-runtime-send
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply guarded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server.js').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          runner = Path('tests/run_all_tests.js').read_text(encoding='utf-8')

          # ---------------- MAEVE PROVIDER ----------------
          marker = '// Helper function to query OpenRouter dynamically with automatic key failover\n'
          if marker not in server:
              raise SystemExit('provider insertion marker missing')
          helper = r'''// Strict Maeve provider path: exact AICredits endpoint/model with bounded transient retry.
// Maeve intentionally shares the proven main text key/model path with the working text-generation stack.
function getMaeveProviderFailureCode(error) {
    const status = Number(error && error.statusCode);
    if (error && error.isTimeout) return 'AI_PROVIDER_TIMEOUT';
    if (status === 401 || status === 403) return 'AI_PROVIDER_AUTH';
    if (status === 402) return 'AI_PROVIDER_BUDGET';
    if (status === 429) return 'AI_PROVIDER_RATE_LIMIT';
    if ([500, 502, 503, 504].includes(status)) return 'AI_PROVIDER_UPSTREAM';
    if (error && error.code === 'AI_PROVIDER_EMPTY_RESPONSE') return 'AI_PROVIDER_EMPTY_RESPONSE';
    if (error && error.code === 'AI_PROVIDER_CONFIG') return 'AI_PROVIDER_CONFIG';
    return 'AI_PROVIDER_FAILURE';
}

async function queryMaeveProvider(messagesArray, temperature = 0.7, maxTokens = 120, timeoutMs = 25000) {
    const keysToTry = [...new Set([
        process.env.AICREDITS_API_KEY_GENERAL,
        process.env.AICREDITS_API_KEY
    ].filter(Boolean))];
    const model = 'qwen/qwen3-235b-a22b-2507';
    const baseUrl = 'https://api.aicredits.in/v1';
    if (keysToTry.length === 0) {
        const err = new Error('Maeve provider key is not configured.');
        err.code = 'AI_PROVIDER_CONFIG';
        throw err;
    }

    const retryable = new Set([429, 500, 502, 503, 504]);
    let lastError = null;
    for (const apiKey of keysToTry) {
        for (let attempt = 1; attempt <= 3; attempt++) {
            const controller = new AbortController();
            const timer = timeoutMs ? setTimeout(() => controller.abort(), timeoutMs) : null;
            try {
                const response = await fetch(baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': 'https://mywingman.com',
                        'X-Title': 'My Wingman App'
                    },
                    body: JSON.stringify({ model, messages: messagesArray, temperature, max_tokens: maxTokens }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const err = new Error(`Maeve provider request failed with HTTP ${response.status}.`);
                    err.statusCode = response.status;
                    lastError = err;
                    if (retryable.has(response.status) && attempt < 3) {
                        await new Promise(resolve => setTimeout(resolve, 300 * attempt));
                        continue;
                    }
                    break;
                }

                const data = await response.json();
                if (data && data.error) {
                    const err = new Error('Maeve provider returned an API error.');
                    err.statusCode = Number(data.error.status || data.error.code) || 502;
                    lastError = err;
                    if (retryable.has(err.statusCode) && attempt < 3) {
                        await new Promise(resolve => setTimeout(resolve, 300 * attempt));
                        continue;
                    }
                    break;
                }

                const msg = data && Array.isArray(data.choices) && data.choices[0] ? data.choices[0].message : null;
                const output = typeof msg === 'string' ? msg : (msg ? (msg.content || msg.reasoning || '') : '');
                if (!output || !String(output).trim()) {
                    const err = new Error('Maeve provider returned empty output.');
                    err.code = 'AI_PROVIDER_EMPTY_RESPONSE';
                    err.statusCode = 502;
                    lastError = err;
                    if (attempt < 2) {
                        await new Promise(resolve => setTimeout(resolve, 250));
                        continue;
                    }
                    break;
                }
                return String(output).trim();
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    const timeoutErr = new Error('Maeve provider timed out.');
                    timeoutErr.isTimeout = true;
                    timeoutErr.statusCode = 504;
                    lastError = timeoutErr;
                    if (attempt < 3) {
                        await new Promise(resolve => setTimeout(resolve, 300 * attempt));
                        continue;
                    }
                    break;
                }
                lastError = err;
                if (attempt < 3 && (!err || !err.statusCode || retryable.has(Number(err.statusCode)))) {
                    await new Promise(resolve => setTimeout(resolve, 300 * attempt));
                    continue;
                }
                break;
            } finally {
                if (timer) clearTimeout(timer);
            }
        }
    }
    throw lastError || new Error('Maeve provider is unavailable.');
}

'''
          if 'async function queryMaeveProvider(' not in server:
              server = server.replace(marker, helper + marker, 1)

          old_route = "app.post(['/api/chat', '/api/simulator/chat'], requireSupabaseAuth, requireActiveConsent, apiLimiter, async (req, res) => {\n    const reqId = req.headers['x-idempotency-key']"
          new_route = "app.post(['/api/chat', '/api/simulator/chat'], requireSupabaseAuth, requireActiveConsent, apiLimiter, async (req, res) => {\n    const uid = getUserIdFromReq(req);\n    if (!acquireUserConcurrencyLock(uid)) {\n        return res.status(429).json({ success: false, error: \"A generation is already in progress for your account. Please wait for it to complete.\" });\n    }\n    const reqId = req.headers['x-idempotency-key']"
          if old_route not in server:
              raise SystemExit('chat route marker missing')
          server = server.replace(old_route, new_route, 1)

          for old, new, name in [
              ('let hotlineAdvice = await queryOpenRouter("qwen3-235b-a22b-2507", hotlinePayload, 0.7, 1500);', 'let hotlineAdvice = await queryMaeveProvider(hotlinePayload, 0.7, 1500);', 'hotline'),
              ('let replyText = await queryOpenRouter("qwen3-235b-a22b-2507", openRouterMessages, 0.6, 120);', 'let replyText = await queryMaeveProvider(openRouterMessages, 0.6, 120);', 'roleplay')
          ]:
              if old not in server:
                  raise SystemExit(f'{name} provider call missing')
              server = server.replace(old, new, 1)

          old_generic = '''        res.status(500).json({
            success: false,
            error: "Maeve AI Coach failed to respond. Your credits were restored.",
            credits: currentBal
        });'''
          new_generic = '''        const providerCode = getMaeveProviderFailureCode(error);
        res.status(500).json({
            success: false,
            error: "Maeve AI Coach failed to respond. Your credits were restored.",
            code: providerCode,
            credits: currentBal
        });'''
          if old_generic not in server:
              raise SystemExit('Maeve error response missing')
          server = server.replace(old_generic, new_generic, 1)

          old_exports = 'module.exports = { app, startWingmanServer, supabaseAdmin };'
          new_exports = 'module.exports = { app, startWingmanServer, supabaseAdmin, queryMaeveProvider, getMaeveProviderFailureCode };'
          if old_exports not in server:
              raise SystemExit('exports marker missing')
          server = server.replace(old_exports, new_exports, 1)

          # ---------------- FEATURE ACCESS / PREPARATION UX ----------------
          old_terms_head = '''    window.updateTermsLockState = function () {
        try {
            const isLocked = !state.isTermsAccepted;'''
          new_terms_head = '''    window.updateTermsLockState = function () {
        try {
            const isLocked = !state.isTermsAccepted;
            const isBusy = !!state.isLoading;'''
          if old_terms_head not in app:
              raise SystemExit('terms lock head missing')
          app = app.replace(old_terms_head, new_terms_head, 1)

          old_terms_controls = '''            if (dz) {
                dz.classList.toggle("opacity-40", isLocked);
                dz.classList.toggle("cursor-not-allowed", isLocked);
            }
            if (si) si.disabled = isLocked;'''
          new_terms_controls = '''            // Preparing local input is allowed before auth/consent. Security is enforced only when submitting.
            if (dz) {
                dz.classList.remove("opacity-40", "cursor-not-allowed");
                dz.classList.toggle("pointer-events-none", isBusy);
                dz.classList.toggle("opacity-60", isBusy);
            }
            if (si) si.disabled = isBusy;'''
          if old_terms_controls not in app:
              raise SystemExit('terms control block missing')
          app = app.replace(old_terms_controls, new_terms_controls, 1)

          # Analyzer lifecycle must not re-disable local upload simply because consent is absent.
          app = app.replace('if (si && state.isTermsAccepted) si.disabled = false;', 'if (si && !state.isLoading) si.disabled = false;')

          old_btn2 = 'const isBtn2Disabled = isLocked || !isBioValid || isLoading || isCreditsBlocked10;'
          old_btn3 = 'const isBtn3Disabled = isLocked || !isAuditValid || isLoading || isCreditsBlocked10;'
          old_btn1 = 'const enabled = hasScreenshot && withinLimit && notLoading && !isCreditsBlocked10;'
          for old in [old_btn2, old_btn3, old_btn1]:
              if old not in app:
                  raise SystemExit('feature button gate missing: ' + old)
          app = app.replace(old_btn2, 'const isBtn2Disabled = !isBioValid || isLoading;', 1)
          app = app.replace('btn2.classList.toggle("opacity-40", isLocked || !isBioValid || isCreditsBlocked10);', 'btn2.classList.toggle("opacity-40", !isBioValid);', 1)
          app = app.replace(old_btn3, 'const isBtn3Disabled = !isAuditValid || isLoading;', 1)
          app = app.replace('btn3.classList.toggle("opacity-40", isLocked || !isAuditValid || isCreditsBlocked10);', 'btn3.classList.toggle("opacity-40", !isAuditValid);', 1)
          app = app.replace(old_btn1, 'const enabled = hasScreenshot && withinLimit && notLoading;', 1)
          app = app.replace('btn1.classList.toggle("opacity-40", !hasScreenshot || !withinLimit || isCreditsBlocked10);', 'btn1.classList.toggle("opacity-40", !hasScreenshot || !withinLimit);', 1)

          # Send button: input remains usable before login; valid text gets a strong active visual state.
          old_send = '''            const chatSendBtn = $("chatbox-send-btn");
            if (chatSendBtn) {
                const isChatDisabled = isLoading || !(ci && ci.value.trim().length > 0);
                chatSendBtn.disabled = isChatDisabled;
                chatSendBtn.classList.toggle("opacity-40", isChatDisabled);
                chatSendBtn.classList.toggle("cursor-not-allowed", isChatDisabled);
                chatSendBtn.classList.toggle("cursor-pointer", !isChatDisabled);
            }'''
          new_send = '''            const chatSendBtn = $("chatbox-send-btn");
            if (chatSendBtn) {
                const hasChatText = Boolean(ci && ci.value.trim().length > 0);
                const isChatDisabled = isLoading || !hasChatText;
                chatSendBtn.disabled = isChatDisabled;
                chatSendBtn.setAttribute("aria-disabled", isChatDisabled ? "true" : "false");
                chatSendBtn.classList.toggle("opacity-40", isChatDisabled);
                chatSendBtn.classList.toggle("cursor-not-allowed", isChatDisabled);
                chatSendBtn.classList.toggle("cursor-pointer", !isChatDisabled);
                chatSendBtn.classList.toggle("chat-send-active", !isChatDisabled);
                chatSendBtn.style.setProperty("opacity", isChatDisabled ? "0.4" : "1", "important");
                chatSendBtn.style.setProperty("filter", isChatDisabled ? "saturate(0.65)" : "saturate(1.15)", "important");
                chatSendBtn.style.setProperty("transform", isChatDisabled ? "none" : "translateY(-1px)", "important");
                chatSendBtn.style.setProperty("box-shadow", isChatDisabled ? "none" : "0 8px 24px rgba(168, 85, 247, 0.58)", "important");
            }'''
          if old_send not in app:
              raise SystemExit('send state block missing')
          app = app.replace(old_send, new_send, 1)

          # Local sample content is preparation only and must not require consent.
          old_sample_guard = '''    window.loadPresetBio = function(btn) {
        if (!state.isTermsAccepted) {
            window.highlightTermsCheckbox();
            window.showToast("Please agree to the Terms of Service & Privacy Protocol box first!", "warning");
            return;
        }
        const bi = $("bioInput");'''
          new_sample_guard = '''    window.loadPresetBio = function(btn) {
        const bi = $("bioInput");'''
          if old_sample_guard not in app:
              raise SystemExit('sample guard missing')
          app = app.replace(old_sample_guard, new_sample_guard, 1)

          # Helper block reused by the three generation controllers after auth/credit preflight.
          consent_block = '''        if (!state.isTermsAccepted) {
            window.highlightTermsCheckbox();
            window.showToast("Please agree to the Terms of Service & Privacy Protocol box first!", "warning");
            return;
        }

'''
          consent_after_credit = '''        if (!state.isTermsAccepted) {
            window.highlightTermsCheckbox();
            if (typeof window.openInterstitialModal === 'function') window.openInterstitialModal();
            window.showToast("18+ verification and consent are required before AI processing.", "warning");
            return;
        }

'''

          # Analyzer: content -> auth/credits -> consent -> AI.
          analyzer_old = '''        if (state.isLoading) return;
        if (!state.isTermsAccepted) {
            window.highlightTermsCheckbox();
            window.showToast("Please agree to the Terms of Service & Privacy Protocol box first!", "warning");
            return;
        }

        const useCache = (state.activeTranscriptCache && state.uploadedFiles.length === 0);'''
          analyzer_new = '''        if (state.isLoading) return;

        const useCache = (state.activeTranscriptCache && state.uploadedFiles.length === 0);'''
          if analyzer_old not in app:
              raise SystemExit('analyzer preflight block missing')
          app = app.replace(analyzer_old, analyzer_new, 1)
          analyzer_credit = '        if (!(await hasSufficientCredits(10))) return;\n\n        state.isLoading = true;\n        setButtonLoadingState("runAnalysisBtn", true, "Analyzing Context...", "Generate Perfect Replies");'
          analyzer_credit_new = '        if (!(await hasSufficientCredits(10))) return;\n\n' + consent_after_credit + '        state.isLoading = true;\n        setButtonLoadingState("runAnalysisBtn", true, "Analyzing Context...", "Generate Perfect Replies");'
          if analyzer_credit not in app:
              raise SystemExit('analyzer credit insertion point missing')
          app = app.replace(analyzer_credit, analyzer_credit_new, 1)

          # Icebreaker and Bio: remove early consent, insert after authoritative auth/credit preflight.
          for label, loading_line in [
              ('generateIcebreakerBtn', '        state.isLoading = true;\n        setButtonLoadingState("generateIcebreakerBtn", true, "Crafting Openers...", "Generate Icebreaker");'),
              ('runAuditBtn', '        state.isLoading = true;\n        setButtonLoadingState("runAuditBtn", true, "Optimizing Bio...", "Optimize My Bio");')
          ]:
              idx = app.find(consent_block, app.find('window.generateIcebreaker') if label == 'generateIcebreakerBtn' else app.find('window.runAudit'))
              if idx == -1:
                  raise SystemExit(label + ' early consent block missing')
              app = app[:idx] + app[idx+len(consent_block):]
              target = '        if (!(await hasSufficientCredits(10))) return;\n\n' + loading_line
              replacement = '        if (!(await hasSufficientCredits(10))) return;\n\n' + consent_after_credit + loading_line
              section_start = app.find('window.generateIcebreaker') if label == 'generateIcebreakerBtn' else app.find('window.runAudit')
              pos = app.find(target, section_start)
              if pos == -1:
                  raise SystemExit(label + ' credit insertion point missing')
              app = app[:pos] + replacement + app[pos+len(target):]

          # Chat follows the same order and does not append the user's message before consent is satisfied.
          chat_credit = '        if (!(await hasSufficientCredits(2))) return;\n\n        const sendBtn = $("chatbox-send-btn");'
          chat_credit_new = '        if (!(await hasSufficientCredits(2))) return;\n\n' + consent_after_credit + '        const sendBtn = $("chatbox-send-btn");'
          if chat_credit not in app:
              raise SystemExit('chat consent insertion point missing')
          app = app.replace(chat_credit, chat_credit_new, 1)

          Path('server.js').write_text(server, encoding='utf-8')
          Path('app.js').write_text(app, encoding='utf-8')

          # Register two dedicated regression suites in the canonical runner.
          needle = "    { name: '33. Netlify Release Manifest Source-Commit Truth Guard', file: 'release_manifest_source.test.js' }\n];"
          repl = "    { name: '33. Netlify Release Manifest Source-Commit Truth Guard', file: 'release_manifest_source.test.js' },\n    { name: '34. Maeve Provider Runtime & Retry Guard', file: 'maeve_runtime_repair.test.js' },\n    { name: '35. Feature Access Preflight UX Guard', file: 'feature_access_preflight.test.js' }\n];"
          if needle not in runner:
              raise SystemExit('test runner insertion marker missing')
          Path('tests/run_all_tests.js').write_text(runner.replace(needle, repl, 1), encoding='utf-8')
          PY

      - name: Add targeted regression tests
        shell: bash
        run: |
          cat > tests/maeve_runtime_repair.test.js <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          process.env.NODE_ENV = 'test';
          process.env.AICREDITS_API_KEY = 'unit-test-main-key';
          delete process.env.AICREDITS_API_KEY_GENERAL;

          const serverSource = fs.readFileSync('server.js', 'utf8');
          const appSource = fs.readFileSync('app.js', 'utf8');
          assert(serverSource.includes("const uid = getUserIdFromReq(req);\n    if (!acquireUserConcurrencyLock(uid))"));
          assert(serverSource.includes('queryMaeveProvider(hotlinePayload, 0.7, 1500)'));
          assert(serverSource.includes('queryMaeveProvider(openRouterMessages, 0.6, 120)'));
          assert(serverSource.includes("const model = 'qwen/qwen3-235b-a22b-2507';"));
          assert(serverSource.includes("const baseUrl = 'https://api.aicredits.in/v1';"));
          assert(serverSource.includes('code: providerCode'));
          assert(appSource.includes('chatSendBtn.classList.toggle("chat-send-active", !isChatDisabled)'));

          const originalFetch = global.fetch;
          const { queryMaeveProvider, getMaeveProviderFailureCode } = require('../server');
          (async()=>{
            let calls=0;
            global.fetch=async(url,options)=>{
              calls++;
              assert.strictEqual(url,'https://api.aicredits.in/v1/chat/completions');
              const payload=JSON.parse(options.body);
              assert.strictEqual(payload.model,'qwen/qwen3-235b-a22b-2507');
              assert.strictEqual(options.headers.Authorization,'Bearer unit-test-main-key');
              if(calls===1) return new Response('temporary',{status:503});
              return new Response(JSON.stringify({choices:[{message:{content:'working reply'}}]}),{status:200,headers:{'content-type':'application/json'}});
            };
            const result=await queryMaeveProvider([{role:'user',content:'hi'}],0.6,120,2000);
            assert.strictEqual(result,'working reply');
            assert.strictEqual(calls,2);
            assert.strictEqual(getMaeveProviderFailureCode({statusCode:402}),'AI_PROVIDER_BUDGET');
            assert.strictEqual(getMaeveProviderFailureCode({statusCode:429}),'AI_PROVIDER_RATE_LIMIT');
            assert.strictEqual(getMaeveProviderFailureCode({isTimeout:true}),'AI_PROVIDER_TIMEOUT');
            console.log('Maeve runtime repair guard passed.');
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>{global.fetch=originalFetch});
          NODE

          cat > tests/feature_access_preflight.test.js <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const src = fs.readFileSync('app.js','utf8');

          assert(src.includes('const isBtn2Disabled = !isBioValid || isLoading;'), 'Icebreaker must remain clickable when valid regardless of auth/credit cache');
          assert(src.includes('const isBtn3Disabled = !isAuditValid || isLoading;'), 'Bio Optimizer must remain clickable when valid regardless of auth/credit cache');
          assert(src.includes('const enabled = hasScreenshot && withinLimit && notLoading;'), 'Analyzer submit must be content-driven, not auth/credit-cache-disabled');
          assert(!src.includes('if (si) si.disabled = isLocked;'), 'Screenshot preparation must not be blocked by missing consent');
          assert(src.includes('if (si) si.disabled = isBusy;'), 'Screenshot input may only be blocked while busy');
          assert(src.includes('chatSendBtn.style.setProperty("opacity", isChatDisabled ? "0.4" : "1", "important")'), 'Chat send must visibly activate with text');

          const authIndex = src.indexOf('window.showToast("Authentication required to use AI features. Please sign in."');
          const authModalIndex = src.indexOf('window.openAuthRequiredModal()', authIndex);
          assert(authIndex >= 0 && authModalIndex > authIndex, 'Logged-out preflight must show sign-in UI');
          const insufficientIndex = src.indexOf('window.showToast("Insufficient credits. Current balance: "');
          const purchaseIndex = src.indexOf('window.openPurchaseModal()', insufficientIndex);
          assert(insufficientIndex >= 0 && purchaseIndex > insufficientIndex, 'Insufficient-credit preflight must show exact balance and purchase UI');

          for (const fn of ['window.runAnalysis = async function', 'window.generateIcebreaker = async function', 'window.runAudit = async function', 'window.submitChatboxMessage = async function']) {
            const start = src.indexOf(fn);
            assert(start >= 0, fn + ' missing');
            const next = src.indexOf('\n    window.', start + fn.length);
            const section = src.slice(start, next > start ? next : start + 14000);
            const credit = section.indexOf('await hasSufficientCredits(');
            const consent = section.indexOf('18+ verification and consent are required before AI processing.');
            assert(credit >= 0, fn + ' must call auth/credit preflight');
            assert(consent > credit, fn + ' must report auth/credit blocker before consent blocker');
          }
          console.log('Feature access preflight UX guard passed.');
          NODE

      - name: Syntax and full regression gate
        shell: bash
        run: |
          node -c server.js
          node -c app.js
          node tests/maeve_runtime_repair.test.js
          node tests/feature_access_preflight.test.js
          node tests/run_all_tests.js
          npm audit --omit=dev --audit-level=high

      - name: Commit only verified product/test changes
        shell: bash
        run: |
          git config user.name 'viveks012000-maker'
          git config user.email 'viveks012000@gmail.com'
          git add server.js app.js tests/maeve_runtime_repair.test.js tests/feature_access_preflight.test.js tests/run_all_tests.js
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          expected=$'app.js\nserver.js\ntests/feature_access_preflight.test.js\ntests/maeve_runtime_repair.test.js\ntests/run_all_tests.js'
          test "$changed" = "$expected"
          git commit -m 'fix: restore Maeve runtime and clickable feature preflights'
          git push origin HEAD:fix/maeve-runtime-send
