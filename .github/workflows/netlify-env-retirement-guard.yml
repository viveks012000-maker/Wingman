name: Netlify environment retirement guard

on:
  push:
    branches:
      - fix/remove-netlify-env-20260817
    paths:
      - .github/workflows/netlify-env-retirement-guard.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-netlify-env-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Targeted origin guards
        run: |
          node tests/cors_production_policy.test.js
          node tests/runtime_startup_csp_hardening.test.js
      - name: Complete regression suite
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Frontend artifact
        run: npm run build:netlify
      - name: Artifact safety
        run: |
          test -f netlify-dist/release.json
          test -f netlify-dist/404.html
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -e netlify-dist/database.js
          test ! -d netlify-dist/tests
          echo "ARTIFACT_FILE_COUNT=$(find netlify-dist -type f | wc -l)"
      - name: Record pass
        shell: bash
        run: |
          mkdir -p .audit
          cat > .audit/netlify-env-retirement-pass.txt <<'EOF'
          NETLIFY_ENV_RETIREMENT=PASS
          TARGETED_CORS=PASS
          TARGETED_ENV=PASS
          FULL_REGRESSION=PASS
          DEPENDENCY_AUDIT=PASS
          FRONTEND_ARTIFACT=PASS
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit/netlify-env-retirement-pass.txt
          git commit -m "audit: record Netlify environment retirement pass"
          git push origin HEAD:fix/remove-netlify-env-20260817
