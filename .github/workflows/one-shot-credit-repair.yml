name: One-shot verified credit-state repair

on:
  push:
    branches:
      - repair/production-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/production-readiness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact guarded fixes
        run: python .github/credit_repair.py

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for real browser QA
        run: npx playwright install --with-deps chromium

      - name: Syntax checks
        run: |
          node -c server.js
          node -c app.js
          node -c tests/credit_purchase_modal_regression.test.js

      - name: Run complete test suite
        run: npm test

      - name: Commit only after all checks pass
        run: |
          rm -f .github/workflows/one-shot-credit-repair.yml .github/credit_repair.py
          git config user.name "OpenAI Release Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(credits): require authoritative balance before purchase UI"
          git push origin HEAD:repair/production-readiness
