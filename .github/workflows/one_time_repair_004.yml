name: One-time guarded server repair 004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_repair_004.yml'

permissions:
  contents: write

jobs:
  repair-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited surgical repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.js')
          source = path.read_text(encoding='utf-8')
          original = source

          # 1) Preserve reserve_credits semantic categories. Only genuine numeric insufficiency is 402-eligible.
          old = """                if (row.success === false) {
                    const currentBal = typeof row.new_balance === 'number' ? row.new_balance : (typeof row.currentCredits === 'number' ? row.currentCredits : 0);
                    return {
                        success: false,
                        currentCredits: currentBal,
                        insufficient: true,
                        error: row.error_message || 'Insufficient credit balance.'
                    };
                }
"""
          new = """                if (row.success === false) {
                    const currentBal = typeof row.new_balance === 'number' ? row.new_balance : (typeof row.currentCredits === 'number' ? row.currentCredits : 0);
                    const rowErrorCode = typeof row.error === 'string' ? row.error.trim() : '';
                    const rowErrorMessage = typeof row.error_message === 'string' ? row.error_message.trim() : '';

                    if (rowErrorCode === 'PROFILE_MISSING' || rowErrorMessage === 'PROFILE_MISSING') {
                        return {
                            success: false,
                            currentCredits: currentBal,
                            profileMissing: true,
                            code: 'PROFILE_MISSING',
                            error: 'PROFILE_MISSING'
                        };
                    }

                    if (rowErrorCode === 'INSUFFICIENT_CREDITS' || rowErrorMessage === 'Insufficient credit balance.') {
                        return {
                            success: false,
                            currentCredits: currentBal,
                            insufficient: true,
                            error: 'Insufficient credit balance.'
                        };
                    }

                    return {
                        success: false,
                        currentCredits: currentBal,
                        serviceUnavailable: true,
                        error: rowErrorMessage || 'Credit service rejected the reservation. Balance unchanged. Please try again.'
                    };
                }
"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy reserve failure block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          # 2) Disable/remove the direct database minting fallback. add_credits RPC is the only mint path.
          start_marker = "    // Priority 2: Direct Supabase Postgres Fallback Pipeline\n"
          end_marker = "    return newCredits / CREDITS_PER_INR;\n}"
          if source.count(start_marker) != 1:
              raise SystemExit(f'Expected one direct top-up fallback start, found {source.count(start_marker)}')
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          source = source[:start] + """    // Fail closed: privileged credit minting may only succeed through the add_credits RPC.
    const mintErr = new Error('Credit minting service unavailable. No credits were added.');
    mintErr.statusCode = 503;
    throw mintErr;
}""" + source[end:]

          # 3) Add a strict Screenshot Analyzer provider path: canonical URL, exact model IDs, exact intended keys, no fallback.
          insert_marker = "// Helper function to query OpenRouter dynamically with automatic key failover\n"
          if source.count(insert_marker) != 1:
              raise SystemExit(f'Expected one generic AI helper marker, found {source.count(insert_marker)}')
          strict_helper = r'''// Strict Screenshot Analyzer provider call: exact AICREDITS endpoint/model/key, no model or key fallback.
async function queryAnalyzerProvider(stage, messagesArray, temperature = 0.7, maxTokens = null, timeoutMs = 25000, topP = null) {
    const isVisionStage = stage === 'vision';
    const isMainStage = stage === 'main';
    if (!isVisionStage && !isMainStage) {
        throw new Error(`Invalid Screenshot Analyzer stage: ${stage}`);
    }

    const apiKey = isVisionStage ? process.env.AICREDITS_API_KEY_VISION : process.env.AICREDITS_API_KEY;
    const model = isVisionStage ? 'qwen/qwen3.5-flash-02-23' : 'qwen/qwen3-235b-a22b-2507';
    const baseUrl = 'https://api.aicredits.in/v1';

    if (!apiKey) {
        throw new Error(`Missing required Screenshot Analyzer API key for ${stage} stage.`);
    }

    const payload = {
        model,
        messages: messagesArray,
        temperature
    };
    if (maxTokens) payload.max_tokens = maxTokens;
    if (topP !== null && topP !== undefined) payload.top_p = topP;

    const controller = timeoutMs ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;

    try {
        const response = await fetch(baseUrl + '/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
                'HTTP-Referer': 'http://localhost:3000',
                'X-Title': 'My Wingman App'
            },
            body: JSON.stringify(payload),
            ...(controller ? { signal: controller.signal } : {})
        });

        if (!response.ok) {
            const errText = await response.text();
            const err = new Error(`Screenshot Analyzer AI API Failure [${model}]: ${response.status} - ${errText}`);
            err.statusCode = response.status;
            throw err;
        }

        const data = await response.json();
        if (data.error) {
            throw new Error(`Screenshot Analyzer AI API Error: ${data.error.message || JSON.stringify(data.error)}`);
        }
        if (!data.choices || data.choices.length === 0) {
            throw new Error(`Screenshot Analyzer AI API returned no choices for ${model}.`);
        }

        const msg = data.choices[0].message;
        const outputContent = typeof msg === 'string' ? msg : (msg ? (msg.content || msg.reasoning || '') : '');
        if (!outputContent) {
            throw new Error(`Screenshot Analyzer AI API returned empty content for ${model}.`);
        }
        return outputContent;
    } catch (err) {
        if (err.name === 'AbortError') {
            const timeoutErr = new Error('Analysis timed out. Please try again.');
            timeoutErr.isTimeout = true;
            throw timeoutErr;
        }
        throw err;
    } finally {
        if (timer) clearTimeout(timer);
    }
}

'''
          source = source.replace(insert_marker, strict_helper + insert_marker, 1)

          stage1_old = 'queryOpenRouter("qwen3.5-flash-02-23", visionMessages, 0.2, 800, 25000)'
          stage1_new = "queryAnalyzerProvider('vision', visionMessages, 0.2, 800, 25000)"
          if source.count(stage1_old) != 1:
              raise SystemExit(f'Expected one Analyzer vision call, found {source.count(stage1_old)}')
          source = source.replace(stage1_old, stage1_new, 1)

          stage2_old = 'queryOpenRouter("qwen3-235b-a22b-2507", generationMessages, 0.20, 800, 25000)'
          stage2_new = "queryAnalyzerProvider('main', generationMessages, 0.20, 800, 25000)"
          if source.count(stage2_old) != 1:
              raise SystemExit(f'Expected one Analyzer main call, found {source.count(stage2_old)}')
          source = source.replace(stage2_old, stage2_new, 1)

          # 4) Preserve PROFILE_MISSING and service-unavailable semantics at every feature route.
          feature_markers = [
              ("deduction = await verifyAndDeductCreditsDB(req, 10, 'analyze', reqId);\n        if (!deduction.success) {\n", False),
              ("deduction = await verifyAndDeductCreditsDB(req, 10, 'icebreaker', reqId);\n        if (!deduction.success) {\n", True),
              ("deduction = await verifyAndDeductCreditsDB(req, 10, 'optimize', reqId);\n        if (!deduction.success) {\n", True),
              ("deduction = await verifyAndDeductCreditsDB(req, 2, 'chat', reqId);\n        if (!deduction.success) {\n", True),
              ("deduction = await verifyAndDeductCreditsDB(req, 2, 'simulator_review', reqId);\n        if (!deduction.success) {\n", True),
          ]

          profile_block = """            if (deduction.profileMissing) {
                return res.status(404).json({ success: false, error: \"PROFILE_MISSING\", code: \"PROFILE_MISSING\" });
            }
"""
          service_block = """            if (deduction.serviceUnavailable) {
                return res.status(503).json({
                    success: false,
                    error: deduction.error || \"Credit service temporarily unavailable. Please try again.\"
                });
            }
"""
          for marker, needs_service in feature_markers:
              if source.count(marker) != 1:
                  raise SystemExit(f'Expected one feature deduction marker, found {source.count(marker)} for {marker!r}')
              addition = profile_block + (service_block if needs_service else '')
              source = source.replace(marker, marker + addition, 1)

          # Guardrails: do not allow the dangerous minting fallback or Analyzer generic routing to survive.
          forbidden = [
              "// Priority 2: Direct Supabase Postgres Fallback Pipeline",
              ".upsert({ id: uid, credits: newCredits, tier: tierName || 'starter' })",
              'queryOpenRouter("qwen3.5-flash-02-23", visionMessages',
              'queryOpenRouter("qwen3-235b-a22b-2507", generationMessages'
          ]
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f'Forbidden legacy path remains after repair: {needle}')

          if source == original:
              raise SystemExit('Repair produced no changes')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify syntax and diff hygiene
        shell: bash
        run: |
          node --check server.js
          git diff --check
          git diff -- server.js

      - name: Commit guarded repair
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo 'No server.js changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'fix(credits): preserve failure semantics and tighten analyzer routing'
          git push origin HEAD:main
