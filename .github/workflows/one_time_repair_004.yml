name: One-time post-repair verification 004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_repair_004.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: node --check server.js

      - name: Run complete repository test suite
        run: npm test
