name: Paid plan badge audit
on:
  push:
    branches: [fix/paid-plan-badge]
    paths:
      - 'config.js'
      - '.github/workflows/paid_plan_badge_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node -c config.js
          node -c app.js
          node -c server.js
      - name: Plan classification static assertions
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('config.js','utf8');
          const required=[
            "INITIAL_FREE_CREDITS = 50",
            "currentCredits > INITIAL_FREE_CREDITS",
            ".eq('type', 'purchase')",
            ".eq('status', 'completed')",
            "currentCredits + consumedCredits",
            "setPlanBadge('Paid Plan')",
            "setPlanBadge('Free Plan')"
          ];
          for (const needle of required) {
            if (!s.includes(needle)) throw new Error('Missing plan invariant: '+needle);
          }
          console.log('Plan badge invariants present.');
          NODE
      - name: Full regression suite
        run: npm test
