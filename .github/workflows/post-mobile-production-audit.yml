name: Post-mobile production audit

on:
  push:
    branches:
      - audit/post-mobile-repair-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false axe-core
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Correct audit-only harness scopes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/post-mobile-production-audit.js')
          s=p.read_text()
          old="""      if (id && !(await page.locator(`#${CSS.escape ? '' : ''}`).count().catch(()=>0))) {\n        const exists = await page.evaluate(id => !!document.getElementById(id), id);\n        if (!exists) fail(scope, `broken in-page anchor ${l.href}`);\n      }"""
          new="""      if (id) {\n        const exists = await page.evaluate(id => !!document.getElementById(id), id);\n        if (!exists) fail(scope, `broken in-page anchor ${l.href}`);\n      }"""
          if s.count(old)!=1: raise SystemExit(f'anchor patch count={s.count(old)}')
          s=s.replace(old,new)
          old2="""    const off=controls.filter(x=>x.left<-2||x.right>innerWidth+2); if(off.length) fail(`${scope}:${target}`,'controls extend outside viewport',off.slice(0,10));"""
          new2="""    const viewportWidth=await page.evaluate(()=>window.innerWidth);\n    const off=controls.filter(x=>x.left<-2||x.right>viewportWidth+2); if(off.length) fail(`${scope}:${target}`,'controls extend outside viewport',off.slice(0,10));"""
          if s.count(old2)!=1: raise SystemExit(f'viewport patch count={s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Audit current production
        env:
          SITE: https://soft-sawine-30785c.netlify.app
          EXPECTED_SHA: 2a85dca179d6c8d1f0288b2977de2be93036bb3c
        run: node scripts/post-mobile-production-audit.js
