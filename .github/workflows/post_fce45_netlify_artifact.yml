name: Post-CORS Netlify artifact verification
on:
  push:
    branches:
      - audit/post-fce45-netlify
    paths:
      - .github/workflows/post_fce45_netlify_artifact.yml
permissions:
  contents: read
jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fce45cf9da00a885fa3d89689d0bfc1f8f8fb8df
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fce45cf9da00a885fa3d89689d0bfc1f8f8fb8df'
      - name: Full regression and dependency gate
        run: |
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build frontend-only artifact
        run: npm run build:netlify
      - name: Verify manifest, CSP and no internals
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .sourceCommit netlify-dist/release.json)" = 'fce45cf9da00a885fa3d89689d0bfc1f8f8fb8df'
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/app.html
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/_headers
          grep -q 'https://wingman-production-c6ce.up.railway.app' netlify-dist/config.js
          for f in server.js package.json package-lock.json database.js PROMPT_SYSTEM_MEMORY.json PROJECT_MASTER_SPECIFICATION.md API_DOCUMENTATION.md; do
            test ! -e "netlify-dist/$f"
          done
          for d in middleware migrations tests config utilities scripts .github; do
            test ! -e "netlify-dist/$d"
          done
          ! find netlify-dist -type f | grep -E '\.(sql|sqlite|db|md|ps1|bat|vbs)$'
          echo "PUBLIC_FILE_COUNT=$(find netlify-dist -type f | wc -l)"
      - name: Browser-smoke built artifact logged-out UX
        shell: bash
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('netlify-dist');
          const types={'.html':'text/html','.js':'application/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.svg':'image/svg+xml'};
          const server=http.createServer((req,res)=>{
            let p=(req.url.split('?')[0]||'/');
            if(p==='/') p='/index.html';
            const fp=path.join(root,p.replace(/^\//,''));
            if(!fp.startsWith(root)||!fs.existsSync(fp)||fs.statSync(fp).isDirectory()){res.statusCode=404;return res.end('not found');}
            res.setHeader('Content-Type',types[path.extname(fp)]||'application/octet-stream');
            fs.createReadStream(fp).pipe(res);
          });
          (async()=>{
            await new Promise(r=>server.listen(4177,'127.0.0.1',r));
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            await context.addInitScript(()=>{localStorage.clear();sessionStorage.clear();});
            const page=await context.newPage();
            const pageErrors=[]; const paid=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('request',r=>{/\/api\/(chat|analyze|icebreaker|optimize|simulator\/review)/.test(r.url())&&paid.push(r.url());});
            await page.goto('http://127.0.0.1:4177/app.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const result=await page.evaluate(async()=>{
              const chat=document.getElementById('simulator-chat-input');
              const send=document.getElementById('chatbox-send-btn');
              const ice=document.getElementById('bioInput');
              const iceBtn=document.getElementById('generateIcebreakerBtn');
              const bio=document.getElementById('auditBioInput');
              const bioBtn=document.getElementById('runAuditBtn');
              const screenshot=document.getElementById('screenshotInput');
              window.__authCalls=0; window.__purchaseCalls=0;
              window.openAuthRequiredModal=()=>{window.__authCalls++;};
              window.openPurchaseModal=()=>{window.__purchaseCalls++;};
              const initial={chatDisabled:chat.disabled,screenshotDisabled:screenshot.disabled};
              chat.value='Help me reply to this'; chat.dispatchEvent(new Event('input',{bubbles:true}));
              ice.value='Loves hiking coffee dogs and weekend road trips.'; ice.dispatchEvent(new Event('input',{bubbles:true}));
              bio.value='Curious traveler who loves coffee books and spontaneous adventures.'; bio.dispatchEvent(new Event('input',{bubbles:true}));
              await new Promise(r=>setTimeout(r,100));
              const active={sendDisabled:send.disabled,sendOpacity:getComputedStyle(send).opacity,iceDisabled:iceBtn.disabled,bioDisabled:bioBtn.disabled};
              await window.submitChatboxMessage();
              await window.generateIcebreaker({preventDefault(){}});
              await window.runAudit({preventDefault(){}});
              return {initial,active,authCalls:window.__authCalls,purchaseCalls:window.__purchaseCalls};
            });
            console.log(JSON.stringify({result,pageErrors,paid},null,2));
            if(result.initial.chatDisabled) throw new Error('logged-out Maeve input is disabled in built artifact');
            if(result.initial.screenshotDisabled) throw new Error('logged-out screenshot input is disabled in built artifact');
            if(result.active.sendDisabled||result.active.iceDisabled||result.active.bioDisabled) throw new Error('valid logged-out action remains disabled');
            if(Number(result.active.sendOpacity)<0.95) throw new Error('active Send button is visually faded');
            if(result.authCalls<3) throw new Error('logged-out actions do not route to auth modal');
            if(result.purchaseCalls!==0) throw new Error('logged-out actions incorrectly open purchase modal');
            if(paid.length!==0) throw new Error('logged-out actions reached paid AI routes');
            if(pageErrors.length!==0) throw new Error('page errors: '+pageErrors.join(' | '));
            await browser.close(); server.close();
          })().catch(e=>{console.error(e);server.close();process.exit(1);});
          NODE
      - name: Create exact deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd netlify-dist && zip -qr ../wingman-netlify-fce45cf9.zip .)
          unzip -l wingman-netlify-fce45cf9.zip
          sha256sum wingman-netlify-fce45cf9.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wingman-netlify-fce45cf9
          path: wingman-netlify-fce45cf9.zip
          if-no-files-found: error
          retention-days: 7
