name: PR soft-sawine CORS check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full regression
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node tests/cors_production_policy.test.js
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build:netlify
          test "$(grep -o "https://soft-sawine-30785c.netlify.app" server.js | wc -l | tr -d ' ')" = '1'
          test "$(find netlify-dist -type f | wc -l | tr -d ' ')" = '23'
