name: Railway static exposure audit

on:
  push:
    branches: [audit/full-production-forensics]
    paths: ['.github/workflows/railway-static-exposure.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify sensitive and internal paths are denied
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://wingman-production-c6ce.up.railway.app'
          paths=(
            'server.js'
            'package.json'
            'PROMPT_SYSTEM_MEMORY.json'
            'tests/production_readiness_regression.test.js'
            'middleware/security.js'
            'migrations/004_cleanup_credit_security_and_rls.sql'
            'migrations/005_user_consent_and_age_verification.sql'
            'scripts/build-netlify-dist.js'
            'netlify.toml'
          )
          failed=0
          for p in "${paths[@]}"; do
            code=$(curl --silent --show-error --location -o /tmp/body -w '%{http_code}' "$BASE/$p" || true)
            bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
            echo "RAILWAY_PROBE path=$p status=$code bytes=$bytes"
            if [ "$code" != '403' ]; then
              echo "Expected 403 for $p, got $code" >&2
              failed=1
            fi
          done
          exit "$failed"
