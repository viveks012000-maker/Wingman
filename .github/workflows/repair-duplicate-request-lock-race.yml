name: Repair duplicate request lock race

on:
  push:
    branches: [fix/duplicate-request-lock-race]
    paths: ['.github/workflows/repair-duplicate-request-lock-race.yml']

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duplicate-request-lock-race
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply minimal request-aware concurrency repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old_lock = '''const activeUserAiRequests = new Set();
          function acquireUserConcurrencyLock(userId) {
              if (!userId || userId === 'guest_user') return true;
              if (activeUserAiRequests.has(userId)) {
                  return false;
              }
              activeUserAiRequests.add(userId);
              return true;
          }
          '''
          new_lock = '''const activeUserAiRequests = new Map();
          function acquireUserConcurrencyLock(userId, requestId) {
              if (!userId || userId === 'guest_user') return { acquired: true, duplicate: false };
              const activeRequestId = activeUserAiRequests.get(userId);
              if (activeRequestId !== undefined) {
                  return { acquired: false, duplicate: activeRequestId === requestId };
              }
              activeUserAiRequests.set(userId, requestId);
              return { acquired: true, duplicate: false };
          }
          function releaseUserConcurrencyLock(userId, requestId) {
              if (!userId || userId === 'guest_user') return;
              if (requestId === undefined || activeUserAiRequests.get(userId) === requestId) {
                  activeUserAiRequests.delete(userId);
              }
          }
          '''
          if s.count(old_lock) != 1:
              raise SystemExit(f'Expected exactly one old lock block, found {s.count(old_lock)}')
          s = s.replace(old_lock, new_lock, 1)

          pattern = re.compile(
              r'''    const uid = getUserIdFromReq\(req\);\n'''
              r'''    if \(!acquireUserConcurrencyLock\(uid\)\) \{\n'''
              r'''        return res\.status\(429\)\.json\(\{ success: false, error: "A generation is already in progress for your account\. Please wait for it to complete\." \}\);\n'''
              r'''    \}\n'''
              r'''    (const reqId = [^\n]+;\n)'''
          )

          def repl(m):
              req_line = m.group(1)
              return (
                  '    const uid = getUserIdFromReq(req);\n'
                  '    ' + req_line +
                  '    const lockState = acquireUserConcurrencyLock(uid, reqId);\n'
                  '    if (!lockState.acquired) {\n'
                  '        if (lockState.duplicate) {\n'
                  '            return res.status(409).json({\n'
                  '                success: false,\n'
                  '                error: "This request ID is already in progress. No additional credits were deducted.",\n'
                  '                code: "DUPLICATE_REQUEST",\n'
                  '                duplicate: true\n'
                  '            });\n'
                  '        }\n'
                  '        return res.status(429).json({ success: false, error: "A generation is already in progress for your account. Please wait for it to complete." });\n'
                  '    }\n'
              )

          s, count = pattern.subn(repl, s)
          if count != 5:
              raise SystemExit(f'Expected to repair 5 paid route groups, repaired {count}')

          release_count = s.count('releaseUserConcurrencyLock(uid);')
          if release_count != 5:
              raise SystemExit(f'Expected 5 legacy release calls, found {release_count}')
          s = s.replace('releaseUserConcurrencyLock(uid);', 'releaseUserConcurrencyLock(uid, reqId);')
          p.write_text(s, encoding='utf-8')

          # Update the Maeve guard so it asserts the repaired shared lock contract, not the obsolete Set pattern.
          mp = Path('tests/maeve_runtime_repair.test.js')
          ms = mp.read_text(encoding='utf-8')
          old_assert = '''assert(serverSource.includes("const uid = getUserIdFromReq(req);\\n    if (!acquireUserConcurrencyLock(uid))"));'''
          new_assert = '''assert(serverSource.includes('const lockState = acquireUserConcurrencyLock(uid, reqId);'));\nassert(serverSource.includes('releaseUserConcurrencyLock(uid, reqId);'));'''
          if old_assert not in ms:
              raise SystemExit('Expected Maeve legacy concurrency assertion not found')
          mp.write_text(ms.replace(old_assert, new_assert, 1), encoding='utf-8')

          # Add the race regression to the complete suite.
          rp = Path('tests/run_all_tests.js')
          rs = rp.read_text(encoding='utf-8')
          old_last = "    { name: '35. Feature Access Preflight UX Guard', file: 'feature_access_preflight.test.js' }\n];"
          new_last = "    { name: '35. Feature Access Preflight UX Guard', file: 'feature_access_preflight.test.js' },\n    { name: '36. Duplicate Request Concurrency Lock Race Guard', file: 'duplicate_request_lock_race.test.js' }\n];"
          if old_last not in rs:
              raise SystemExit('run_all_tests suite tail not found')
          rp.write_text(rs.replace(old_last, new_last, 1), encoding='utf-8')
          PY

          cat > tests/duplicate_request_lock_race.test.js <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('server.js', 'utf8');

          assert(source.includes('const activeUserAiRequests = new Map();'), 'request lock must retain active request ids');
          assert(source.includes('function acquireUserConcurrencyLock(userId, requestId)'), 'lock must accept request id');
          assert(source.includes('function releaseUserConcurrencyLock(userId, requestId)'), 'release helper must be defined');
          assert(!source.includes('const activeUserAiRequests = new Set();'), 'obsolete Set-only lock must not return');

          const lockStart = source.indexOf('const activeUserAiRequests = new Map();');
          const lockEnd = source.indexOf('// =========================================================================================\n// SERVER-AUTHORITATIVE CONSENT', lockStart);
          assert(lockStart >= 0 && lockEnd > lockStart, 'unable to isolate concurrency helper');
          const lockSource = source.slice(lockStart, lockEnd) + '\nthis.__acquire = acquireUserConcurrencyLock; this.__release = releaseUserConcurrencyLock;';
          const context = {};
          vm.createContext(context);
          vm.runInContext(lockSource, context);

          let state = context.__acquire('user-a', 'request-1');
          assert.strictEqual(state.acquired, true);
          assert.strictEqual(state.duplicate, false);
          state = context.__acquire('user-a', 'request-1');
          assert.strictEqual(state.acquired, false);
          assert.strictEqual(state.duplicate, true, 'same in-flight request id must be classified as duplicate');
          state = context.__acquire('user-a', 'request-2');
          assert.strictEqual(state.acquired, false);
          assert.strictEqual(state.duplicate, false, 'different concurrent request must remain busy/429');
          context.__release('user-a', 'request-2');
          state = context.__acquire('user-a', 'request-2');
          assert.strictEqual(state.acquired, false, 'wrong request id must not release another request lock');
          context.__release('user-a', 'request-1');
          state = context.__acquire('user-a', 'request-2');
          assert.strictEqual(state.acquired, true, 'matching finally release must unlock account');
          context.__release('user-a', 'request-2');

          const routeMarkers = [
            "app.post(['/api/analyze', '/api/analyze-chat-screenshot']",
            "app.post('/api/icebreaker'",
            "app.post(['/api/optimize', '/api/bio-optimizer']",
            "app.post(['/api/chat', '/api/simulator/chat']",
            "app.post('/api/simulator/review'"
          ];
          for (const marker of routeMarkers) {
            const start = source.indexOf(marker);
            assert(start >= 0, `missing paid route ${marker}`);
            const head = source.slice(start, start + 2200);
            const reqIndex = head.indexOf('const reqId =');
            const lockIndex = head.indexOf('const lockState = acquireUserConcurrencyLock(uid, reqId);');
            assert(reqIndex >= 0 && lockIndex > reqIndex, `${marker}: request id must be computed before concurrency lock`);
            assert(head.includes('if (lockState.duplicate)'), `${marker}: same-id in-flight duplicate branch missing`);
            assert(head.includes('return res.status(409).json({'), `${marker}: duplicate must return 409`);
            assert(head.includes('code: "DUPLICATE_REQUEST"'), `${marker}: machine-readable duplicate code missing`);
            assert(head.includes('return res.status(429).json({ success: false, error: "A generation is already in progress'), `${marker}: different-request concurrency 429 must remain`);
          }

          assert.strictEqual((source.match(/releaseUserConcurrencyLock\(uid, reqId\);/g) || []).length, 5, 'all five paid route groups must release the exact request lock');
          console.log('Duplicate request concurrency lock race guard passed.');
          EOF

      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run targeted race regression
        run: node tests/duplicate_request_lock_race.test.js
      - name: Run complete regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Netlify frontend-only artifact
        run: npm run build:netlify
      - name: Verify clean repair scope and commit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DIFF ==='
          git diff -- server.js tests/maeve_runtime_repair.test.js tests/run_all_tests.js tests/duplicate_request_lock_race.test.js
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(server\.js|tests/maeve_runtime_repair\.test\.js|tests/run_all_tests\.js|tests/duplicate_request_lock_race\.test\.js)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js tests/maeve_runtime_repair.test.js tests/run_all_tests.js tests/duplicate_request_lock_race.test.js
          git commit -m 'fix: make paid request locks idempotency-aware'
          git push origin HEAD:fix/duplicate-request-lock-race
