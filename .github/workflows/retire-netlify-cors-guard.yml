name: Retire Netlify CORS guard

on:
  push:
    branches:
      - fix/remove-netlify-cors-20260817b
    paths:
      - .github/workflows/retire-netlify-cors-guard.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-netlify-cors-20260817b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply exact Netlify CORS retirement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          server_path = Path('server.js')
          test_path = Path('tests/cors_production_policy.test.js')
          server = server_path.read_text()
          test = test_path.read_text()

          old_origins = """const productionAllowedOrigins = [
              'https://mywingman.com',
              'https://mywingman.pages.dev',
              'https://chimerical-granita-c68c5a.netlify.app',
              'https://wondrous-arithmetic-0ece9d.netlify.app',
              'https://joyful-conkies-026a81.netlify.app',
              'https://soft-sawine-30785c.netlify.app'
          ];"""
          new_origins = """const productionAllowedOrigins = [
              'https://mywingman.com',
              'https://mywingman.pages.dev'
          ];"""
          if server.count(old_origins) != 1:
              raise SystemExit('Expected productionAllowedOrigins block was not found exactly once; refusing to patch.')
          server = server.replace(old_origins, new_origins)

          old_test = """assert.ok(server.includes(\"'https://chimerical-granita-c68c5a.netlify.app'\"), 'Netlify production origin must remain allowed');
          assert.ok(server.includes(\"'https://wondrous-arithmetic-0ece9d.netlify.app'\"), 'Current Netlify demo origin must be explicitly allowed');
          assert.ok(server.includes(\"'https://joyful-conkies-026a81.netlify.app'\"), 'Joyful Netlify audit origin must be explicitly allowed');
          assert.ok(server.includes(\"'https://soft-sawine-30785c.netlify.app'\"), 'Current Git-linked Netlify production origin must be explicitly allowed');"""
          new_test = """const productionOriginsBlock = server.match(/const productionAllowedOrigins = \\[([\\s\\S]*?)\\];/);
          assert.ok(productionOriginsBlock, 'Production CORS origin block must exist');
          assert.ok(!productionOriginsBlock[1].includes('netlify.app'), 'Production CORS defaults must not trust any Netlify origin after Cloudflare cutover');"""
          if test.count(old_test) != 1:
              raise SystemExit('Expected legacy Netlify CORS assertions were not found exactly once; refusing to patch.')
          test = test.replace(old_test, new_test)

          server_path.write_text(server)
          test_path.write_text(test)
          PY
      - name: Targeted CORS regression
        run: node tests/cors_production_policy.test.js
      - name: Complete regression suite
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production frontend artifact
        run: npm run build:netlify
      - name: Artifact safety sanity
        shell: bash
        run: |
          test -f netlify-dist/release.json
          test -f netlify-dist/404.html
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -e netlify-dist/database.js
          test ! -d netlify-dist/tests
          test ! -d netlify-dist/middleware
          echo "ARTIFACT_FILE_COUNT=$(find netlify-dist -type f | wc -l)"
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js tests/cors_production_policy.test.js
          git diff --cached --exit-code && { echo 'No product changes to commit'; exit 1; } || true
          git commit -m "security: retire Netlify origins from production CORS"
          git push origin HEAD:fix/remove-netlify-cors-20260817b
