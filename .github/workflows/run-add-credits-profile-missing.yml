name: Verify add credits missing profile hardening
on:
  push:
    branches: [fix/add-credits-profile-missing]
    paths: ['.github/workflows/run-add-credits-profile-missing.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/add-credits-profile-missing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused invariant patch
        run: node scripts/patch-add-credits-profile-missing.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 30-suite gate
        run: npm test
      - name: Syntax SQL text and dependency gate
        shell: bash
        run: |
          node --check server.js
          node --check tests/add_credits_profile_missing.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Netlify package safety regression
        run: npm run build:netlify
      - name: Commit verified product and migration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add server.js migrations/007_harden_add_credits_profile_missing.sql tests/add_credits_profile_missing.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(credits): keep missing profiles explicit in privileged top-ups'
          git push origin HEAD:fix/add-credits-profile-missing
