name: Apply production CORS lockdown

on:
  push:
    branches: [fix/cors-production-lockdown]
    paths: ['.github/workflows/run-cors-lockdown.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cors-production-lockdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/patch-production-cors.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 27-suite gate
        run: npm test
      - name: Syntax and production dependency gate
        shell: bash
        run: |
          node --check server.js
          node --check tests/cors_production_policy.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Local production-mode CORS behavior test
        shell: bash
        run: |
          set -euo pipefail
          PORT=4107 NODE_ENV=production \
          AICREDITS_API_KEY=dummy AICREDITS_API_KEY_VISION=dummy \
          SUPABASE_URL=https://example.supabase.co SUPABASE_ANON_KEY=dummy SUPABASE_SERVICE_ROLE_KEY=dummy \
          node server.js >/tmp/wingman-cors.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -s http://127.0.0.1:4107/api/health >/dev/null && break; sleep .2; done
          probe() {
            local origin="$1" expected="$2"
            curl --silent --show-error -D /tmp/h -o /tmp/b -X OPTIONS http://127.0.0.1:4107/api/analyze \
              -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type' || true
            allow=$(tr -d '\r' </tmp/h | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2; exit}')
            echo "LOCAL_CORS origin=$origin allow=${allow:-NONE}"
            if [ "$expected" = allow ]; then test "$allow" = "$origin"; else test -z "$allow"; fi
          }
          probe 'https://chimerical-granita-c68c5a.netlify.app' allow
          probe 'https://mywingman.com' allow
          probe 'https://evil-preview.pages.dev' deny
          probe 'http://localhost:9999' deny
          probe 'null' deny
          probe 'https://evil.example' deny
          test "$(curl -s -o /tmp/no -w '%{http_code}' http://127.0.0.1:4107/api/health)" = 200
      - name: Verify Netlify build remains safe
        run: npm run build:netlify
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add server.js tests/cors_production_policy.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(security): lock production CORS to explicit origins'
          git push origin HEAD:fix/cors-production-lockdown

# rerun after semantic test assertion correction
