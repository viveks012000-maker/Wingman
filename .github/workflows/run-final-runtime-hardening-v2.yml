name: Run final runtime hardening v2
on:
  push:
    branches: [fix/final-runtime-csp-hardening-v2]
    paths: ['.github/workflows/run-final-runtime-hardening-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-runtime-csp-hardening-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused current-main patch
        run: node scripts/apply-final-runtime-hardening-v2.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 29-suite regression gate
        run: npm test
      - name: Syntax diff and dependency checks
        shell: bash
        run: |
          node --check server.js
          node --check scripts/build-netlify-dist.js
          node --check tests/runtime_startup_csp_hardening.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Netlify production artifact safety gate
        shell: bash
        run: |
          npm run build:netlify
          test -f netlify-dist/release.json
          ! grep -R "unsafe-eval" netlify-dist/_headers
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -d netlify-dist/migrations
          test ! -d netlify-dist/tests
          test ! -d netlify-dist/middleware
      - name: Commit verified product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add server.js scripts/build-netlify-dist.js .env.example tests/runtime_startup_csp_hardening.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(security): harden runtime startup and browser CSP'
          git push origin HEAD:fix/final-runtime-csp-hardening-v2
