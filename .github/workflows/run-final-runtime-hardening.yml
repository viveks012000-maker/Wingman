name: Run final runtime hardening
on:
  push:
    branches: [fix/final-runtime-csp-hardening]
    paths: ['.github/workflows/run-final-runtime-hardening.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-runtime-csp-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply one-shot patch
        run: node scripts/apply-final-runtime-hardening.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full regression gate
        run: npm test
      - name: Syntax and diff checks
        run: node --check server.js && node --check scripts/build-netlify-dist.js && node --check tests/runtime_startup_csp_hardening.test.js && node --check tests/run_all_tests.js && git diff --check
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Netlify deploy safety gate
        run: npm run build:netlify && test -f netlify-dist/release.json && ! grep -R "unsafe-eval" netlify-dist/_headers && test ! -e netlify-dist/server.js && test ! -e netlify-dist/package.json && test ! -d netlify-dist/migrations && test ! -d netlify-dist/tests && test ! -d netlify-dist/middleware
      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add server.js scripts/build-netlify-dist.js tests/runtime_startup_csp_hardening.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(security): make server imports side-effect free and drop unsafe-eval'
          git push origin HEAD:fix/final-runtime-csp-hardening
