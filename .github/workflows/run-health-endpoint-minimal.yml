name: Verify health endpoint minimal disclosure
on:
  push:
    branches: [fix/health-endpoint-minimal]
    paths: ['.github/workflows/run-health-endpoint-minimal.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/health-endpoint-minimal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused health patch
        run: node scripts/patch-health-endpoint-minimal.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 32-suite gate
        run: npm test
      - name: Syntax diff and dependency gate
        shell: bash
        run: |
          node --check server.js
          node --check tests/health_endpoint_minimal.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Netlify package safety regression
        run: npm run build:netlify
      - name: Commit verified health changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add server.js tests/health_endpoint_minimal.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(security): minimize public health endpoint disclosure'
          git push origin HEAD:fix/health-endpoint-minimal
