name: Run Git history secret scan
on:
  push:
    branches: [audit/post-netlify-deploy-20260815]
    paths: ['.github/workflows/run-history-secret-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redacted secret scan
        run: python scripts/history-secret-scan.py
