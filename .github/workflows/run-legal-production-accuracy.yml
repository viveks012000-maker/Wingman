name: Verify legal production accuracy
on:
  push:
    branches: [fix/legal-production-accuracy]
    paths: ['.github/workflows/run-legal-production-accuracy.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legal-production-accuracy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused legal/privacy patch
        run: node scripts/patch-legal-production-accuracy.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 31-suite gate
        run: npm test
      - name: Syntax diff and dependency gate
        shell: bash
        run: |
          node --check tests/legal_production_accuracy.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Netlify package safety regression
        run: npm run build:netlify
      - name: Commit verified production/legal changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add refund.html privacy.html tests/legal_production_accuracy.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(legal): align payment and retention copy with production reality'
          git push origin HEAD:fix/legal-production-accuracy
