name: Run post-audit hardening

on:
  push:
    branches:
      - fix/post-audit-correctness
    paths:
      - .github/workflows/run-post-audit-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-audit-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused hardening patch
        run: node scripts/post-audit-hardening-patch.js
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full 26-suite gate
        run: npm test
      - name: Syntax and diff gate
        shell: bash
        run: |
          node --check app.js
          node --check server.js
          node --check tests/post_audit_correctness.test.js
          node --check tests/run_all_tests.js
          git diff --check
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Verify Netlify package still excludes internals
        shell: bash
        run: |
          npm run build:netlify
          test -f netlify-dist/release.json
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -d netlify-dist/migrations
          test ! -d netlify-dist/tests
          test ! -d netlify-dist/middleware
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add index.html server.js tests/post_audit_correctness.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m "fix(security): harden landing toasts and deduplicate CSRF issuer"
          git push origin HEAD:fix/post-audit-correctness
