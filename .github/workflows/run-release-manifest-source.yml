name: Verify release manifest source truth
on:
  push:
    branches: [fix/release-manifest-source]
    paths: ['.github/workflows/run-release-manifest-source.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-manifest-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused builder patch
        run: node scripts/patch-release-manifest-source.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full 33-suite gate
        run: npm test
      - name: Syntax diff and dependency gate
        shell: bash
        run: |
          node --check scripts/build-netlify-dist.js
          node --check tests/release_manifest_source.test.js
          node --check tests/run_all_tests.js
          git diff --check
          npm audit --omit=dev
      - name: Verify fake GITHUB_SHA cannot corrupt release manifest
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          GITHUB_SHA=1111111111111111111111111111111111111111 node scripts/build-netlify-dist.js
          node -e "const r=require('./netlify-dist/release.json'); const e=process.argv[1]; if(r.sourceCommit!==e) throw new Error('manifest mismatch '+r.sourceCommit+' != '+e)" "$actual"
          test ! -e netlify-dist/server.js
          test ! -e netlify-dist/package.json
          test ! -d netlify-dist/migrations
          test ! -d netlify-dist/tests
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add scripts/build-netlify-dist.js tests/release_manifest_source.test.js tests/run_all_tests.js
          git diff --cached --check
          git commit -m 'fix(release): stamp Netlify manifest from actual checkout SHA'
          git push origin HEAD:fix/release-manifest-source
