name: Targeted axe detail
on:
  push:
    branches: [audit/post-mobile-repair-20260817]
    paths:
      - scripts/targeted-axe-detail.js
      - .github/workflows/targeted-axe-detail.yml
permissions:
  contents: read
jobs:
  axe-detail:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false axe-core
      - run: npx playwright install --with-deps chromium webkit
      - name: Extend exact-release wait window
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/targeted-axe-detail.js')
          s=p.read_text()
          old='for (let i = 0; i < 40; i++) {'
          new='for (let i = 0; i < 160; i++) {'
          if s.count(old)!=1: raise SystemExit(f'release loop patch count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Emit exact axe nodes as annotations
        run: |
          set +e
          node scripts/targeted-axe-detail.js 2>&1 | tee /tmp/axe.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Exact axe node::$safe"
          done < <(grep '^AXE_FAIL ' /tmp/axe.log || true)
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=Audit precondition failure::$safe"
          done < <(grep '^AXE_DETAIL_FATAL ' /tmp/axe.log || true)
          exit "$status"
