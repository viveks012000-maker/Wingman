name: Temporary exact app pending-signup copy patch

on:
  push:
    branches:
      - fix/verify-email-before-profile-credits

permissions:
  contents: write

jobs:
  patch-exact-app-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/verify-email-before-profile-credits
          fetch-depth: 0

      - name: Replace only the misleading app pending-signup message
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          old = b'Account created. Check your email to verify it before signing in.'
          new = b'Check your email to finish signup. Your account and 20 free credits activate after verification.'
          data = path.read_bytes()
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'app.js: expected exactly one target string, found {count}')
          patched = data.replace(old, new, 1)
          if old in patched or patched.count(new) != 1:
              raise SystemExit('app.js: exact replacement verification failed')
          path.write_bytes(patched)

      - name: Verify exact diff scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "app.js" || {
            echo "Unexpected changed files" >&2
            exit 1
          }
          git diff --numstat

      - name: Commit exact copy repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix(auth): clarify dashboard pending verification state"
          git push origin HEAD:fix/verify-email-before-profile-credits
