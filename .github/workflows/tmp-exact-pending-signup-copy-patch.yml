name: Temporary exact pending-signup copy patch

on:
  push:
    branches:
      - fix/verify-email-before-profile-credits

permissions:
  contents: write

jobs:
  patch-exact-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/verify-email-before-profile-credits
          fetch-depth: 0

      - name: Replace only the two misleading pending-signup messages
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('supabaseClient.js'): (
                  b'Account created! Please check your email to confirm your account and sign in.',
                  b'Check your email to finish signup. Your account and 20 free credits activate after verification.'
              ),
              Path('index.html'): (
                  b'Account created. Check your email to verify it before signing in.',
                  b'Check your email to finish signup. Your account and 20 free credits activate after verification.'
              ),
          }

          for path, (old, new) in replacements.items():
              data = path.read_bytes()
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target string, found {count}')
              path.write_bytes(data.replace(old, new, 1))

          # Prove no old claim remains in the patched production sources.
          for path, (old, _) in replacements.items():
              if old in path.read_bytes():
                  raise SystemExit(f'{path}: old pending-signup claim still present')

      - name: Verify exact diff scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'index.html\nsupabaseClient.js' || {
            echo "Unexpected changed files" >&2
            exit 1
          }

      - name: Commit exact copy repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabaseClient.js
          git commit -m "fix(auth): clarify pending email verification state"
          git push origin HEAD:fix/verify-email-before-profile-credits
