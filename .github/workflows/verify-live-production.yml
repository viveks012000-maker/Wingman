name: MyWingman Live Production Verification

on:
  workflow_run:
    workflows:
      - MyWingman Production Verification Gate
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-verification
  cancel-in-progress: true

jobs:
  verify-live-production:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://mywingmanapp.com
      WWW_URL: https://www.mywingmanapp.com
      PAGES_DEV_URL: https://mywingman.pages.dev
      PREVIEW_URL: https://e1723ede.mywingman.pages.dev
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out protected main for verifier dependencies
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build expected public artifact
        run: npm run build:production

      - name: Verify live production release, routes, and real touch scrolling
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright');
          const { classifyStaleAsset, compareAsset, sha256 } = require('./tests/live_asset_integrity');

          const productionUrl = process.env.PRODUCTION_URL.replace(/\/$/, '');
          const wwwUrl = process.env.WWW_URL.replace(/\/$/, '');
          const pagesDevUrl = process.env.PAGES_DEV_URL.replace(/\/$/, '');
          const previewUrl = process.env.PREVIEW_URL.replace(/\/$/, '');
          const expectedSha = process.env.EXPECTED_SHA;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;

          async function readJson(url, init = {}) {
            const response = await fetch(url, {
              redirect: 'manual',
              cache: 'no-store',
              ...init,
              headers: {
                accept: 'application/json',
                'cache-control': 'no-cache',
                ...(init.headers || {})
              }
            });
            assert.equal(response.status, 200, `${url} returned HTTP ${response.status}`);
            assert.equal(response.headers.get('location'), null, `${url} unexpectedly redirected`);
            return response.json();
          }

          async function waitForCurrentRelease() {
            const deadline = Date.now() + 10 * 60 * 1000;
            let lastSeen = 'unavailable';
            while (Date.now() < deadline) {
              try {
                const release = await readJson(`${productionUrl}/release.json?live_verify=${expectedSha}`);
                lastSeen = release.sourceCommit || 'missing sourceCommit';
                if (lastSeen === expectedSha) return release;
                console.log(`Waiting for Pages production deployment: live=${lastSeen} expected=${expectedSha}`);
              } catch (error) {
                console.log(`Waiting for Pages production deployment: ${error.message}`);
              }
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            throw new Error(`Production did not expose expected release ${expectedSha}; last live value was ${lastSeen}`);
          }

          async function assertProtectedMainIsStillExpected() {
            const headers = {
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28'
            };
            if (token) headers.authorization = `Bearer ${token}`;
            const branch = await readJson(`https://api.github.com/repos/${repository}/branches/main`, {
              headers
            });
            assert.equal(branch.commit.sha, expectedSha, `main advanced while this deployment was being verified: main=${branch.commit.sha} expected=${expectedSha}`);
            assert.equal(branch.protected, true, 'main must remain protected');
          }

          async function verifyPermanentRedirect(sourceBase, pathAndQuery) {
            const sourceUrl = `${sourceBase}${pathAndQuery}`;
            const expectedLocation = `${productionUrl}${pathAndQuery}`;
            const response = await fetch(sourceUrl, {
              redirect: 'manual',
              cache: 'no-store',
              headers: { 'cache-control': 'no-cache' }
            });
            assert.equal(response.status, 301, `${sourceUrl} returned HTTP ${response.status}, expected 301`);
            assert.equal(response.headers.get('location'), expectedLocation, `${sourceUrl} did not preserve the exact path/query`);
            console.log(`PASS redirect ${sourceUrl} -> ${expectedLocation}`);
          }

          async function verifyPreviewIsNotRedirected() {
            const response = await fetch(`${previewUrl}/`, {
              redirect: 'manual',
              cache: 'no-store',
              headers: { 'cache-control': 'no-cache' }
            });
            const location = response.headers.get('location') || '';
            assert.notEqual(response.status, 301, 'preview deployment hostname must not be covered by the production redirect');
            assert(!location.startsWith(`${productionUrl}/`), 'preview deployment must not redirect to the canonical production domain');
            console.log(`PASS preview preserved ${previewUrl}/: HTTP ${response.status}`);
          }

          async function readAsset(url, expectedStatus = 200) {
            const response = await fetch(url, {
              redirect: 'manual',
              cache: 'no-store',
              headers: {
                accept: '*/*',
                'cache-control': 'no-cache',
                pragma: 'no-cache'
              }
            });
            assert.equal(response.status, expectedStatus, `${url} returned HTTP ${response.status}`);
            assert.equal(response.headers.get('location'), null, `${url} unexpectedly redirected`);
            return {
              body: Buffer.from(await response.arrayBuffer()),
              headers: response.headers
            };
          }

          async function verifyLiveAssets(release) {
            const requiredAssetNames = new Set(['index.html', 'app.html', 'style.css', 'output.css', 'app.js']);
            const assetNames = Object.keys(release.files || {})
              .filter(name => !['_headers', '_redirects'].includes(name))
              .sort();
            const results = [];
            let repeatedContentMatches = true;
            for (const name of assetNames) {
              const expectedPath = path.join(process.cwd(), 'netlify-dist', name);
              const expectedBody = fs.readFileSync(expectedPath);
              assert.equal(release.files?.[name], sha256(expectedBody), `${name} build hash is absent or not tied to the checked-out artifact`);
              const routeByFile = {
                '404.html': ['/404', 200],
                'app.html': ['/app', 200],
                'index.html': ['/', 200],
                'privacy.html': ['/privacy', 200],
                'refund.html': ['/refund', 200],
                'terms.html': ['/terms', 200]
              };
              const [route, expectedStatus] = routeByFile[name] || [`/${name}`, 200];
              const first = await readAsset(`${productionUrl}${route}?live_asset_verify=${expectedSha}-${name}`, expectedStatus);
              const second = await readAsset(`${productionUrl}${route}?live_asset_verify=${expectedSha}-${name}-repeat`, expectedStatus);
              const result = compareAsset(name, expectedBody, first.body);
              const repeated = compareAsset(name, first.body, second.body);
              assert(['PASS', 'EXPECTED CLOUDFLARE TRANSFORMATION', 'FAIL'].includes(result.rawStatus), `unrecognized raw HTML byte status for ${name}: ${result.rawStatus}`);
              assert.equal(result.sourceMatch, true, `${name} differs from the expected public artifact: ${JSON.stringify(result)}`);
              assert.equal(repeated.sourceMatch, true, `${name} changed between fresh repeated requests: ${JSON.stringify(repeated)}`);
              repeatedContentMatches = repeatedContentMatches && repeated.sourceMatch;
              if (!name.endsWith('.html')) assert.equal(result.rawMatch, true, `${name} must match exact bytes: ${JSON.stringify(result)}`);
              if (name.endsWith('.html') && name !== '404.html') {
                const csp = first.headers.get('content-security-policy') || '';
                assert.match(csp, /https:\/\/static\.cloudflareinsights\.com/, `${name} CSP does not permit the observed Web Analytics beacon`);
                assert.match(csp, /https:\/\/cloudflareinsights\.com/, `${name} CSP does not permit the observed Web Analytics connection`);
              } else if (name === '404.html') {
                // Cloudflare Pages serves its special 404 response outside the normal
                // _headers route pipeline; retain the byte/analytics checks above but
                // do not assert normal-page CSP headers on this special response.
                console.log('CSP 404.html: Pages special 404 response does not expose normal _headers CSP');
              }
              results.push(result);
              console.log(`ASSET ${name}: source=${result.sourceMatch ? 'PASS' : 'FAIL'} raw=${result.rawStatus} analytics=${result.cloudflareAnalytics} expected=${result.expectedSha256} live=${result.liveSha256}`);
            }
            assert.deepEqual(
              [...requiredAssetNames].sort(),
              [...requiredAssetNames].filter(name => results.some(result => result.name === name)).sort(),
              'required live assets were not all checked'
            );
            const otherAssetCount = results.filter(result => !requiredAssetNames.has(result.name)).length;
            console.log(`SOURCE ASSET MATCH: PASS (${results.length} public assets; ${otherAssetCount} other deploy-controlled assets)`);
            const staleIssue = classifyStaleAsset({
              expectedSha,
              liveSourceCommit: release.sourceCommit,
              assetResults: results,
              repeatedContentMatches
            });
            assert.equal(staleIssue, 'NOT FOUND', `CACHE/STALE-ASSET ISSUE: ${staleIssue}`);
            console.log('CACHE/STALE-ASSET ISSUE: NOT FOUND');
          }

          async function swipeUp(page, client, width, height) {
            const x = Math.floor(width / 2);
            const startY = Math.max(80, height - 90);
            const endY = Math.max(24, startY - Math.min(520, height - 48));
            await client.send('Input.dispatchTouchEvent', {
              type: 'touchStart',
              touchPoints: [{ id: 1, x, y: startY, radiusX: 8, radiusY: 8, force: 1 }]
            });
            const distance = startY - endY;
            for (let step = 1; step <= 8; step += 1) {
              await page.waitForTimeout(25);
              await client.send('Input.dispatchTouchEvent', {
                type: 'touchMove',
                touchPoints: [{ id: 1, x, y: startY - (distance * step / 8), radiusX: 8, radiusY: 8, force: 1 }]
              });
            }
            await page.waitForTimeout(25);
            await client.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
            await page.waitForTimeout(150);
          }

          async function verifyMobileTouchScroll(browser, route, width, height) {
            const context = await browser.newContext({
              viewport: { width, height },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: width > height ? 2 : 3,
              userAgent: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            try {
              const response = await page.goto(`${productionUrl}${route}?live_verify=${expectedSha}`, { waitUntil: 'networkidle', timeout: 45_000 });
              assert(response, `${route} did not return a response at ${width}x${height}`);
              assert.equal(response.status(), 200, `${route} returned HTTP ${response.status()} at ${width}x${height}`);
              const finalUrl = new URL(page.url());
              const isAppHtmlAlias = route === '/app.html';
              assert.equal(finalUrl.hostname, new URL(productionUrl).hostname, `${route} navigated away at ${width}x${height}`);
              assert.equal(finalUrl.pathname, isAppHtmlAlias ? '/app' : route, `${route} resolved to unexpected path ${finalUrl.pathname} at ${width}x${height}`);
              const before = await page.evaluate(() => {
                const scroller = document.scrollingElement;
                scroller.scrollTop = 0;
                return {
                  scrollHeight: scroller.scrollHeight,
                  viewportHeight: window.innerHeight,
                  scrollTop: scroller.scrollTop,
                  htmlOverflowY: getComputedStyle(document.documentElement).overflowY,
                  bodyOverflowY: getComputedStyle(document.body).overflowY,
                  htmlTouchAction: getComputedStyle(document.documentElement).touchAction,
                  bodyTouchAction: getComputedStyle(document.body).touchAction,
                  maxTouchPoints: navigator.maxTouchPoints
                };
              });
              assert(before.scrollHeight > before.viewportHeight, `no vertical scroll range at ${width}x${height}: ${JSON.stringify(before)}`);
              assert(before.maxTouchPoints > 0, `touch emulation was not active at ${width}x${height}`);
              if (width < 768) {
                assert.equal(before.htmlOverflowY, 'auto', `HTML root did not own scrolling at ${width}x${height}`);
                assert.equal(before.bodyOverflowY, 'visible', `body became a vertical scroller at ${width}x${height}`);
                assert.equal(before.htmlTouchAction, 'pan-y pinch-zoom', `HTML touch action changed at ${width}x${height}`);
                assert.equal(before.bodyTouchAction, 'pan-y pinch-zoom', `body touch action changed at ${width}x${height}`);
              }
              const client = await context.newCDPSession(page);
              await swipeUp(page, client, width, height);
              const after = await page.evaluate(() => ({ scrollTop: document.scrollingElement.scrollTop, windowScrollY: window.scrollY }));
              assert(after.scrollTop > 0 && after.windowScrollY > 0, `real vertical touch swipe did not move ${route} at ${width}x${height}: ${JSON.stringify({ before, after })}`);
              if (route === '/app' || route === '/app.html') {
                const modalState = await page.evaluate(() => {
                  window.openPurchaseModal(10);
                  const locked = {
                    html: document.documentElement.classList.contains('wingman-scroll-locked'),
                    body: document.body.classList.contains('wingman-scroll-locked')
                  };
                  window.closePurchaseModal();
                  const unlocked = {
                    html: document.documentElement.classList.contains('wingman-scroll-locked'),
                    body: document.body.classList.contains('wingman-scroll-locked'),
                    bodyOverflowY: getComputedStyle(document.body).overflowY
                  };
                  return { locked, unlocked };
                });
                assert.deepEqual(modalState.locked, { html: true, body: true }, `app modal did not acquire the explicit scroll lock at ${width}x${height}: ${JSON.stringify(modalState)}`);
                assert.deepEqual(modalState.unlocked, { html: false, body: false, bodyOverflowY: 'visible' }, `app modal did not release the explicit scroll lock at ${width}x${height}: ${JSON.stringify(modalState)}`);
              }
              assert.deepEqual(pageErrors, [], `page errors at ${route} ${width}x${height}: ${pageErrors.join('; ')}`);
              console.log(`PASS mobile touch scroll ${route}${isAppHtmlAlias ? ' (canonical /app)' : ''} ${width}x${height}: scrollY=${after.windowScrollY}`);
            } finally {
              await context.close();
            }
          }

          async function verifyDesktopWheelScroll(browser) {
            const context = await browser.newContext({ viewport: { width: 1366, height: 768 }, isMobile: false, hasTouch: false });
            const page = await context.newPage();
            try {
              await page.goto(`${productionUrl}/?live_verify=${expectedSha}`, { waitUntil: 'networkidle', timeout: 45_000 });
              await page.mouse.wheel(0, 520);
              await page.waitForTimeout(100);
              const scrollTop = await page.evaluate(() => document.scrollingElement.scrollTop);
              assert(scrollTop > 0, `desktop wheel scrolling did not move the page: ${scrollTop}`);
              console.log(`PASS desktop wheel scroll 1366x768: scrollY=${scrollTop}`);
            } finally {
              await context.close();
            }
          }

          (async () => {
            assert.match(expectedSha, /^[0-9a-f]{40}$/, `invalid expected SHA: ${expectedSha}`);
            await assertProtectedMainIsStillExpected();
            const release = await waitForCurrentRelease();
            assert.equal(release.sourceCommit, expectedSha, 'live release sourceCommit must equal protected main SHA');
            await verifyLiveAssets(release);
            for (const route of ['/', '/app', '/privacy', '/terms']) {
              const response = await fetch(`${productionUrl}${route}?live_verify=${expectedSha}`, { redirect: 'manual', cache: 'no-store' });
              assert.equal(response.status, 200, `${route} returned HTTP ${response.status}`);
              assert.equal(response.headers.get('location'), null, `${route} unexpectedly redirected`);
              console.log(`PASS live route ${route}: HTTP 200`);
            }
            const appHtmlResponse = await fetch(`${productionUrl}/app.html?live_verify=${expectedSha}`, { redirect: 'manual', cache: 'no-store' });
            assert.equal(appHtmlResponse.status, 308, `/app.html returned unexpected HTTP ${appHtmlResponse.status}`);
            assert.equal(new URL(appHtmlResponse.headers.get('location'), productionUrl).pathname, '/app', `/app.html redirected to an unexpected path: ${appHtmlResponse.headers.get('location')}`);
            console.log('PASS live route /app.html: HTTP 308 canonical redirect to /app');
            await verifyPermanentRedirect(wwwUrl, '/app?cutover_verify=1');
            await verifyPermanentRedirect(pagesDevUrl, '/app?cutover_verify=1');
            await verifyPreviewIsNotRedirected();
            const browser = await chromium.launch({ headless: true });
            try {
              for (const route of ['/', '/app', '/app.html']) {
                for (const [width, height] of [[320, 568], [390, 844], [430, 932], [568, 320]]) {
                  await verifyMobileTouchScroll(browser, route, width, height);
                }
              }
              await verifyDesktopWheelScroll(browser);
            } finally {
              await browser.close();
            }
            console.log(`LIVE PRODUCTION VERIFICATION PASSED: ${productionUrl} @ ${expectedSha}`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
